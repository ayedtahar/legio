    { id:'b', scopes:['*'], txt:'Creuser des dérivations pour abaisser le niveau du fleuve',
      test:{attr:'disciplina', unit:'fatigatio', dc:10, inv:true}, risque:'moyen',
      succes:{ txt:'Trois canaux de trente pieds. Le fleuve baisse assez pour qu’un gué apparaisse. Les Pompéiens regardent une armée déplacer une rivière et commencent à comprendre à qui ils ont affaire.', eff:{disciplina:4,scientia:3,fama:6}, perf:5 },
      echec:{ txt:'Les canaux prennent une semaine et le fleuve baisse de deux pieds. C’est un pied de trop.', eff:{unit:{fatigatio:20,fides:-4}}, perf:-2 } },
    { id:'c', scopes:['*'], txt:'Tenir, rationner, attendre la décrue',
      test:{attr:'auctoritas', unit:'fides', dc:5}, risque:'moyen',
      succes:{ txt:'Tu rationnes, tu occupes les hommes, tu attends. La crue passe. C’était le pari le moins glorieux et il n’était pas mauvais.', eff:{auctoritas:2,disciplina:2,unit:{fides:4}}, perf:2 },
      echec:{ txt:'La faim entame la discipline. Deux hommes désertent vers Afranius et racontent tout ce qu’ils savent.', eff:{unit:{fides:-9},fama:-4}, perf:-2 } }
    ]},
  { titre:'Les deux camps se parlent',
    texte:`Le blocage rompu, les Pompéiens décrochent vers l’Èbre et nous les devançons par une marche de nuit à travers un défilé. Les deux armées campent à portée de voix. Et alors les soldats se mettent à s’appeler par leur nom d’un camp à l’autre, à se rendre visite, à demander des nouvelles des familles.`,
    vue:{ soldat:'Un homme de la Deuxième te reconnaît. Vous avez servi ensemble en Gaule.', sousoff:'La moitié de ta centurie est dans le camp d’en face à boire.', centurion:'Petreius fait tuer les nôtres qu’il trouve dans son camp. César renvoie les siens intacts.', superieur:'Cette fraternisation gagne la guerre plus sûrement qu’une bataille.' },
    opts:[
    { id:'a', scopes:['*'], txt:'Traverser et parler à ceux d’en face',
      test:{attr:'ingenium', dc:0}, risque:'moyen',
      succes:{ txt:'Tu passes une soirée avec des hommes qui t’ont couvert le flanc à Alésia. Vous convenez qu’aucun de vous ne sait pourquoi il est là. Deux jours plus tard, ils se rendent sans un coup de glaive.', eff:{ingenium:3,fama:5,favor:{caesar:6}}, perf:5 },
      echec:{ txt:'Petreius fait fouiller le camp pendant que tu y es. Tu sors par-dessus la palissade et tu laisses ton manteau.', eff:{valetudo:-10,fama:-2}, blessure:.2, perf:-1 } },
    { id:'b', scopes:['sousoff','centurion','superieur'], txt:'Renvoyer intacts les Pompéiens trouvés dans notre camp',
      test:{attr:'auctoritas', dc:-5}, risque:'faible',
      succes:{ txt:'Tu les fais raccompagner à la porte avec leurs armes, pendant que Petreius égorge les nôtres dans son camp. La différence circule dans les deux armées avant le soir. C’est la seule arme qui compte dans cette guerre.', eff:{auctoritas:3,ingenium:3,fama:7,favor:{caesar:9}}, perf:5 },
      echec:{ txt:'Deux de tes hommes en profitent pour régler un compte. Le geste est gâché et tu dois t’en expliquer.', eff:{fama:-4,favor:{caesar:-4}}, perf:-1 } },
    { id:'c', scopes:['*'], txt:'Interdire tout contact et fermer ton secteur',
      test:{attr:'disciplina', dc:5}, risque:'faible',
      succes:{ txt:'Ton secteur reste étanche. Discipline irréprochable, et tu passes à côté de la manœuvre politique la plus habile de la guerre.', eff:{disciplina:4,unit:{cohaesio:4}}, perf:2 },
      echec:{ txt:'On passe quand même, par-dessus le fossé, la nuit. Ton interdiction est un ordre non exécuté de plus.', eff:{auctoritas:-3}, perf:-1 } }
    ]},
  { titre:'La soif',
    texte:`Coupés de l’eau, entourés sans être attaqués, les Pompéiens capitulent. César ne demande rien : ni serment, ni service. Il licencie l’armée et rembourse même le blé. Cinq légions disparaissent sans qu’il y ait eu de bataille.`,
    vue:{ soldat:'On te fait garder un point d’eau contre des Romains qui ont soif.', sousoff:'Ils envoient des hommes désarmés chercher de l’eau. Il faut décider.', centurion:'Tes ordres sont d’interdire l’accès à la rivière.', superieur:'Un assaut coûterait deux mille hommes et gagnerait deux jours.' },
    opts:[
    { id:'a', scopes:['*'], txt:'Interdire l’eau strictement',
      test:{attr:'disciplina', dc:-10}, risque:'faible',
      succes:{ txt:'Rien ne passe. Ils capitulent quarante-huit heures plus tôt. Aucun mort des deux côtés — c’est la soif qui a fait le travail.', eff:{disciplina:3,favor:{caesar:5}}, perf:3 },
      echec:{ txt:'Un poste laisse passer. Le siège dure trois jours de plus et l’on te le fait remarquer.', eff:{fama:-3}, perf:-1 } },
    { id:'b', scopes:['*'], txt:'Laisser boire les non-combattants',
      test:{attr:'ingenium', dc:5}, risque:'moyen',
      succes:{ txt:'Tu laisses passer les valets et les mulets. Cela ne change rien à l’issue et cela change tout à ce que ces hommes diront de nous, dans dix ans, dans les tavernes de Tarragone.', eff:{ingenium:3,fama:4,unit:{fides:6}}, perf:3 },
      echec:{ txt:'Des combattants passent parmi les valets et le siège s’étire. Ton indulgence a un nom dans le rapport et ce n’est pas indulgence.', eff:{favor:{caesar:-5},fama:-3}, perf:-2 } },
    { id:'c', scopes:['centurion','superieur'], txt:'Proposer à César de donner l’assaut pour en finir',
      test:{attr:'virtus', dc:20}, risque:'élevé',
      succes:{ txt:'Il t’écoute, te remercie, et refuse : « Pourquoi perdrais-je des hommes, même les leurs ? » Tu comprends ce jour-là que tu sers un homme qui compte différemment.', eff:{virtus:2,scientia:3,favor:{caesar:3}}, perf:4 },
      echec:{ txt:'« Vous êtes pressé de tuer des Romains. » Il le dit sans hausser la voix, devant six officiers. Tu t’en souviendras longtemps.', eff:{favor:{caesar:-10},fama:-5}, perf:-3 } }
    ]}
  ]};

BATAILLES.dyrrachium = {
  nom:'Dyrrachium', lieu:'Lignes de siège, Épire', date:'Juillet 48 av. J.-C.',
  ennemi:'Pompée — armée double, maîtrise de la mer', dc:68, issue:'défaite',
  intro:`Nous assiégeons un adversaire deux fois plus nombreux, ravitaillé par mer, pendant que nous mangeons une racine appelée <span class="lat">chara</span>, broyée et mêlée de lait. Quinze milles de lignes tenues à un homme tous les trois pas. Pompée n’a qu’à trouver le point faible, et il a tout le temps du monde.`,
  phases:[
  { titre:'Le fortin de Scaeva',
    texte:`Deux transfuges allobroges ont livré à Pompée le plan exact de nos lignes et le point de jonction inachevé. Il y jette soixante cohortes par terre et par mer, sur trois faces à la fois. Un fortin tient : celui où commande le centurion Cassius Scaeva.`,
    vue:{ soldat:'Le fortin reçoit des traits des trois côtés. Il en tombe comme de la pluie.', sousoff:'Le centurion a un œil crevé et continue de commander.', centurion:'Le fortin est intenable. L’ordre est de tenir.', superieur:'Si ce fortin tombe, la ligne entière est prise à revers.' },
    opts:[
    { id:'a', scopes:['*'], txt:'Tenir le fortin coûte que coûte',
      test:{attr:'virtus', unit:'fides', dc:20}, risque:'très élevé',
      crit:{ txt:'On ramassera cent vingt trous dans le bouclier de Scaeva et trente mille traits dans le fortin. Tu es de ceux qui n’en sont pas sortis en courant. César donnera deux cent mille sesterces à Scaeva et une double solde à tous les survivants — toi compris.', eff:{virtus:7,fama:16,auctoritas:4,peculium:1200,favor:{caesar:14,scaeva:20}}, pertes:26, blessure:.5, mort:.05, perf:12 },
      succes:{ txt:'Le fortin tient. Tu en sors avec le bras gauche inutilisable et une réputation qui te suivra jusqu’en Espagne.', eff:{virtus:5,fama:11,peculium:600,favor:{caesar:9,scaeva:12}}, pertes:24, blessure:.6, perf:10 },
      echec:{ txt:'Le fortin tient sans toi : on t’a évacué inconscient au bout d’une heure. Personne ne te le reproche. Personne ne l’oublie non plus.', eff:{valetudo:-28,fama:-2}, blessure:.8, mort:.09, pertes:24, perf:-1 } },
    { id:'b', scopes:['centurion','superieur'], txt:'Faire décrocher la garnison et rétablir la ligne en arrière',
      test:{attr:'scientia', unit:'experientia', dc:15}, risque:'élevé',
      succes:{ txt:'Tu sacrifies le fortin et tu sauves la garnison en te repliant sur une seconde ligne improvisée. Militairement c’est juste. Dans une armée, c’est un mot qu’on t’accolera longtemps.', eff:{scientia:4,auctoritas:2,fama:-4,unit:{fides:7}}, pertes:11, perf:5 },
      echec:{ txt:'Le décrochage sous assaut se paie comptant : tu perds le fortin et la moitié de la garnison.', eff:{fama:-8,unit:{fides:-8}}, pertes:28, blessure:.4, mort:.05, perf:-3 } }
    ]},
  { titre:'La déroute',
    texte:`Trente-deux enseignes perdues, mille hommes tués — dont trente-deux tribuns et centurions, la plupart écrasés dans la fuite par les leurs plutôt que par l’ennemi. Un porte-enseigne blessé tend son aigle à des cavaliers en disant : « Rendez-la au moins à César. »`,
    vue:{ soldat:'Tu cours au milieu d’hommes qui courent.', sousoff:'Ton enseigne est encore debout. Beaucoup ne le sont plus.', centurion:'Tu peux arrêter une trentaine d’hommes si tu te mets en travers maintenant.', superieur:'Si Pompée pousse, la guerre finit ce soir. Il ne pousse pas.' },
    opts:[
    { id:'a', scopes:['*'], txt:'Te mettre en travers de la fuite, enseigne en main',
      test:{attr:'auctoritas', dc:20}, risque:'très élevé',
      succes:{ txt:'Tu plantes l’enseigne et tu cries. Une trentaine d’hommes s’arrêtent, puis cent. César fera la même chose plus loin et se fera bousculer par ses propres soldats — un porte-enseigne retournera son aigle contre lui. Toi, on t’écoute.', eff:{auctoritas:6,virtus:4,fama:12,favor:{caesar:10}}, pertes:14, blessure:.35, perf:12 },
      echec:{ txt:'Le flot te renverse et te piétine. On te relève avec trois côtes cassées et l’enseigne perdue.', eff:{valetudo:-24,fama:-6}, blessure:.6, mort:.05, pertes:18, perf:-4 } },
    { id:'b', scopes:['*'], txt:'Sauver ton unité et te replier en ordre',
      test:{attr:'disciplina', unit:'cohaesio', dc:5}, risque:'moyen',
      succes:{ txt:'Tu ramènes ton monde groupé, avec les enseignes et les blessés. Dans une déroute, une unité intacte vaut trois unités.', eff:{disciplina:4,auctoritas:3,unit:{cohaesio:6,fides:8},fama:4}, pertes:9, perf:5 },
      echec:{ txt:'La cohésion craque à deux cents pas de la ligne. Tu rentres avec les deux tiers de tes gens et sans savoir où sont les autres.', eff:{unit:{cohaesio:-14}}, pertes:20, blessure:.3, perf:-2 } },
    { id:'c', scopes:['*'], txt:'Récupérer les enseignes tombées',
      test:{attr:'virtus', dc:15}, risque:'élevé',
      succes:{ txt:'Tu en ramènes trois. Les enseignes perdues sont ce dont une légion ne se remet pas ; celles-là, elle les a encore.', eff:{virtus:4,fama:10,unit:{cohaesio:8},favor:{caesar:8}}, pertes:16, blessure:.4, perf:9 },
      echec:{ txt:'Tu en ramènes une, et il t’en a coûté quatre hommes. Le calcul n’est pas bon et tu le sais.', eff:{fama:2,unit:{fides:-4}}, pertes:20, blessure:.45, mort:.04, perf:-1 } }
    ]},
  { titre:'« Aujourd’hui la victoire était à l’ennemi »',
    texte:`César rassemble l’armée. Il casse plusieurs porte-enseignes, dégrade, et dit cette phrase que tout le camp répétera : « Aujourd’hui la victoire était à l’ennemi, s’ils avaient eu quelqu’un pour vaincre. » Les légions, humiliées, demandent d’elles-mêmes la décimation. Il refuse. On lève le camp la nuit même vers la Thessalie.`,
    vue:{ soldat:'Les hommes réclament d’être punis. Tu n’as jamais vu cela.', sousoff:'Ta centurie veut se racheter et le dit tout haut.', centurion:'On te demande de désigner les fautifs de ton secteur.', superieur:'Une armée humiliée qui veut se racheter est l’arme la plus dangereuse qui existe.' },
    opts:[
    { id:'a', scopes:['*'], txt:'Assumer devant César pour tes hommes',
      test:{attr:'auctoritas', dc:10}, risque:'moyen',
      succes:{ txt:'Tu dis que la faute est au commandement du secteur, c’est-à-dire à toi. Il te regarde, ne dit rien, et ne te retire rien. Tes hommes non plus ne diront rien, et te suivront à Pharsale comme des chiens.', eff:{auctoritas:5,fama:6,unit:{fides:14}}, perf:5 },
      echec:{ txt:'Tu t’accuses trop bien. On te prend au mot : tu descends d’un cran dans l’ordre des cohortes.', eff:{fama:-6,auctoritas:-3,favor:{caesar:-4}}, perf:-2 } },
    { id:'b', scopes:['*'], txt:'Désigner les fautifs comme demandé',
      test:{attr:'disciplina', dc:0}, risque:'faible',
      succes:{ txt:'Tu donnes trois noms exacts, sans en ajouter ni en retrancher. On les casse de leur grade et l’on te sait juste.', eff:{disciplina:3,auctoritas:2,unit:{fides:-3}}, perf:2 },
      echec:{ txt:'Tes noms sont contestés par les hommes eux-mêmes, qui en donnent d’autres. Tu passes pour un officier qui ne sait pas ce qui se passe dans son unité.', eff:{auctoritas:-4,fama:-4}, perf:-1 } },
    { id:'c', scopes:['*'], txt:'Faire jurer à ton unité de ne pas reculer devant Pompée',
      test:{attr:'auctoritas', unit:'fides', dc:5}, risque:'moyen',
      succes:{ txt:'Ils jurent devant l’enseigne, à voix basse, sans emphase, comme des gens qui ont l’intention de tenir parole. Ils la tiendront dans trois semaines, en Thessalie.', eff:{auctoritas:4,unit:{fides:12,cohaesio:8},fama:4}, perf:5 },
      echec:{ txt:'Le serment sonne creux dans une unité qui vient d’être battue. Ils le prêtent parce que tu le demandes, et c’est tout.', eff:{unit:{fides:2}}, perf:0 } }
    ]}
  ]};

BATAILLES.pharsale = {
  nom:'Pharsale', lieu:'Plaine de l’Énipeus, Thessalie', date:'9 août 48 av. J.-C.',
  ennemi:'Pompée — 45 000 fantassins, 7 000 cavaliers', dc:64, issue:'victoire décisive',
  intro:`Vingt-deux mille contre quarante-cinq mille, et sept mille cavaliers contre mille. Labienus, qui fut le premier légat de César pendant neuf ans et connaît chacune de nos habitudes, a juré au conseil pompéien de ne revenir au camp que vainqueur. Le mot d’ordre de notre côté est <span class="lat">Venus Victrix</span>. Du leur, <span class="lat">Hercules Invictus</span>.`,
  phases:[
  { titre:'La quatrième ligne',
    texte:`César a vu que toute la cavalerie ennemie est massée à leur gauche, face à notre droite : elle nous débordera et nous prendra à revers, c’est mathématique. Alors il retire six cohortes de la troisième ligne et les poste en oblique derrière la droite, cachées, avec un ordre singulier.`,
    vue:{ soldat:'On te retire du rang et on te place en arrière, en biais, sans t’expliquer.', sousoff:'Ordre étrange : ne pas lancer le pilum. Le garder en main comme une pique.', centurion:'Ta cohorte fait partie des six. L’ordre est de viser le visage.', superieur:'Six cohortes contre sept mille cavaliers. Toute la bataille tient là-dessus.' },
    opts:[
    { id:'a', scopes:['*'], txt:'Exécuter l’ordre à la lettre : pilum en main, pointer au visage', note:'Ce sont de jeunes nobles romains, beaux, qui craignent plus une cicatrice que la mort.',
      test:{attr:'disciplina', unit:'cohaesio', dc:10}, risque:'élevé',
      crit:{ txt:'Sept mille cavaliers arrivent sur six cohortes qui se lèvent d’un coup et leur portent le fer de pilum au visage. Ils tournent bride tous ensemble et n’arrêtent qu’aux collines. La bataille est jouée en quatre minutes, sur une idée.', eff:{disciplina:5,virtus:4,fama:14,favor:{caesar:14}}, pertes:9, perf:11 },
      succes:{ txt:'La ligne se lève, les fers montent aux visages, la cavalerie se disloque. Tu ne comprendras qu’après ce que vous venez de faire.', eff:{disciplina:4,virtus:3,fama:9,favor:{caesar:9}}, pertes:12, blessure:.25, perf:9 },
      echec:{ txt:'Le mouvement part trop tôt, les cohortes sont vues, et la charge se dévie sur ton flanc au lieu de se briser dessus.', eff:{unit:{cohaesio:-12}}, pertes:22, blessure:.4, perf:-3 } },
    { id:'b', scopes:['*'], txt:'Lancer les pila comme d’habitude et recevoir la charge',
      test:{attr:'virtus', dc:20}, risque:'très élevé',
      succes:{ txt:'Tu fais ce que tu as toujours fait. La volée abat des chevaux, la charge passe quand même, et il faut se battre contre de la cavalerie sans piques. Vous tenez, chèrement.', eff:{virtus:3}, pertes:24, blessure:.45, mort:.04, perf:0 },
      echec:{ txt:'La charge te passe dessus. Ce que six cohortes devaient briser, elles ne l’ont pas brisé, et l’aile droite est tournée.', eff:{fama:-8,favor:{caesar:-8},unit:{cohaesio:-16}}, pertes:32, blessure:.5, mort:.08, perf:-4 } }
    ]},
  { titre:'La ligne qui n’avance pas',
    texte:`Pompée a ordonné à son infanterie de recevoir notre charge à pied ferme, sans avancer, pour que nous arrivions essoufflés. Nos hommes, à mi-chemin, voient que l’ennemi ne bouge pas — et s’arrêtent d’eux-mêmes pour reprendre haleine, sans qu’un ordre soit donné, puis repartent.`,
    vue:{ soldat:'Le rang s’arrête tout seul. Personne n’a rien crié.', sousoff:'Dix ans de service font qu’une ligne pense sans qu’on lui parle.', centurion:'Tes hommes ont corrigé une erreur de l’ennemi tout seuls.', superieur:'Pompée vient de perdre l’élan de ses propres rangs pour rien.' },
    opts:[
    { id:'a', scopes:['*'], txt:'Laisser faire et repartir avec eux',
      test:{attr:'disciplina', unit:'experientia', dc:-10}, risque:'faible',
      succes:{ txt:'Tu ne dis rien parce qu’il n’y a rien à dire : ils ont raison. C’est une armée qui n’a plus besoin qu’on lui explique.', eff:{disciplina:3,unit:{cohaesio:6,experientia:4}}, pertes:6, perf:3 },
      echec:{ txt:'Ton unité, moins aguerrie, s’arrête et ne repart pas au même moment que les autres. Le choc se fait en désordre.', eff:{unit:{cohaesio:-6}}, pertes:12, perf:-1 } },
    { id:'b', scopes:['sousoff','centurion','superieur'], txt:'Crier de charger sans s’arrêter',
      test:{attr:'auctoritas', dc:15}, risque:'moyen',
      succes:{ txt:'Ton unité arrive la première, essoufflée mais lancée, et enfonce avant que les autres n’arrivent. C’est brillant, c’est risqué, et cela laisse tes flancs nus une minute entière.', eff:{virtus:4,fama:7}, pertes:15, blessure:.3, perf:3 },
      echec:{ txt:'Tu arrives seul, sans souffle, devant une ligne fraîche. La minute qui suit est la plus longue de ta vie.', eff:{valetudo:-18,unit:{cohaesio:-8}}, pertes:24, blessure:.45, mort:.04, perf:-2 } }
    ]},
  { titre:'Le camp de Pompée',
    texte:`La troisième ligne fraîche, encore jamais engagée, entre dans la bataille au moment où la cavalerie fuit. La ligne pompéienne casse. Dans leur camp, on trouve les tentes ornées de myrte, les tables dressées, l’argenterie sortie : ils avaient préparé le banquet de la victoire. Pompée est parti à cheval par la porte arrière.`,
    vue:{ soldat:'Tu entres dans un camp où le repas est servi.', sousoff:'Tes hommes se jettent sur les tables plutôt que sur les fuyards.', centurion:'On peut piller le camp ou poursuivre les légions qui refluent vers la colline.', superieur:'Poursuivre maintenant, c’est finir la guerre aujourd’hui.' },
    opts:[
    { id:'a', scopes:['*'], txt:'Poursuivre sans s’arrêter au camp',
      test:{attr:'disciplina', unit:'fatigatio', dc:15, inv:true}, risque:'moyen',
      succes:{ txt:'Tu passes devant les tables sans regarder et tu montes sur la colline où ils se sont réfugiés. On les coupe de l’eau ; au matin, vingt-quatre mille hommes se rendent. La guerre pouvait durer trois ans ; elle a duré une après-midi.', eff:{disciplina:5,fama:10,favor:{caesar:12}}, pertes:8, perf:7 },
      echec:{ txt:'Tes hommes ne t’écoutent pas : il y a de l’argenterie sur les tables et six mois de racines dans le ventre. Tu les regardes piller.', eff:{auctoritas:-4,peculium:500}, perf:-2 } },
    { id:'b', scopes:['*'], txt:'Piller le camp',
      test:{attr:'ingenium', dc:-10}, risque:'faible',
      succes:{ txt:'La vaisselle des sénateurs de Rome, les coffres, les chevaux. Tu ne reverras jamais un butin pareil et tu le sais.', eff:{peculium:1400,unit:{fides:5},fama:-3,favor:{caesar:-4}}, perf:1 },
      echec:{ txt:'Tu arrives après les autres. Il reste des couronnes de myrte et de la vaisselle cassée.', eff:{peculium:300,fama:-3}, perf:-1 } },
    { id:'c', scopes:['centurion','superieur'], txt:'Faire épargner et rassembler les prisonniers romains', note:'César a donné l’ordre : « Épargnez les citoyens. » Il l’a donné à des hommes qui viennent de perdre des camarades.',
      test:{attr:'auctoritas', dc:10}, risque:'moyen',
      succes:{ txt:'Tu tiens tes hommes et tu ramasses les rendus par centaines, désarmés, vivants. Beaucoup serviront sous nos enseignes avant six mois. C’est ainsi que César gagne : il ne détruit pas les armées, il les absorbe.', eff:{auctoritas:5,ingenium:3,fama:8,favor:{caesar:12}}, perf:6 },
      echec:{ txt:'On tue plus qu’il n’aurait fallu dans ton secteur. Six mille morts sur le champ, dont beaucoup après la fin. Ton nom figure dans un rapport où il n’aurait pas dû.', eff:{favor:{caesar:-8},fama:-5}, perf:-2 } }
    ]},
  { titre:'Labienus',
    texte:`Il avait juré de ne revenir au camp que vainqueur. Il ne revient pas : il passe en Afrique par la Grèce, avec ce qu’il peut sauver, et continuera la guerre trois ans encore. Sur le champ, César regarde les morts romains et dit : « Ils l’ont voulu. »`,
    vue:{ soldat:'On enterre. Six mille Romains.', sousoff:'Tu reconnais des visages dans les fossés.', centurion:'Des hommes qui ont servi sous toi en Gaule sont en face, morts ou rendus.', superieur:'Le corps de la République est là, dans la plaine, et l’on doit décider quoi en faire.' },
    opts:[
    { id:'a', scopes:['*'], txt:'Faire enterrer les morts des deux camps sans distinction',
      test:{attr:'auctoritas', dc:0}, risque:'faible',
      succes:{ txt:'Mêmes fosses, mêmes rites, même hâte. Ce sont des Romains. On ne sait plus qui était de quel côté au bout de trois heures, et c’est peut-être exactement le sujet.', eff:{auctoritas:3,fama:6,unit:{fides:8}}, perf:3 },
      echec:{ txt:'Les hommes rechignent à enterrer ceux qui les ont attaqués hier. Il faut leur ordonner deux fois.', eff:{unit:{fides:-3}}, perf:0 } },
    { id:'b', scopes:['*'], txt:'Chercher parmi les rendus ceux que tu connais',
      test:{attr:'ingenium', dc:0}, risque:'faible',
      succes:{ txt:'Tu en retrouves deux ou trois. On se serre le bras, on ne se dit rien, ils reprendront du service sous d’autres enseignes. C’est ainsi que finissent les guerres civiles : dans une gêne.', eff:{ingenium:2,fama:3}, perf:2 },
      echec:{ txt:'Ceux que tu cherches ne sont ni parmi les vivants ni identifiables parmi les morts.', eff:{valetudo:-4}, perf:0 } },
    { id:'c', scopes:['centurion','superieur'], txt:'Brûler la correspondance saisie de Pompée sans la lire', note:'Ce que César a fait, publiquement, avec les lettres qui compromettaient la moitié de Rome.',
      test:{attr:'ingenium', dc:10}, risque:'moyen',

BATAILLES.pharos = {
  nom:'Le Phare', lieu:'Alexandrie, môle de l’Heptastade', date:'Hiver–printemps 47 av. J.-C.',
  ennemi:'20 000 Alexandrins dans leur propre ville', dc:62, issue:'victoire de justesse',
  intro:`Trois mille deux cents hommes dans une ville de trois cent mille, enfermés dans le quartier du palais. Les Alexandrins ont coupé les aqueducs et pompent l’eau de mer dans les citernes. On creuse des puits dans le sable jour et nuit. Le combat se fait de terrasse en terrasse, de rue en rue, dans une ville où l’on ne voit jamais à plus de vingt pas.`,

      succes:{ txt:'Tu gagnes la nuit. L’eau est trouvée avant que la promesse ne vienne à échéance, et personne ne te la rappelle.', eff:{ingenium:3,unit:{fides:3}}, perf:2 },
      echec:{ txt:'L’eau n’est pas trouvée et les hommes se souviennent très bien de ce que tu as promis.', eff:{auctoritas:-5,unit:{fides:-10}}, perf:-2 } }

  { titre:'Le môle',
    texte:`Il faut prendre le môle qui relie le Phare à la ville pour dégager le port. On l’enlève, puis les Alexandrins contre-attaquent et la panique prend nos hommes sur une chaussée où l’on ne peut ni fuir ni manœuvrer. César lui-même doit sauter d’un navire qui coule et gagner le sien à la nage, sur deux cents pas, en tenant ses papiers d’une main hors de l’eau.`,

      succes:{ txt:'Cotte de mailles à la mer, bouclier à la mer, et deux cents pas de nage. On perd l’équipement de trois centuries et l’on ramène trois centuries d’hommes.', eff:{scientia:3,unit:{fides:9},peculium:-200}, pertes:9, perf:5 },

BATAILLES.ruspina = {
  nom:'Ruspina', lieu:'Plaine côtière d’Africa', date:'4 janvier 46 av. J.-C.',
  ennemi:'Labienus — cavalerie numide et archers montés', dc:66, issue:'survie',
  intro:`Trente cohortes en fourrage, sans cavalerie ou presque. Labienus arrive avec de la cavalerie numide et des archers montés, et se met à faire ce qu’aucune infanterie ne sait combattre : tourner autour, tirer, refuser le choc, recommencer. Il connaît les légions de César mieux que quiconque : il les a formées.`,
  phases:[
  { titre:'L’encerclement',
    texte:`Ils forment un anneau autour de nous et le resserrent. Quand nos hommes chargent, ils se dérobent ; quand nos hommes reviennent, ils reviennent aussi. Le rang romain n’a rien à mordre. Labienus s’avance tête nue et interpelle les nôtres : « Alors, bleus de la Deuxième ? Vous êtes bien féroces ! »`,
    vue:{ soldat:'Tu vois Labienus à quarante pas, sans casque, qui te parle.', sousoff:'Un vétéran de ta centurie sort du rang.', centurion:'Ta cohorte est en anneau, dos à dos, et perd un homme toutes les vingt secondes.', superieur:'César fait former un cercle unique et alterner les cohortes face en avant, face en arrière.' },
    opts:[
    { id:'a', scopes:['*'], txt:'Répondre à Labienus',
      test:{attr:'ingenium', dc:5}, risque:'moyen',
      succes:{ txt:'Un vieux de la Dixième ôte son casque pour qu’il le reconnaisse et lui jette son pilum, qui tue son cheval : « Voilà pour t’apprendre que c’est un vétéran de la Dixième qui te parle. » Toute la ligne éclate de rire, et le rire vaut trois cohortes.', eff:{ingenium:3,virtus:2,fama:8,unit:{fides:12,cohaesio:8}}, pertes:8, perf:6 },
      echec:{ txt:'Tu réponds mal, ou trop tard, et la réplique tombe dans le sable. Les hommes autour de toi ont l’air plus vieux qu’il y a une minute.', eff:{fama:-4,unit:{cohaesio:-5}}, pertes:12, perf:-2 } },

      echec:{ txt:'Le cercle se forme à moitié. Les hommes qui devaient faire face en arrière regardent en avant, et les flèches entrent par-derrière.', eff:{unit:{cohaesio:-12}}, pertes:22, blessure:.45, mort:.04, perf:-3 } },
    { id:'c', scopes:['*'], txt:'Charger pour rompre l’anneau et gagner la crête',
      test:{attr:'virtus', unit:'fatigatio', dc:20, inv:true}, risque:'très élevé',
      succes:{ txt:'Une pointe brutale, courte, et vous êtes dehors avec une hauteur sous les pieds. Ils ne peuvent plus tourner autour de vous.', eff:{virtus:5,fama:9,unit:{cohaesio:5}}, pertes:17, blessure:.35, perf:10 },
      echec:{ txt:'La charge s’étire, la cohorte se disloque, et une cohorte disloquée face à de la cavalerie légère n’est plus une cohorte : c’est une file de cibles.', eff:{unit:{cohaesio:-16},fama:-6}, pertes:30, blessure:.5, mort:.09, perf:-4 } }
    ]},
  { titre:'Le décrochage',
    texte:`Le combat dure du matin au soir sans que la ligne cède. À la nuit, César fait décrocher vers le camp de Ruspina, en marchant en carré, blessés au centre. Ce n’est pas une victoire : c’est une armée qui rentre entière alors qu’elle aurait dû être détruite.`,
    vue:{ soldat:'Tu marches depuis onze heures et tu n’as pas mangé.', sousoff:'Les blessés au centre. Personne n’est laissé.', centurion:'Deux milles à faire en carré, sous les flèches.', superieur:'Un carré qui marche est la formation la plus difficile de l’art militaire.' },

      test:{attr:'disciplina', unit:'cohaesio', dc:5}, risque:'moyen',

      echec:{ txt:'Le carré s’étire, l’arrière presse, l’avant accélère. On arrive au camp avec un tiers des blessés en moins qu’au départ.', eff:{unit:{fides:-10},fama:-5}, pertes:18, blessure:.3, perf:-2 } },

    vue:{ soldat:'On te fait manœuvrer six heures par jour, comme un bleu.', sousoff:'Tes vétérans grognent. Tu ferais pareil.', centurion:'Tu peux exiger, expliquer, ou laisser filer.', superieur:'Il faut réoutiller mentalement une armée en trois mois.' },

    { id:'b', scopes:['*'], txt:'Exercer jusqu’à ce que ce soit un réflexe',
      test:{attr:'disciplina', unit:'fatigatio', dc:10, inv:true}, risque:'moyen',
      succes:{ txt:'Six heures par jour, trois semaines. À Thapsus, ils le feront sans y penser, et c’est tout ce qui compte.', eff:{disciplina:4,unit:{experientia:12,fatigatio:18}}, perf:5 },
      echec:{ txt:'À force, tu casses le ressort. Les hommes exécutent sans conviction et deux se blessent bêtement à l’exercice.', eff:{unit:{fides:-7,fatigatio:22}}, perf:-2 } }

BATAILLES.thapsus = {

      echec:{ txt:'Un centurion qui se met devant une charge de vétérans se fait renverser. C’est ce qui arrive, littéralement, et l’on te ramasse.', eff:{valetudo:-14,auctoritas:-3}, blessure:.3, pertes:10, perf:-2 } }

  { titre:'Les éléphants',

    echec:{ txt:'Le camp tient, de justesse, grâce à un vieux centurion malade et pas grâce à toi.', eff:{fama:-2,favor:{balventius:3}} } } ]},

carrhes:{ titre:'Il n’en reste que deux',
  texte:`Crassus est mort en Parthie avec sept légions. Le triumvirat n’existe plus. Julia, la fille de César et femme de Pompée, est morte en couches l’an dernier. Il n’y a plus rien, ni alliance ni parenté, entre les deux hommes qui possèdent des armées.`,
  opts:[
  { id:'a', scopes:['*'], txt:'Écouter ce qui se dit au camp',
    test:{attr:'ingenium', dc:-5}, succes:{ txt:'Les vétérans disent que cela finira mal et qu’ils suivront César. Les jeunes tribuns de bonne famille disent le contraire, à voix basse. Tu sais désormais qui pense quoi, et cela vaudra cher dans six ans.', eff:{ingenium:3,scientia:2} },
    echec:{ txt:'Tu écoutes et l’on te voit écouter. Deux officiers cessent de parler quand tu approches.', eff:{fama:-2} } },
  { id:'b', scopes:['*'], txt:'Écrire à ta famille de placer l’argent en terre plutôt qu’en prêts',
    test:{attr:'scientia', dc:5}, succes:{ txt:'La terre survit aux guerres civiles ; les créances, non. Ton correspondant en Italie exécute. Dans huit ans, tu seras l’un des rares du camp à posséder encore ce qu’il possédait.', eff:{scientia:3,peculium:200,ingenium:2} },
    echec:{ txt:'Ta lettre arrive après la vente. Le prix des terres a déjà monté.', eff:{peculium:-100} } },
  { id:'c', scopes:['centurion','superieur'], txt:'Sonder discrètement les patrons sur leur position',
    test:{attr:'ingenium', dc:15}, succes:{ txt:'Tu apprends que Labienus a des terres dans le Picénum, pays de Pompée, et qu’il y écrit souvent. C’est un détail. En 49, ce sera le détail.', eff:{ingenium:5,scientia:3,favor:{labienus:-3}} },
    echec:{ txt:'Ta curiosité se voit. Labienus te fait dire, par un tiers, qu’un bon officier ne s’occupe pas de politique.', eff:{favor:{labienus:-8},fama:-3} } } ]},

pacification:{ titre:'Deux cents sesterces par homme',
  texte:`Après quarante jours de raid hivernal, César fait distribuer une gratification sur sa cassette personnelle : deux cents sesterces par légionnaire, deux mille par centurion. Il fait cela souvent. Le Sénat le lui reproche, l’armée non.`,
  opts:[
  { id:'a', scopes:['*'], txt:'Prendre l’argent',
    test:{attr:'disciplina', dc:-25}, succes:{ txt:'C’est de l’argent. Il vient d’un homme et non de la République, et personne au camp ne fait la différence — ce qui est exactement le sujet.', eff:{peculium:'stip*0.35',favor:{caesar:3}} },
    echec:{ txt:'Tu prends l’argent. Un vieux tribun de la vieille école te dit que c’est ainsi qu’on achète une armée. Il n’a pas tort et tu prends l’argent quand même.', eff:{peculium:'stip*0.35'} } },
  { id:'b', scopes:['sousoff','centurion','superieur'], txt:'Redistribuer ta part à ton unité',
    test:{attr:'auctoritas', dc:-5}, succes:{ txt:'Tu partages ta gratification entre tes hommes, au prorata des années de service. Ils ne l’oublieront pas et tu viens de construire quelque chose qui ne s’achète pas.', eff:{unit:{fides:16},auctoritas:4,fama:5,peculium:-400} },
    echec:{ txt:'Le partage soulève des disputes sur les critères. Tu passes deux soirées à arbitrer des querelles de dix deniers.', eff:{unit:{fides:6},peculium:-400,auctoritas:-1} } } ]},

legions_rendues:{ titre:'À qui appartient une légion ?',
  texte:`Deux légions sont parties pour Pompée, avec deux cent cinquante deniers par homme donnés par César au moment du départ. Les hommes de ces légions racontent partout que César les a bien traités. Dans le camp, la question tourne : sert-on la République, ou sert-on un homme ?`,
  opts:[
  { id:'a', scopes:['*'], txt:'Dire que tu sers la République',
    test:{attr:'disciplina', dc:10}, succes:{ txt:'Tu le dis clairement, sans provocation, devant des gens qui ne pensent pas comme toi. On te respecte pour la franchise et l’on te classe.', eff:{disciplina:3,fama:3,favor:{caesar:-4,labienus:6}} },
    echec:{ txt:'La phrase est répétée en la déformant. Elle arrive au légat sous une forme qui n’est plus la tienne.', eff:{favor:{caesar:-8},fama:-3} } },
  { id:'b', scopes:['*'], txt:'Dire que tu sers César',
    test:{attr:'auctoritas', dc:0}, succes:{ txt:'Tu le dis simplement. La moitié du camp pense pareil et l’autre moitié le pense sans le dire. Ton nom monte d’un cran sur une liste que tu ne verras jamais.', eff:{auctoritas:2,favor:{caesar:9,labienus:-5},fama:4} },
    echec:{ txt:'Tu le dis avec trop d’empressement devant les mauvais témoins. On te prend pour un flatteur.', eff:{fama:-4,favor:{caesar:2}} } },
  { id:'c', scopes:['*'], txt:'Ne rien dire et rester au travail',
    test:{attr:'ingenium', dc:-10}, succes:{ txt:'Tu ne réponds à personne et tu ne te fâches avec personne. Dans une année comme celle-ci, c’est une compétence.', eff:{ingenium:3,disciplina:2} },
    echec:{ txt:'Ton silence est lu par chaque camp comme une adhésion à l’autre.', eff:{favor:{caesar:-3,labienus:-3}} } } ]},

attente50:{ titre:'Une armée qui n’a rien à faire',
  texte:`Neuf mois sans campagne. Les hommes jouent, boivent, s’endettent, se battent. La solde arrive régulièrement, ce qui n’arrange rien. Le camp de Cisalpine ressemble plus à une ville qu’à un camp.`,
  opts:[
  { id:'a', scopes:['*'], txt:'Maintenir l’exercice et la discipline coûte que coûte',
    test:{attr:'auctoritas', dc:5}, succes:{ txt:'Tu maintiens la marche hebdomadaire et l’inspection d’armes. On te trouve pénible. En janvier, quand il faudra faire soixante milles en trois jours, on ne te trouvera plus pénible.', eff:{auctoritas:3,disciplina:3,unit:{experientia:7,fatigatio:10}} },
    echec:{ txt:'Tu t’épuises à tenir des hommes que rien ne motive. Le ressentiment monte.', eff:{unit:{fides:-8},auctoritas:-2} } },
  { id:'b', scopes:['*'], txt:'Laisser filer et gérer les dettes de tes hommes',
    test:{attr:'ingenium', dc:0}, succes:{ txt:'Tu tiens les comptes, tu rachètes deux dettes usuraires, tu casses un tripot. Tes hommes sont mous et solidaires, ce qui n’est pas le pire des états.', eff:{ingenium:3,unit:{fides:10,experientia:-3},peculium:-250} },
    echec:{ txt:'Tu perds le contrôle des comptes et deux de tes hommes se vendent à un usurier de Ravenne.', eff:{unit:{fides:-6},peculium:-150} } },
  { id:'c', scopes:['*'], txt:'Profiter de l’année pour te faire des relations en Cisalpine',
    test:{attr:'ingenium', dc:5}, succes:{ txt:'Tu passes six mois à dîner chez des décurions municipaux qui adorent recevoir un officier de César. Tu en tires des créances, un mariage possible et une clientèle.', eff:{ingenium:4,peculium:700,fama:3} },
    echec:{ txt:'Les dîners coûtent plus qu’ils ne rapportent et l’on commence à te trouver un peu trop souvent en ville.', eff:{peculium:-400,fama:-3,favor:{caesar:-3}} } } ]},

veille_rubicon:{ titre:'La nuit de Ravenne',
  texte:`César a donné des jeux de gladiateurs et dîné longuement avec des invités. Vers le milieu du repas, il s’est levé, a dit qu’il revenait, et est parti en voiture louée par des chemins détournés. La Treizième légion — la tienne — a reçu l’ordre de se tenir prête, sans destination.`,
  opts:[
  { id:'a', scopes:['*'], txt:'Préparer ton unité au départ sans poser de question',
    test:{attr:'disciplina', dc:-5}, succes:{ txt:'Cinq jours de vivres, armes vérifiées, chariots chargés. Tu ne demandes rien à personne. C’est exactement ce qu’on attend de toi cette nuit-là.', eff:{disciplina:4,favor:{caesar:6},unit:{cohaesio:5}} },
    echec:{ txt:'Le chargement traîne. On part quand même, en laissant du matériel.', eff:{fama:-3} } },
  { id:'b', scopes:['*'], txt:'Sonder les hommes sur ce qu’ils feront s’il faut passer en Italie',
    test:{attr:'ingenium', dc:5}, succes:{ txt:'Tu prends le pouls, tente par tente. La réponse est unanime et elle n’a rien de politique : ils suivront César parce qu’ils suivent César. Tu sauras au moins sur quoi tu comptes.', eff:{ingenium:3,auctoritas:2,unit:{fides:6}} },
    echec:{ txt:'La question elle-même sème le doute. Deux hommes se mettent à parler de désertion, alors qu’ils n’y pensaient pas avant que tu poses la question.', eff:{unit:{fides:-8}} } },
  { id:'c', scopes:['centurion','superieur'], txt:'Écrire ton testament et le déposer chez les enseignes',
    test:{attr:'scientia', dc:-15}, succes:{ txt:'Comme tout légionnaire, tu déposes ton testament auprès du signifer. Tu le refais ce soir-là, plus soigneusement que d’habitude, et tu y penses en le scellant.', eff:{scientia:2,valetudo:3} },
    echec:{ txt:'Tu ne trouves pas les mots et tu remets à demain, ce qui est le genre de chose qu’on remet une fois de trop.', eff:{} } } ]},

rubicon:{ titre:'Le Rubicon', decisif:true,
  texte:`Il est descendu de voiture au bord du gué et il est resté longtemps sans parler. Puis il s’est tourné vers ceux qui étaient là — des officiers, la Treizième, toi — et il a dit qu’on pouvait encore reculer, mais qu’une fois ce petit pont franchi, tout se réglerait par les armes.<br><br>Puis, comme s’il tranchait autre chose qu’un ruisseau : <span class="lat">Alea iacta est</span>. Et il est entré dans l’eau.<br><br>Franchir en armes la frontière de l’Italie est un crime capital pour un proconsul, et pour chaque homme qui le suit.`,
  opts:[
  { id:'a', scopes:['*'], txt:'Passer le gué derrière lui', decide:'caesar',
    test:{attr:'disciplina', dc:-30}, succes:{ txt:'Tu passes. Il n’y a pas eu de délibération : il y a eu un homme qui entre dans l’eau et une légion qui entre derrière lui. Ce que tu es devenu ce jour-là, tu mettras des années à le nommer.', eff:{favor:{caesar:14},virtus:2,unit:{fides:8}} },
    echec:{ txt:'Tu passes. En te retournant sur l’autre rive, tu vois deux hommes de ton unité rester debout de l’autre côté, immobiles. Ils ne bougeront plus.', eff:{favor:{caesar:14},unit:{fides:-4}} } },
  { id:'b', scopes:['*'], txt:'Refuser de porter les armes contre Rome et passer à Pompée', decide:'pompee',
    test:{attr:'virtus', dc:0}, succes:{ txt:'Tu rends ton baudrier au tribun de service et tu dis pourquoi. On ne te retient pas : César a donné l’ordre exprès qu’on laisse partir qui veut, et il ne s’en portera que mieux dans l’opinion. Tu gagnes Brindes à pied. Labienus, lui, part le lendemain avec sa maison et son trésor.', eff:{virtus:4,fama:6,favor:{caesar:-100,labienus:20}} },
    echec:{ txt:'Tu pars, mais mal : deux de tes hommes te suivent et se font prendre en route. Tu arrives chez Pompée avec la réputation d’un homme qui a hésité.', eff:{virtus:2,fama:-4,favor:{caesar:-100,labienus:10}} } },
  { id:'c', scopes:['*'], txt:'Demander ton congé et rentrer chez toi', decide:'missio',
    test:{attr:'ingenium', dc:5}, succes:{ txt:'Tu invoques tes années de service et tes blessures. Le tribun regarde ton dossier, ne discute pas, et signe. Tu quittes le camp par la porte décumane, à pied, avec ta solde. Personne ne te salue et personne ne t’insulte.', eff:{} },
    echec:{ txt:'Ton congé est accordé de mauvaise grâce et sans la gratification d’usage. On te fait comprendre que le moment était mal choisi.', eff:{peculium:-300,fama:-5} } } ]},

placentia:{ titre:'La décimation',
  texte:`La Neuvième refuse de marcher. César vient seul devant elle, sans escorte, et parle. Il rappelle qu’une armée romaine se décime pour moins que cela, et annonce qu’il en appliquera la lettre : un homme sur dix, tiré au sort, battu à mort par ses camarades.<br><br>Puis il attend. La légion demande grâce. Il commue en douze exécutions choisies parmi les meneurs — et l’un des douze, prouvé absent, est remplacé par le centurion qui l’avait dénoncé à tort.`,
  opts:[
  { id:'a', scopes:['*'], txt:'Soutenir publiquement la sanction',
    test:{attr:'auctoritas', dc:5}, succes:{ txt:'Tu dis devant tes hommes que la Neuvième a eu ce qu’elle méritait et qu’une armée sans discipline est une bande. C’est impopulaire et c’est exact ; ton unité serre les rangs.', eff:{auctoritas:4,disciplina:3,unit:{cohaesio:6,fides:-4},favor:{caesar:7}} },
    echec:{ txt:'Tu es entendu comme un homme qui applaudit à la mort de camarades. Le mot circule.', eff:{unit:{fides:-10},fama:-5} } },
  { id:'b', scopes:['*'], txt:'Intercéder pour un homme de ta connaissance',
    test:{attr:'ingenium', dc:15}, succes:{ txt:'Tu obtiens qu’un nom sorte de la liste, en échange d’un autre que tu n’as pas choisi. C’est un marché atroce et tu l’as fait.', eff:{ingenium:3,unit:{fides:9},fama:2,valetudo:-5} },
    echec:{ txt:'On te répond que la liste est close. Elle l’était depuis une heure et l’on te l’a laissé demander.', eff:{fama:-3} } },
  { id:'c', scopes:['*'], txt:'Te taire',
    test:{attr:'disciplina', dc:-20}, succes:{ txt:'Tu ne dis rien, ni pour ni contre. Douze hommes meurent et l’armée marche.', eff:{disciplina:2} },
    echec:{ txt:'Ton silence est compté par tes hommes comme une lâcheté et par les officiers comme une réserve.', eff:{fama:-3,unit:{fides:-4}} } } ]},

alexandrie:{ titre:'Trois mille deux cents hommes',
  texte:`César s’est enfermé dans le quartier du palais avec deux légions à effectif réduit pour arbitrer une querelle dynastique dont personne au camp ne comprend l’intérêt. La reine Cléopâtre est arrivée dans le palais roulée dans un sac de literie. La ville entière est contre nous.`,
  opts:[
  { id:'a', scopes:['*'], txt:'Fortifier le quartier maison par maison',
    test:{attr:'scientia', dc:0}, succes:{ txt:'Tu fais murer les carrefours, percer les cloisons entre maisons pour circuler sans sortir, garnir les terrasses. Une ville se défend comme un camp, à condition de la traiter comme un camp.', eff:{scientia:4,disciplina:3,fama:5,favor:{caesar:6}} },
    echec:{ txt:'Le quartier est trop grand et tes ouvrages sont trop dispersés. On perd deux carrefours la première nuit.', eff:{fama:-3,valetudo:-8} } },
  { id:'b', scopes:['*'], txt:'Mettre la main sur les vivres du quartier avant les Alexandrins',
    test:{attr:'ingenium', dc:5}, succes:{ txt:'Tu réquisitionnes les entrepôts du port et les greniers du palais avant que quiconque y pense. Un siège se gagne au grenier.', eff:{ingenium:4,unit:{fides:9},peculium:200} },
    echec:{ txt:'Les entrepôts brûlent — les nôtres et, accessoirement, une partie de la bibliothèque.', eff:{fama:-4,unit:{fides:-5}} } },
  { id:'c', scopes:['centurion','superieur'], txt:'Envoyer chercher du renfort chez Mithridate de Pergame',
    test:{attr:'ingenium', dc:20}, succes:{ txt:'Tu montes l’expédition d’un émissaire par mer, de nuit, avec des lettres en grec. Le renfort arrivera par la Syrie six mois plus tard et débloquera tout. Personne ne se souviendra que quelqu’un a dû l’organiser.', eff:{ingenium:5,scientia:3,fama:7,favor:{caesar:10}} },
    echec:{ txt:'Ton émissaire est pris à la sortie du port. On récupère son corps et pas les lettres, ce qui est la mauvaise moitié.', eff:{fama:-4,favor:{caesar:-4}} } } ]},

mutinerie_x:{ titre:'La mutinerie de la Dixième', decisif:true,
  texte:`Les légions vétéranes campées en Campanie refusent d’embarquer pour l’Afrique. Elles réclament le congé, les terres promises, l’argent promis. Elles ont tué deux sénateurs envoyés pour parlementer et marché sur Rome.<br><br>César arrive seul, monte à la tribune, et demande ce qu’elles veulent. Elles crient : le congé. Alors il dit un seul mot : « <span class="lat">Quirites</span> » — citoyens. Pas « camarades ». Pas « soldats ». Citoyens : c’est-à-dire des civils, des gens qui ne sont plus rien pour lui.<br><br>Le silence est total. Puis la Dixième supplie qu’on la reprenne, qu’on la décime s’il le faut, mais qu’on la reprenne.`,
  opts:[
  { id:'a', scopes:['*'], txt:'Être de ceux qui supplient qu’on les reprenne',
    test:{attr:'auctoritas', dc:0}, succes:{ txt:'Tu es au premier rang de ceux qui demandent à servir encore. Il accepte, en refusant la décimation, et en disant qu’il n’a jamais douté de la Dixième — ce qui est faux et efficace. Tu embarqueras pour l’Afrique.', eff:{auctoritas:3,unit:{fides:9},favor:{caesar:10},fama:5} },
    echec:{ txt:'Tu te joins au mouvement trop tard pour qu’on le remarque. On te reprend avec les autres, sans distinction.', eff:{favor:{caesar:3}} } },
  { id:'b', scopes:['*'], txt:'Prendre la tête de la revendication et négocier',
    test:{attr:'ingenium', dc:20}, succes:{ txt:'Tu formules ce que quinze mille hommes ressentent sans savoir le dire : les terres, les sommes, les délais, par écrit. César traite avec toi parce qu’il vaut mieux traiter avec quelqu’un. Tu obtiens des garanties réelles — et tu es désormais un homme qu’on surveille.', eff:{ingenium:6,auctoritas:5,fama:12,unit:{fides:16},favor:{caesar:-6},peculium:600} },
    echec:{ txt:'On te laisse parler, on note ton nom, et l’on règle l’affaire par-dessus ta tête. Tu es un meneur sans mouvement, ce qui est la pire position.', eff:{favor:{caesar:-14},fama:-8,auctoritas:-4} } },
  { id:'c', scopes:['*'], txt:'Prendre ton congé maintenant, avec les terres promises', decide:'missio_riche',
    test:{attr:'ingenium', dc:5}, succes:{ txt:'Tu prends le congé. Terres en Campanie ou en Narbonnaise, prime de démobilisation, quitus. Quinze ans de service et tu sors debout, avec des biens — ce que quatre-vingt-dix hommes sur cent ne font pas.', eff:{peculium:3000} },
    echec:{ txt:'Tu prends le congé dans la confusion et l’on te lotit sur une terre médiocre en Lucanie. C’est toujours une terre.', eff:{peculium:1200} } } ]},

triomphes:{ titre:'Quatre triomphes',
  texte:`Gaule, Égypte, Pont, Afrique. Quarante éléphants portant des flambeaux, des tableaux peints représentant la mort de Caton, qui déplaisent au peuple. Vercingétorix devant le char, puis étranglé le soir. Vingt-deux mille tables de banquet dans la ville.<br><br>Chaque légionnaire reçoit cinq mille deniers — vingt ans de solde. Les hommes chantent derrière le char des vers si obscènes que le triomphateur les écoute en souriant, parce que c’est le droit du soldat ce jour-là.`,
  opts:[
  { id:'a', scopes:['*'], txt:'Défiler et prendre l’argent',
    test:{attr:'disciplina', dc:-30}, succes:{ txt:'Tu défiles sur la Voie sacrée, entre des gens qui ne savent rien de la Sambre ni d’Alésia et qui t’acclament quand même. Puis tu touches plus d’argent que ton père n’en a vu dans sa vie.', eff:{peculium:5000,fama:4,valetudo:6} },
    echec:{ txt:'Tu défiles. La foule, le bruit, l’odeur des flambeaux — au bout d’une heure tu ne penses plus qu’à t’asseoir.', eff:{peculium:5000,valetudo:-4} } },
  { id:'b', scopes:['sousoff','centurion','superieur'], txt:'Investir immédiatement en terres autour de Capoue',
    test:{attr:'ingenium', dc:5}, succes:{ txt:'Tu achètes de la terre pendant que les autres achètent du vin. Dans quinze ans tu seras décurion municipal et tes fils seront des gens qu’on salue.', eff:{peculium:2500,ingenium:4,fama:3} },
    echec:{ txt:'Tu achètes trop cher, dans un marché où douze mille vétérans achètent en même temps.', eff:{peculium:3500,ingenium:1} } },
  { id:'c', scopes:['*'], txt:'Chercher les familles de tes morts et leur porter leur part',
    test:{attr:'auctoritas', dc:0}, succes:{ txt:'Tu passes ta permission à faire le tour de l’Italie avec une bourse et une liste. Onze maisons. Dans chacune on te fait asseoir et l’on veut savoir comment il est mort, et tu racontes onze fois. Tu rentres au camp vidé et entier.', eff:{peculium:-1500,unit:{fides:20},auctoritas:5,fama:8} },
    echec:{ txt:'Tu n’en trouves que quatre. Les autres ont déménagé, ou n’existaient pas, ou ne veulent pas ouvrir.', eff:{peculium:-800,unit:{fides:8},valetudo:-5} } } ]},

/* ---- hiverner : événement générique de quartier d’hiver ---- */
hiberna_gen:{ titre:'Quartiers d’hiver', generique:true,
  texte:`Le camp d’hiver : des baraques de bois à la place des tentes, un four, une infirmerie, des jeux de dés interdits et pratiqués partout. On répare, on recoud, on enterre proprement ceux qu’on avait enterrés vite. Les lettres d’Italie arrivent par paquets de trois mois.`,
  opts:[
  { id:'a', scopes:['*'], txt:'Refaire l’équipement de ton unité de fond en comble',
    test:{attr:'disciplina', dc:-10}, succes:{ txt:'Cottes recloutées, semelles, courroies, fourreaux. Un hiver de travail d’atelier qui vaudra trois cents hommes au printemps.', eff:{disciplina:3,unit:{experientia:6,fatigatio:-12},peculium:-150} },
    echec:{ txt:'Le forgeron du camp est débordé et la moitié du travail attend le printemps.', eff:{unit:{fatigatio:-8}} } },
  { id:'b', scopes:['*'], txt:'Écrire à ta famille et régler tes affaires d’Italie',
    test:{attr:'ingenium', dc:-10}, succes:{ txt:'Tu envoies de l’argent, tu donnes des instructions, tu reçois des nouvelles vieilles de quatre mois. C’est peu et c’est ce qui te rattache au monde des vivants.', eff:{ingenium:2,valetudo:8,peculium:-100} },
    echec:{ txt:'La lettre qui arrive t’annonce une mort à laquelle tu ne peux rien, avec six mois de retard.', eff:{valetudo:-10,ingenium:1} } },
  { id:'c', scopes:['*'], txt:'Passer l’hiver à te faire voir des officiers supérieurs',
    test:{attr:'ingenium', dc:5}, succes:{ txt:'Dîners, chasses, parties de dés perdues à propos. Un hiver bien employé vaut deux batailles pour un cursus.', eff:{ingenium:3,peculium:-250,fama:4}, favorRand:8 },
    echec:{ txt:'Tu es invité une fois, tu parles trop, on ne t’invite plus.', eff:{peculium:-250,fama:-3} } },
  { id:'d', scopes:['*'], txt:'Soigner tes blessures et te reposer réellement',
    test:{attr:'disciplina', dc:-30}, succes:{ txt:'Trois mois sans marcher. Le médecin grec de la légion te recoud correctement ce qui avait été recousu vite.', eff:{valetudo:22,unit:{fatigatio:-18}}, soigne:true },
    echec:{ txt:'Tu te reposes mal, comme les gens qui ne savent pas se reposer.', eff:{valetudo:10,unit:{fatigatio:-10}} } } ]}
};

   ÉVÉNEMENTS ALÉATOIRES — vie de camp, carrière, hommes
   cond(s) : condition d'apparition · poids : fréquence relative

const ALEA = [

{ id:'dés', titre:'Les dés sous la tente', poids:10,
  texte:`Le jeu est interdit par le règlement et pratiqué chaque soir. Ce soir, la partie est grosse : un vétéran de la première cohorte joue trois mois de solde contre un marchand syrien qui suit l’armée et qui n’a pas l’air de perdre souvent.`,
  opts:[
  { id:'a', scopes:['*'], txt:'Jouer', test:{attr:'ingenium', dc:5},
    succes:{ txt:'Tu sors avec le double de ta mise et la réputation de savoir t’arrêter.', eff:{peculium:'stip*0.3',ingenium:2,fama:2} },
    echec:{ txt:'Tu perds. Puis tu perds encore en essayant de te refaire, ce qui est la partie la plus prévisible de la soirée.', eff:{peculium:'-stip*0.4'} } },
  { id:'b', scopes:['sousoff','centurion','superieur'], txt:'Faire cesser la partie et confisquer les mises',
    test:{attr:'auctoritas', dc:0},
    succes:{ txt:'Tu ramasses les dés et l’argent, et tu verses le tout à la caisse funéraire de la centurie. Personne ne discute et deux hommes te remercient le lendemain, discrètement.', eff:{auctoritas:3,disciplina:2,unit:{fides:5}} },
    echec:{ txt:'Le vétéran te rit au nez et la moitié de la tente avec lui. Tu ne peux pas faire fouetter dix hommes pour des dés.', eff:{auctoritas:-4} } },
  { id:'c', scopes:['*'], txt:'Regarder et repérer comment triche le Syrien',
    test:{attr:'scientia', dc:0},
    succes:{ txt:'Dés pipés au mercure. Tu le dis à voix haute. Le marchand quitte le camp cette nuit-là sans son chariot, et l’argent revient à qui de droit.', eff:{scientia:3,ingenium:2,fama:5,unit:{fides:7}} },
    echec:{ txt:'Tu accuses à tort. Le vétéran perd quand même et t’en veut d’avoir gâché sa dernière chance.', eff:{fama:-4,unit:{fides:-4}} } } ]},

{ id:'plaie', titre:'La plaie qui ne se ferme pas', poids:9, cond:(s)=>s.valetudo<70,
  texte:`Une blessure ancienne s’est rouverte et suppure. Le médecin grec de la légion propose de cautériser au fer ; l’<span class="lat">optio valetudinarii</span> propose du miel et du vinaigre et trois semaines de repos. Il y a une campagne dans deux semaines.`,
  opts:[
  { id:'a', scopes:['*'], txt:'Le fer, tout de suite', test:{attr:'virtus', dc:0},
    succes:{ txt:'C’est très rapide et très long. Trois jours plus tard tu marches, et la plaie est propre.', eff:{valetudo:18,virtus:2} },
    echec:{ txt:'La cautérisation prend mal. La fièvre monte deux jours.', eff:{valetudo:-10} } },
  { id:'b', scopes:['*'], txt:'Le miel, le vinaigre et le repos', test:{attr:'disciplina', dc:-15},
    succes:{ txt:'Trois semaines. Tu manques le début de la campagne et tu guéris complètement, ce qui est un choix que peu font.', eff:{valetudo:26,fama:-3} },
    echec:{ txt:'Tu ne tiens pas trois semaines couché et tu reprends du service au dixième jour.', eff:{valetudo:8} } },
  { id:'c', scopes:['*'], txt:'Serrer une bande dessus et n’en parler à personne', test:{attr:'disciplina', dc:10},
    succes:{ txt:'Tu tiens. Personne ne sait. C’est stupide et cela fonctionne cette fois-ci.', eff:{valetudo:-4,fama:3,virtus:2} },
    echec:{ txt:'La fièvre te prend en marche, au vingtième mille, devant ton unité.', eff:{valetudo:-18,fama:-4,auctoritas:-2} } } ]},

{ id:'vacance', titre:'Une place vacante', poids:11, cond:(s)=>s.vacances>0 && s.grade.ordre<9,
  texte:`Un poste s’est libéré au-dessus de toi — par la mort, la promotion ou la disgrâce d’un autre. Les candidats se comptent sur les doigts d’une main et se connaissent tous. Le légat recevra les recommandations cette semaine.`,
  opts:[
  { id:'a', scopes:['*'], txt:'Faire appuyer ta candidature par ton meilleur patron',
    test:{attr:'ingenium', dc:5},
    succes:{ txt:'La recommandation part avec le poids qu’il faut. Ton nom est en tête de la courte liste.', eff:{ingenium:2,fama:4}, candidature:2 },
    echec:{ txt:'Ton patron appuie mollement, ou trop tard. Ton nom figure sur la liste, en troisième position.', eff:{}, candidature:0 } },
  { id:'b', scopes:['*'], txt:'Laisser parler tes états de service',
    test:{attr:'fama', dc:0, brut:true},
    succes:{ txt:'On te propose la place sans que tu l’aies demandée, ce qui vaut mieux dans une armée où l’on méprise les solliciteurs.', eff:{auctoritas:3,fama:3}, candidature:2 },
    echec:{ txt:'La place va à un homme qui l’a demandée. Il y a une leçon là-dedans.', eff:{fama:-2}, candidature:0 } },
  { id:'c', scopes:['*'], txt:'Payer ce qu’il faut à qui il faut',
    test:{attr:'ingenium', dc:-5},
    succes:{ txt:'Un cadeau à un affranchi bien placé, un autre au scribe qui tient les rôles. Le procédé est laid, ancien, et efficace.', eff:{peculium:'-stip*1.5',ingenium:3,fama:-3}, candidature:3 },
    echec:{ txt:'Tu paies et l’affaire s’ébruite. Tu es un homme qui a acheté et qui n’a pas obtenu.', eff:{peculium:'-stip*1.5',fama:-7}, candidature:0 } } ]},

{ id:'querelle', titre:'Deux de tes hommes se sont battus', poids:9, cond:(s)=>s.grade.scope!=='soldat',
  texte:`Coups portés au camp, ce qui est un délit grave. L’un des deux est un vétéran indiscipliné mais excellent au combat ; l’autre est une jeune recrue qui a raison sur le fond. Le règlement prévoit la bastonnade pour les deux.`,
  opts:[
  { id:'a', scopes:['sousoff','centurion','superieur'], txt:'Appliquer le règlement aux deux',
    test:{attr:'disciplina', dc:-5},
    succes:{ txt:'Bastonnade publique, égale. La justice aveugle est impopulaire et elle tient une unité mieux que la justice clairvoyante.', eff:{disciplina:3,auctoritas:3,unit:{cohaesio:4,fides:-3}} },
    echec:{ txt:'Le vétéran encaisse et la recrue est cassée pour de bon : elle ne sera plus jamais bonne à rien.', eff:{unit:{fides:-6}} } },
  { id:'b', scopes:['sousoff','centurion','superieur'], txt:'Les mettre au même contubernium et à la même corvée pendant un mois',
    test:{attr:'ingenium', dc:5},
    succes:{ txt:'Un mois de latrines à deux. Au bout de trois semaines ils se couvrent mutuellement devant toi. C’est la plus vieille méthode de l’armée romaine et elle marche encore.', eff:{ingenium:3,auctoritas:2,unit:{fides:8,cohaesio:5}} },
    echec:{ txt:'Ils se battent encore, une deuxième fois, et cette fois il y a un couteau.', eff:{unit:{cohaesio:-8},auctoritas:-3} } },
  { id:'c', scopes:['sousoff','centurion','superieur'], txt:'Fermer les yeux',
    test:{attr:'ingenium', dc:15},
    succes:{ txt:'Tu n’as rien vu. Ils règlent cela entre eux et l’affaire meurt. Un officier qui voit tout ne commande rien.', eff:{unit:{fides:5}} },
    echec:{ txt:'Le tribun de service, lui, a vu. C’est toi qu’on interroge sur ta manière de tenir ton monde.', eff:{auctoritas:-4,fama:-4} } } ]},

{ id:'lettre', titre:'Une lettre d’Italie', poids:8,
  texte:`Le courrier a mis quatre mois. Il y a une lettre pour toi, écrite par un scribe public au nom de quelqu’un qui ne sait pas écrire.`,
  opts:[
  { id:'a', scopes:['*'], txt:'La lire tout de suite', test:{attr:'ingenium', dc:-20},
    succes:{ txt:'Des nouvelles ordinaires : la récolte, un mariage, un procès de voisinage. Tu la relis trois fois et tu la ranges dans ton coffre. Cela suffit à tenir un hiver.', eff:{valetudo:8,ingenium:1} },
    echec:{ txt:'Une mort. Vieille de quatre mois, à laquelle tu ne peux rien, et dont personne ici ne peut parler avec toi.', eff:{valetudo:-12,fama:0} } },
  { id:'b', scopes:['*'], txt:'Envoyer la moitié de ta solde avec le prochain courrier',
    test:{attr:'ingenium', dc:-25},
    succes:{ txt:'L’argent partira par le convoi du questeur, qui prend une commission et arrive à peu près sûrement. Chez toi, cela change tout.', eff:{peculium:'-stip*0.5',valetudo:5,ingenium:1} },
    echec:{ txt:'Le convoi est détroussé en Cisalpine. Ton argent est quelque part entre ici et chez toi.', eff:{peculium:'-stip*0.5'} } } ]},

{ id:'inspection', titre:'Le proconsul passe', poids:8,
  texte:`César inspecte les camps en personne, comme il le fait souvent, sans prévenir, et s’arrête où il veut. Il connaît le nom de beaucoup de centurions et fait mine de connaître celui des autres.`,
  opts:[
  { id:'a', scopes:['*'], txt:'Présenter ton unité en état irréprochable',
    test:{attr:'disciplina', unit:'cohaesio', dc:5},
    succes:{ txt:'Armes, comptes, latrines, malades : tout est en ordre et tout est montré. Il pose deux questions précises et retient ta réponse.', eff:{disciplina:2,fama:5,favor:{caesar:8}} },
    echec:{ txt:'Il tombe précisément sur les trois choses qui ne vont pas. Il ne dit rien, ce qui est pire.', eff:{fama:-4,favor:{caesar:-5}} } },
  { id:'b', scopes:['*'], txt:'Lui signaler un problème réel qu’on lui cache',
    test:{attr:'virtus', dc:15},
    succes:{ txt:'Tu lui dis que le blé livré par le contractant est coupé de son. Il fait vérifier sur-le-champ, le contractant est chassé, et un officier supérieur t’en veut à mort.', eff:{virtus:3,fama:7,favor:{caesar:12}}, favorRand:-10 },
    echec:{ txt:'Tu es mal renseigné ou mal compris. On te fait taire poliment et l’on te reparlera de cet épisode.', eff:{fama:-5,favor:{caesar:-4}} } },
  { id:'c', scopes:['*'], txt:'Rester dans le rang et ne rien tenter',
    test:{attr:'disciplina', dc:-25},
    succes:{ txt:'Il passe. C’est déjà cela.', eff:{disciplina:1} },
    echec:{ txt:'Il s’arrête devant toi et te demande depuis combien d’années tu sers. Tu bafouilles.', eff:{fama:-3} } } ]},

{ id:'convoi', titre:'Le convoi de ravitaillement', poids:8, cond:(s)=>s.saison!=='hiberna',
  texte:`On te charge d’escorter un convoi de blé sur quarante milles en pays mal pacifié. Deux cents chariots, cent bœufs, et une cavalerie ennemie qui sait exactement où passer.`,
  opts:[
  { id:'a', scopes:['*'], txt:'Marcher lentement, en formation serrée autour des chariots',
    test:{attr:'disciplina', unit:'cohaesio', dc:0},
    succes:{ txt:'Trois jours au lieu de deux, et deux cents chariots à l’arrivée. Le camp mange.', eff:{disciplina:3,fama:4,favor:{caesar:5}} },
    echec:{ txt:'La lenteur donne le temps de te préparer une embuscade au dernier gué. Tu perds vingt chariots.', eff:{fama:-4,unit:{fides:-4}} } },
  { id:'b', scopes:['*'], txt:'Envoyer des éclaireurs loin devant et adapter l’itinéraire',
    test:{attr:'scientia', dc:5},
    succes:{ txt:'Tes éclaireurs signalent un rassemblement au gué prévu. Tu passes douze milles plus au nord par un chemin de bergers. Rien ne se passe, ce qui est le meilleur rapport d’escorte possible.', eff:{scientia:4,fama:5,favor:{caesar:5}} },
    echec:{ txt:'L’itinéraire de contournement est impraticable pour des chariots. Tu perds une journée et tu reviens sur le gué.', eff:{unit:{fatigatio:12}} } },
  { id:'c', scopes:['*'], txt:'Marcher vite et parier sur la vitesse',
    test:{attr:'virtus', unit:'fatigatio', dc:10, inv:true},
    succes:{ txt:'Deux jours. Tu arrives avant qu’ils aient fini de se rassembler.', eff:{virtus:2,fama:3,unit:{fatigatio:14}} },
    echec:{ txt:'Le convoi s’étire sur trois milles et se fait couper en deux. Tu récupères la moitié du blé et pas les bouviers.', eff:{fama:-6,unit:{fides:-6}} } } ]},

{ id:'mentor', titre:'Le vieux primipile', poids:9, cond:(s)=>s.grade.ordre<7 && vivant(s,'balventius'),
  texte:`T. Balventius, primipile, vingt-huit ans de service, deux fois décoré de la couronne civique. Il te fait venir sous sa tente et te fait asseoir, ce qui n’arrive jamais.`,
  opts:[
  { id:'a', scopes:['*'], txt:'L’écouter jusqu’au bout', test:{attr:'disciplina', dc:-20},
    succes:{ txt:'Il parle deux heures de choses très concrètes : où placer un homme qui a peur, comment reconnaître qu’une ligne va céder trois minutes avant qu’elle cède, pourquoi on ne court jamais devant ses propres hommes sauf une fois par carrière.', eff:{scientia:5,auctoritas:3,favor:{balventius:14}} },
    echec:{ txt:'Tu t’endors à moitié, après une garde de nuit. Il s’en aperçoit et te congédie sans se fâcher, ce qui est pire.', eff:{favor:{balventius:-8}} } },
  { id:'b', scopes:['*'], txt:'Lui poser la question qui t’occupe vraiment',
    test:{attr:'ingenium', dc:0},
    succes:{ txt:'Tu lui demandes comment on tient quand on a peur. Il répond que personne ne tient : on fait les gestes, et les gestes tiennent l’homme. Il te montre lesquels.', eff:{virtus:4,scientia:3,favor:{balventius:12}} },
    echec:{ txt:'Ta question est mal posée et il te répond par un proverbe militaire, ce qui est sa façon de dire qu’il ne répondra pas.', eff:{favor:{balventius:2}} } } ]},

{ id:'rival', titre:'Un rival', poids:9, cond:(s)=>s.grade.ordre>=3,
  texte:`Un officier de ton grade, entré au service la même année, occupe exactement la place que tu vises. Il est compétent, ce qui est le plus agaçant. Une occasion se présente de le desservir sans être vu.`,
  opts:[
  { id:'a', scopes:['*'], txt:'Le desservir', test:{attr:'ingenium', dc:10},
    succes:{ txt:'Une phrase glissée au bon endroit, sur un fait vrai présenté sous son plus mauvais jour. Il ne saura jamais d’où c’est venu. La place se libère.', eff:{ingenium:4,fama:3}, candidature:2, karma:-1 },
    echec:{ txt:'Il remonte la piste en deux jours et la retourne. Tu es un homme qui intrigue mal, ce qui est la pire des réputations.', eff:{fama:-8,ingenium:1,auctoritas:-3} } },
  { id:'b', scopes:['*'], txt:'Le battre sur le terrain', test:{attr:'virtus', dc:5},
    succes:{ txt:'Tu prends la mission dont personne ne veut et tu la réussis. Il n’y a rien à répondre à cela et il ne répond rien.', eff:{virtus:3,fama:7,auctoritas:2}, candidature:2 },
    echec:{ txt:'Tu prends la mission dont personne ne veut, et l’on comprend pourquoi personne n’en voulait.', eff:{fama:-4,valetudo:-10} } },
  { id:'c', scopes:['*'], txt:'Lui proposer une alliance', test:{attr:'ingenium', dc:0},
    succes:{ txt:'Vous convenez de ne pas vous nuire et de vous appuyer devant les supérieurs. C’est plus rare qu’on ne croit dans une légion et plus rentable que l’intrigue.', eff:{ingenium:3,fama:4,auctoritas:2}, candidature:1 },
    echec:{ txt:'Il accepte, puis ne tient rien. Tu as perdu six mois et une carte.', eff:{fama:-3} } } ]},

{ id:'malades', titre:'Le valetudinarium', poids:7,
  texte:`L’hôpital du camp est plein : dysenterie, fièvres, blessures anciennes. Le médecin manque de vinaigre, de bandes et d’un homme pour tenir les registres. Les malades qu’on ne compte pas sont ceux qu’on n’enterre pas correctement.`,
  opts:[
  { id:'a', scopes:['*'], txt:'Fournir sur ta bourse ce qui manque',
    test:{attr:'ingenium', dc:-15},
    succes:{ txt:'Vinaigre, toile, miel, et un scribe payé pour un mois. Le nombre de morts de fièvre baisse d’un tiers ce trimestre. Personne ne fait le lien, sauf le médecin.', eff:{peculium:-300,unit:{fides:12},fama:4} },
    echec:{ txt:'Ce que tu fournis est revendu par un aide-soignant avant d’arriver aux malades.', eff:{peculium:-300,unit:{fides:3}} } },
  { id:'b', scopes:['*'], txt:'Faire déplacer le camp des marais', test:{attr:'scientia', dc:10},
    succes:{ txt:'Tu démontres, chiffres à l’appui, que les fièvres viennent du site et pas du sort. On déplace le camp d’un demi-mille sur un versant sec. C’est de la médecine sans médecine et cela sauve plus d’hommes qu’une victoire.', eff:{scientia:5,fama:7,favor:{caesar:7},unit:{fides:10}} },
    echec:{ txt:'On te répond que le camp est bien où il est et qu’un centurion n’est pas un augure.', eff:{fama:-3} } } ]},

{ id:'butin_litige', titre:'Un litige sur le butin', poids:7, cond:(s)=>s.peculium>200,
  texte:`Deux contubernia de ton unité se disputent le partage d’un lot pris ensemble. Chacun a de bons arguments et de mauvaises manières. Le questeur refuse d’arbitrer : c’est ton affaire.`,
  opts:[
  { id:'a', scopes:['*'], txt:'Partager rigoureusement à parts égales',
    test:{attr:'disciplina', dc:-10},
    succes:{ txt:'Compté, pesé, réparti devant témoins. Personne n’est content et personne ne conteste, ce qui est la définition d’un bon arbitrage.', eff:{disciplina:2,auctoritas:3,unit:{cohaesio:4}} },
    echec:{ txt:'Ton partage égal ignore que l’un des deux groupes a fait tout le travail. Le ressentiment reste.', eff:{unit:{fides:-5}} } },
  { id:'b', scopes:['*'], txt:'Trancher au mérite, en expliquant tes raisons',
    test:{attr:'auctoritas', dc:5},
    succes:{ txt:'Tu attribues les deux tiers à ceux qui ont pris le risque, et tu dis pourquoi devant tout le monde. On accepte parce que c’est raisonné.', eff:{auctoritas:4,ingenium:2,unit:{fides:7}} },
    echec:{ txt:'Ton raisonnement est bon et personne ne l’écoute. On te soupçonne de favoritisme.', eff:{auctoritas:-3,unit:{cohaesio:-5}} } },
  { id:'c', scopes:['*'], txt:'Racheter le lot entier de ta poche et le redistribuer',
    test:{attr:'ingenium', dc:-15},
    succes:{ txt:'Tu paies le lot au prix fort et tu le répartis. C’est cher et cela clôt l’affaire définitivement.', eff:{peculium:-500,unit:{fides:14,cohaesio:6},fama:3} },
    echec:{ txt:'Tu paies, et l’on te trouve un peu trop pressé d’acheter la paix.', eff:{peculium:-500,unit:{fides:6}} } } ]},

{ id:'marche', titre:'Vingt milles avant midi', poids:8, cond:(s)=>s.saison!=='hiberna',
  texte:`Marche forcée. Trente kilos par homme : armes, pieu, meule, outils, rations de seize jours. César marche parfois plus vite que ses propres nouvelles, et c’est ce qui l’a fait gagner plus souvent que ses batailles.`,
  opts:[
  { id:'a', scopes:['*'], txt:'Marcher en tête avec ton paquetage complet',
    test:{attr:'disciplina', unit:'fatigatio', dc:5, inv:true},
    succes:{ txt:'Un officier qui porte ce que portent ses hommes n’a pas besoin de leur parler. Ils arrivent tous.', eff:{disciplina:3,auctoritas:4,unit:{fides:10,fatigatio:14}} },
    echec:{ txt:'Tu cales au quinzième mille et l’on te voit caler.', eff:{valetudo:-12,auctoritas:-3,unit:{fatigatio:16}} } },
  { id:'b', scopes:['*'], txt:'Fermer la colonne et ramasser les traînards',
    test:{attr:'auctoritas', dc:0},
    succes:{ txt:'Personne ne se perd, personne ne reste. Le poste de serre-file est le moins glorieux et le plus utile de la colonne.', eff:{auctoritas:3,unit:{fides:9,fatigatio:12}} },
    echec:{ txt:'Tu perds deux hommes dans un bois et tu les cherches jusqu’à la nuit.', eff:{unit:{fides:-5,fatigatio:16}} } },
  { id:'c', scopes:['centurion','superieur'], txt:'Faire alléger le paquetage sur ta responsabilité',
    test:{attr:'scientia', dc:10},
    succes:{ txt:'Tu fais charger les meules et les pieux sur les mulets de la cohorte, contre le règlement. Ton unité arrive fraîche et personne ne pose de question puisque cela a marché.', eff:{scientia:3,unit:{fatigatio:4,fides:8},fama:3} },
    echec:{ txt:'Le convoi de mulets prend du retard et ton unité arrive après les autres, sans son matériel de fortification.', eff:{fama:-5,favor:{caesar:-4}} } } ]},

{ id:'ambassade', titre:'Une ambassade gauloise', poids:7, cond:(s)=>s.annee<-50 && s.grade.ordre>=4,
  texte:`Des chefs d’un peuple voisin viennent au camp offrir des otages et du blé. Ils parlent bien, ils promettent trop, et l’un d’eux ne dit rien du tout — ce qui est le plus intéressant.`,
  opts:[
  { id:'a', scopes:['*'], txt:'Observer celui qui se tait', test:{attr:'ingenium', dc:5},
    succes:{ txt:'C’est lui qui décide, et il est venu compter nos effectifs. Tu le signales. On le retient, et le peuple livre ses otages pour de bon.', eff:{ingenium:4,scientia:3,fama:6,favor:{caesar:7}} },
    echec:{ txt:'Tu te trompes de silencieux. Le vrai chef repart avec ce qu’il est venu chercher.', eff:{fama:-3} } },
  { id:'b', scopes:['*'], txt:'Traiter correctement les otages qu’on te confie',
    test:{attr:'auctoritas', dc:-10},
    succes:{ txt:'Des enfants de douze à seize ans, fils de chefs. Tu les fais loger décemment, apprendre le latin, et tu leur parles. Dans dix ans, deux d’entre eux commanderont leur peuple et se souviendront de qui les a traités en hommes.', eff:{auctoritas:3,ingenium:3,fama:4,scientia:2} },
    echec:{ txt:'Un otage s’enfuit sous ta garde. La réponse romaine à cela est fixée d’avance et tu dois l’appliquer.', eff:{fama:-5,valetudo:-5} } } ]},

{ id:'presage', titre:'Un présage', poids:6,
  texte:`Les poulets sacrés refusent de manger avant le départ, ce qui est un présage détestable. Le camp le sait avant midi. César, dit-on, a un jour fait jeter les poulets à la mer en disant que s’ils ne voulaient pas manger, ils boiraient — mais c’était son ancêtre, et l’histoire n’en est pas meilleure.`,
  opts:[
  { id:'a', scopes:['*'], txt:'Prendre le présage au sérieux devant tes hommes',
    test:{attr:'ingenium', dc:0},
    succes:{ txt:'Tu fais un sacrifice de ta bourse et tu obtiens un présage favorable au second essai. C’est du théâtre, tes hommes le savent, et cela marche parce que c’est du théâtre partagé.', eff:{ingenium:3,unit:{cohaesio:6,fides:5},peculium:-120} },
    echec:{ txt:'Ton second présage est aussi mauvais que le premier. Tu as doublé l’angoisse au lieu de la dissoudre.', eff:{unit:{cohaesio:-7},peculium:-120} } },
  { id:'b', scopes:['*'], txt:'Le tourner en dérision', test:{attr:'auctoritas', dc:10},
    succes:{ txt:'Tu manges toi-même la ration des poulets devant la centurie. On rit et l’on n’en parle plus.', eff:{auctoritas:4,unit:{cohaesio:5},fama:4} },
    echec:{ txt:'Personne ne rit. Il y a des jours où l’armée romaine est très pieuse, et tu viens d’en trouver un.', eff:{unit:{fides:-6},fama:-3} } } ]},

{ id:'deserteur', titre:'Un déserteur repris', poids:7, cond:(s)=>s.grade.scope!=='soldat',
  texte:`Un homme de ton unité a été repris à douze milles du camp. La peine réglementaire est la mort par bastonnade, exécutée par ses camarades. Il a quatre ans de service et une mère malade à Bononia, et l’un n’excuse pas l’autre.`,
  opts:[
  { id:'a', scopes:['sousoff','centurion','superieur'], txt:'Appliquer la peine',
    test:{attr:'disciplina', dc:5},
    succes:{ txt:'La <span class="lat">fustuarium</span> est exécutée. L’unité l’exécute parce que c’est ainsi que cela se fait, et parce que ce que cela empêche est pire.', eff:{disciplina:4,auctoritas:3,unit:{cohaesio:5,fides:-8}} },
    echec:{ txt:'L’unité exécute en te haïssant. Trois hommes demandent leur mutation le mois suivant.', eff:{unit:{fides:-14},auctoritas:1} } },
