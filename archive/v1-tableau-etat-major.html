<title>Cursus Militiae</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --nox:#12100D;
  --tabula:#1C1915;
  --tabula-2:#231F19;
  --limes:#2E2820;
  --limes-fort:#3E3527;
  --brass:#C8B48A;
  --brass-dim:#8A7F6B;
  --brass-faint:#5E564A;
  --minium:#B03A2E;
  --minium-lum:#D25A45;
  --aerugo:#6E8B6B;
  --bronze:#C9922E;
  --purpura:#7A4A63;

  --f-lapid:'Cinzel',Georgia,'Times New Roman',serif;
  --f-prose:'EB Garamond',Georgia,'Times New Roman',serif;
  --f-data:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;

  --s1:4px; --s2:8px; --s3:12px; --s4:18px; --s5:26px; --s6:40px;
  --r:2px;
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--nox);
  background-image:
    radial-gradient(ellipse 90% 60% at 50% -10%, rgba(201,146,46,.10), transparent 65%),
    radial-gradient(ellipse 70% 50% at 50% 115%, rgba(176,58,46,.06), transparent 60%);
  background-attachment:fixed;
  color:var(--brass);
  font-family:var(--f-prose);
  font-size:17px;
  line-height:1.55;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:var(--f-lapid);font-weight:600;text-wrap:balance;margin:0;letter-spacing:.06em;}
p{margin:0 0 var(--s3);}
p:last-child{margin-bottom:0;}
button{font-family:inherit;font-size:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--bronze);outline-offset:2px;}
::selection{background:var(--minium);color:#F2E6CE;}

/* ---------- shell ---------- */
.wrap{max-width:1420px;margin:0 auto;padding:var(--s4) var(--s4) var(--s6);}

.lapis{
  border:1px solid var(--limes-fort);
  border-radius:var(--r);
  background:linear-gradient(180deg,#221E17,#191612);
  padding:var(--s4) var(--s5);
  display:flex;flex-wrap:wrap;gap:var(--s4);
  align-items:baseline;justify-content:space-between;
  box-shadow:inset 0 1px 0 rgba(200,180,138,.09);
}
.lapis-t{font-family:var(--f-lapid);font-size:22px;font-weight:700;letter-spacing:.22em;color:var(--brass);}
.lapis-t small{display:block;font-family:var(--f-data);font-size:10px;letter-spacing:.28em;color:var(--brass-faint);margin-top:3px;font-weight:400;}
.lapis-d{font-family:var(--f-data);font-size:12.5px;letter-spacing:.1em;color:var(--brass-dim);text-align:right;line-height:1.7;}
.lapis-d b{color:var(--bronze);font-weight:600;}
.lapis-tools{display:flex;gap:var(--s2);}

/* ---------- generic panel ---------- */
.pan{
  border:1px solid var(--limes);
  border-radius:var(--r);
  background:var(--tabula);
  margin-top:var(--s4);
}
.pan-h{
  font-family:var(--f-lapid);font-size:11.5px;font-weight:700;letter-spacing:.22em;
  text-transform:uppercase;color:var(--brass-dim);
  padding:var(--s3) var(--s4);
  border-bottom:1px solid var(--limes);
  display:flex;justify-content:space-between;align-items:center;gap:var(--s3);
}
.pan-h em{font-family:var(--f-data);font-style:normal;font-size:10.5px;letter-spacing:.14em;color:var(--brass-faint);text-transform:none;}
.pan-b{padding:var(--s4);}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:295px minmax(0,1fr) 295px;gap:var(--s4);align-items:start;}
@media(max-width:1180px){
  .board{grid-template-columns:1fr 1fr;}
  .col-mid{grid-column:1/-1;grid-row:1;}
}
@media(max-width:760px){
  .board{grid-template-columns:1fr;}
  .col-mid{grid-row:auto;order:-1;}          /* l'action d'abord, la fiche ensuite */
  .pan-h{flex-direction:column;align-items:flex-start;gap:4px;}
  .lapis{flex-direction:column;gap:var(--s3);}
  .lapis-d{text-align:left;}
}

/* ---------- fiche ---------- */
.nomen{font-family:var(--f-lapid);font-size:19px;font-weight:700;letter-spacing:.05em;line-height:1.25;color:#E0CFA6;}
.gradus{font-family:var(--f-data);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze);margin-top:6px;}
.unitas{font-family:var(--f-data);font-size:11px;letter-spacing:.1em;color:var(--brass-faint);margin-top:3px;}
.rule{height:1px;background:var(--limes);margin:var(--s4) 0;border:0;}

/* notched tally gauge */
.attr{margin-bottom:var(--s3);}
.attr:last-child{margin-bottom:0;}
.attr-top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);margin-bottom:5px;}
.attr-n{font-family:var(--f-data);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--brass-dim);}
.attr-v{font-family:var(--f-data);font-size:12px;font-weight:600;color:var(--brass);font-variant-numeric:tabular-nums;}
.attr-v .delta{font-size:10px;margin-left:5px;}
.tally{display:flex;gap:2px;height:13px;}
.tick{flex:1;background:var(--limes-fort);border-radius:1px;}
.tick.on{background:var(--brass-dim);}
.tick.hi{background:var(--bronze);box-shadow:0 0 5px rgba(201,146,46,.5);}
.tick.warn{background:var(--minium);}

.kv{display:flex;justify-content:space-between;gap:var(--s2);font-family:var(--f-data);font-size:12px;padding:3px 0;color:var(--brass-dim);}
.kv b{color:var(--brass);font-weight:500;font-variant-numeric:tabular-nums;}
.kv b.good{color:var(--aerugo);} .kv b.bad{color:var(--minium-lum);} .kv b.gold{color:var(--bronze);}

.vulnera{font-family:var(--f-prose);font-size:14px;color:var(--minium-lum);font-style:italic;line-height:1.4;margin-top:var(--s2);}
.vulnera div{margin-bottom:3px;}

/* ---------- dispatch (center) ---------- */
.disp-h{
  font-family:var(--f-lapid);font-size:15px;font-weight:700;letter-spacing:.13em;
  color:#E0CFA6;text-transform:uppercase;
}
.disp-sub{font-family:var(--f-data);font-size:11px;letter-spacing:.14em;color:var(--brass-faint);margin-top:5px;text-transform:uppercase;}
.prose{max-width:66ch;font-size:17.5px;line-height:1.62;color:#BFAE88;}
.prose em{color:var(--brass);font-style:italic;}
.prose strong{color:#E0CFA6;font-weight:600;}
.prose .lat{font-style:italic;color:var(--bronze);}

.speech{
  border-left:2px solid var(--minium);
  padding:2px 0 2px var(--s4);
  margin:0 0 var(--s3);
}
.speech{color:#CBBA92;}
.speech cite{display:block;font-style:normal;font-family:var(--f-data);font-size:11px;letter-spacing:.12em;color:var(--brass-faint);margin-top:6px;}

/* choices */
.opts{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s4);}
.opt{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:var(--tabula-2);border:1px solid var(--limes-fort);border-radius:var(--r);
  padding:var(--s3) var(--s4);
  transition:border-color .13s,background .13s,transform .13s;
  font-size:16.5px;line-height:1.45;color:#C4B38C;
  position:relative;
}
.opt:hover:not(:disabled){border-color:var(--bronze);background:#292319;transform:translateX(2px);}
.opt:disabled{cursor:not-allowed;opacity:.4;}
.opt-k{
  font-family:var(--f-lapid);font-size:12px;font-weight:700;color:var(--bronze);
  letter-spacing:.1em;margin-right:var(--s3);
}
.opt-meta{
  display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:6px;margin-left:26px;
  font-family:var(--f-data);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass-faint);
}
.opt-meta .risk{color:var(--minium-lum);}
.opt-meta .gain{color:var(--aerugo);}
.opt-meta .lock{color:var(--purpura);}
.opt-note{margin-left:26px;margin-top:5px;font-size:14.5px;font-style:italic;color:var(--brass-faint);line-height:1.4;}

/* outcome */
.outcome{
  border-left:3px solid var(--bronze);background:#1F1B14;
  padding:var(--s3) var(--s4);margin-top:var(--s4);border-radius:0 var(--r) var(--r) 0;
}
.outcome.ill{border-left-color:var(--minium);}
.outcome.bene{border-left-color:var(--aerugo);}
.outcome-t{font-family:var(--f-lapid);font-size:11.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--bronze);margin-bottom:var(--s2);}
.outcome.ill .outcome-t{color:var(--minium-lum);}
.outcome.bene .outcome-t{color:var(--aerugo);}
.effs{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);margin-top:var(--s3);font-family:var(--f-data);font-size:11px;letter-spacing:.06em;}
.eff-up{color:var(--aerugo);} .eff-dn{color:var(--minium-lum);} .eff-nt{color:var(--brass-faint);}

/* action grid */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);}
@media(max-width:620px){.acts{grid-template-columns:1fr;}}
.act{
  text-align:left;cursor:pointer;background:var(--tabula-2);
  border:1px solid var(--limes-fort);border-radius:var(--r);padding:var(--s3);
  transition:border-color .13s,background .13s;
}
.act:hover:not(:disabled){border-color:var(--bronze);background:#292319;}
.act:disabled{opacity:.35;cursor:not-allowed;}
.act-n{font-family:var(--f-lapid);font-size:13px;font-weight:600;letter-spacing:.07em;color:#D6C49B;}
.act-d{font-size:14px;color:var(--brass-faint);line-height:1.35;margin-top:4px;font-style:italic;}
.act-e{font-family:var(--f-data);font-size:10px;letter-spacing:.1em;color:var(--brass-dim);margin-top:6px;text-transform:uppercase;}

/* tempus pips */
.tempus{display:flex;gap:5px;align-items:center;}
.pip{width:11px;height:11px;border:1px solid var(--bronze);border-radius:50%;}
.pip.spent{background:transparent;border-color:var(--brass-faint);opacity:.4;}
.pip.left{background:var(--bronze);box-shadow:0 0 6px rgba(201,146,46,.55);}

/* roster / patrons */
.row{
  display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s2);
  padding:var(--s2) 0;border-bottom:1px dotted var(--limes-fort);
}
.row:last-child{border-bottom:0;}
.row-n{font-family:var(--f-prose);font-size:15.5px;color:#C7B68E;line-height:1.25;}
.row-s{font-family:var(--f-data);font-size:10px;letter-spacing:.1em;color:var(--brass-faint);text-transform:uppercase;margin-top:2px;display:block;}
.row-v{font-family:var(--f-data);font-size:11.5px;color:var(--brass-dim);white-space:nowrap;font-variant-numeric:tabular-nums;}
.row.dead .row-n{color:var(--brass-faint);text-decoration:line-through;text-decoration-color:var(--minium);}
.row.dead .row-s{color:var(--minium);}
.row.foe .row-n{color:var(--minium-lum);}

.favbar{display:inline-block;width:52px;height:6px;background:var(--limes-fort);border-radius:1px;vertical-align:middle;margin-left:6px;overflow:hidden;}
.favbar i{display:block;height:100%;background:var(--bronze);}
.favbar.neg i{background:var(--minium);}

/* log */
.log{max-height:250px;overflow-y:auto;font-family:var(--f-data);font-size:12px;line-height:1.6;color:var(--brass-faint);}
.log div{padding:2px 0;border-bottom:1px dotted rgba(62,53,39,.55);}
.log .y{color:var(--bronze);}
.log .r{color:var(--minium-lum);}
.log .g{color:var(--aerugo);}

/* battle */
.acies{border:1px solid var(--minium);background:linear-gradient(180deg,#241713,#1A1512);}
.acies .pan-h{color:var(--minium-lum);border-bottom-color:#4A241C;}
.phase-rail{display:flex;gap:4px;margin-bottom:var(--s4);}
.phase-rail i{flex:1;height:3px;background:var(--limes-fort);border-radius:1px;}
.phase-rail i.done{background:var(--brass-dim);}
.phase-rail i.now{background:var(--minium);box-shadow:0 0 6px rgba(176,58,46,.7);}
.vue{
  font-family:var(--f-data);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--brass-faint);border:1px dashed var(--limes-fort);border-radius:var(--r);
  padding:var(--s2) var(--s3);margin-bottom:var(--s4);
}
.vue b{color:var(--bronze);font-weight:500;}
.gauges{display:flex;flex-wrap:wrap;gap:var(--s4);margin-top:var(--s3);}
.g-item{font-family:var(--f-data);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass-faint);}
.g-item b{display:block;font-size:19px;letter-spacing:0;color:var(--brass);margin-top:2px;font-variant-numeric:tabular-nums;}
.g-item b.bad{color:var(--minium-lum);} .g-item b.good{color:var(--aerugo);}

/* inscription (death / retirement) */
.stone{
  max-width:560px;margin:var(--s6) auto;padding:var(--s6) var(--s5);
  border:1px solid var(--limes-fort);border-radius:var(--r);
  background:linear-gradient(175deg,#3A342A 0%,#302A21 45%,#241F19 100%);
  border-color:#4C4235;
  text-align:center;
  box-shadow:inset 0 2px 0 rgba(224,207,166,.16), inset 0 -1px 0 rgba(0,0,0,.4), 0 24px 60px rgba(0,0,0,.62);
}
.stone-l{
  font-family:var(--f-lapid);font-weight:600;
  color:#CDBB90;letter-spacing:.3em;line-height:2.05;
  font-size:15px;text-transform:uppercase;
}
.stone-l.big{font-size:21px;color:#F0E2BC;letter-spacing:.24em;}
.stone-l.dm{font-size:13px;color:var(--minium-lum);letter-spacing:.5em;margin-bottom:var(--s4);}
.stone-foot{margin-top:var(--s5);font-family:var(--f-prose);font-style:italic;color:#9A8D75;font-size:15px;letter-spacing:0;text-transform:none;line-height:1.5;}

/* buttons */
.btn{
  font-family:var(--f-lapid);font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  background:transparent;border:1px solid var(--limes-fort);color:var(--brass-dim);
  padding:8px 15px;border-radius:var(--r);cursor:pointer;transition:.13s;white-space:nowrap;
}
.btn:hover{border-color:var(--bronze);color:var(--bronze);}
.btn.prim{border-color:var(--bronze);color:var(--bronze);background:rgba(201,146,46,.09);}
.btn.prim:hover{background:rgba(201,146,46,.19);}
.btn.dgr:hover{border-color:var(--minium);color:var(--minium-lum);}
.btnrow{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s4);}

/* setup */
.setup{max-width:760px;margin:0 auto;}
.field{margin-bottom:var(--s4);}
.field label{display:block;font-family:var(--f-data);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass-faint);margin-bottom:var(--s2);}
.field input{
  width:100%;background:var(--nox);border:1px solid var(--limes-fort);border-radius:var(--r);
  color:var(--brass);font-family:var(--f-prose);font-size:18px;padding:9px var(--s3);
}
.field input:focus{border-color:var(--bronze);outline:none;}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:var(--s2);}
.pick{
  cursor:pointer;text-align:left;background:var(--tabula-2);border:1px solid var(--limes-fort);
  border-radius:var(--r);padding:var(--s3) var(--s4);transition:.13s;
}
.pick:hover{border-color:var(--bronze);}
.pick.sel{border-color:var(--bronze);background:rgba(201,146,46,.1);}
.pick-n{font-family:var(--f-lapid);font-size:14px;font-weight:600;letter-spacing:.06em;color:#D6C49B;}
.pick-d{font-size:14.5px;color:var(--brass-faint);font-style:italic;line-height:1.35;margin-top:4px;}
.pick-e{font-family:var(--f-data);font-size:10px;letter-spacing:.1em;color:var(--aerugo);margin-top:6px;}

.hint{font-family:var(--f-data);font-size:11px;letter-spacing:.08em;color:var(--brass-faint);line-height:1.6;}
.center{text-align:center;}
.hidden{display:none !important;}
.scroller{overflow-x:auto;}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important;}
}
</style>
<div id="app"></div>
<script>
/* ===== src/data-core.js ===== */
/* ============================================================

   Rome, 58–45 av. J.-C. — légions de C. Iulius Caesar
   ============================================================ */

const SAISONS = [
  { id:'ver',     nom:'Ver',     fr:'Printemps', desc:'Le camp se réveille, on rassemble le blé et les recrues.' },
  { id:'aestas',  nom:'Aestas',  fr:'Été',       desc:'Saison de la guerre. On marche.' },
  { id:'hiberna', nom:'Hiberna', fr:'Quartiers d’hiver', desc:'On s’enterre dans les camps, on compte les morts et les vivants.' }
];

/* ---------- attributs ---------- */
const ATTRS = [
  { id:'virtus',     nom:'Virtus',     fr:'Courage au fer',     desc:'Ta valeur devant l’ennemi, et ce que les autres croient de toi quand la ligne plie.' },

  { id:'auctoritas', nom:'Auctoritas', fr:'Ascendant',          desc:'Ce qui fait qu’un ordre de toi est exécuté avant d’être compris.' },
  { id:'ingenium',   nom:'Ingenium',   fr:'Entregent',          desc:'Lire une salle, placer un mot, se faire un patron. Rome se gagne aussi ainsi.' }
];

/* ---------- cursus ---------- */
/* scope : ce que tu VOIS et COMMANDES en bataille */
const GRADES = [
  { id:'tiro',        nom:'Tiro',                     court:'TIRO',      scope:'soldat',    unite:'contubernium', stip:150,   ordre:0,
    desc:'Recrue. On te reprend ta pique de bois quand tu sais t’en servir.' },
  { id:'miles',       nom:'Miles gregarius',          court:'MILES',     scope:'soldat',    unite:'contubernium', stip:225,   ordre:1,

  { id:'immunis',     nom:'Immunis',                  court:'IMMVNIS',   scope:'soldat',    unite:'contubernium', stip:225,   ordre:2,

  { id:'signifer',    nom:'Signifer',                 court:'SIGNIFER',  scope:'sousoff',   unite:'centuria',     stip:450,   ordre:4,
    desc:'Tu portes l’enseigne de la centurie et tu tiens la caisse d’épargne des hommes.' },
  { id:'optio',       nom:'Optio centuriae',          court:'OPTIO',     scope:'sousoff',   unite:'centuria',     stip:450,   ordre:4,
    desc:'Second du centurion, à l’arrière du rang, bâton en main : nul ne recule.' },
  { id:'aquilifer',   nom:'Aquilifer',                court:'AQVILIFER', scope:'sousoff',   unite:'legio',        stip:450,   ordre:5,
    desc:'Tu portes l’aigle de la légion. Là où elle va, la légion suit ou meurt.' },
  { id:'centurio',    nom:'Centurio',                 court:'CENTVRIO',  scope:'centurion', unite:'centuria',     stip:3750,  ordre:6,
    desc:'Quatre-vingts hommes. Tu marches au premier rang, à droite. C’est là qu’on meurt.' },
  { id:'pilus_prior', nom:'Centurio pilus prior',     court:'PILVS PR.', scope:'centurion', unite:'cohors',       stip:5000,  ordre:7,
    desc:'Centurion supérieur : la cohorte entière manœuvre à ta voix.' },
  { id:'primi_ordinis',nom:'Centurio primi ordinis',  court:'PRIMI ORD.',scope:'superieur', unite:'cohors',       stip:7500,  ordre:8,
    desc:'Centurion de la première cohorte. Tu sièges au conseil de guerre.' },
  { id:'primipilus',  nom:'Primus pilus',             court:'PRIMIPILVS',scope:'superieur', unite:'legio',        stip:15000, ordre:9,
    desc:'Premier centurion de la légion. Après toi, il n’y a que le légat — et César.' },
  { id:'praef_fabrum',nom:'Praefectus fabrum',        court:'PRAEF. FAB.',scope:'superieur',unite:'legio',        stip:20000, ordre:10,
    desc:'Chef du génie et de l’intendance du proconsul. Rang équestre.' },
  { id:'tribunus',    nom:'Tribunus militum',         court:'TRIBVNVS',  scope:'superieur', unite:'legio',        stip:24000, ordre:11,
    desc:'Tribun de la légion. On te confie des cohortes, parfois une aile entière.' },

/* ---------------- 58 : les Helvètes et Arioviste ---------------- */
{ an:-58, sa:'ver', lieu:'Genava, sur le Rhône', titre:'Le pont de Genève',
  recit:`Le proconsul est arrivé de Rome en huit jours — on dit qu’il a crevé des chevaux. Il n’avait qu’une légion : la tienne, la <span class="lat">Legio X</span>. Il a fait couper le pont sur le Rhône et bâtir dix-neuf milles de rempart contre les Helvètes, qui sont trois cent mille et veulent traverser.<br><br>Tu portes le pieu, la meule, la palissade et deux semaines de blé. On appelle cela être un <span class="lat">mulus Marianus</span>, une mule de Marius. Le rempart monte.` },
{ an:-58, sa:'aestas', lieu:'Bibracte, chez les Éduens', titre:'Bibracte', bataille:'bibracte',
  recit:`Ils ont contourné le rempart par le pays des Séquanes. Nous les avons suivis quinze jours, mangeant le grain que les Éduens promettaient et ne livraient pas. Ce matin, César a fait retirer tous les chevaux du champ, à commencer par le sien.<br><br>« <em>Que nul n’ait d’espoir dans la fuite</em> », a-t-il dit. La colline est derrière nous. Les Helvètes montent.` },
{ an:-58, sa:'hiberna', lieu:'Plaine d’Alsace, contre les Germains', titre:'Arioviste', bataille:'arioviste',
  recit:`À Besançon, la panique a pris l’armée : les marchands racontaient la taille des Germains, leur regard qu’on ne peut soutenir. Des tribuns ont demandé des congés en pleurant, des testaments circulaient sous les tentes.<br><br>César a convoqué le conseil et dit qu’il partirait avec la Dixième seule, s’il le fallait, et qu’elle lui servirait de garde prétorienne. Ta légion en est encore ivre d’orgueil. On marche sur Arioviste.` },

/* ---------------- 57 : les Belges ---------------- */
{ an:-57, sa:'ver', lieu:'Sur l’Axona, chez les Rèmes', titre:'Le pays des Belges',
  recit:`Deux légions neuves sont arrivées de Cisalpine, la XI et la XII. Les vétérans les regardent comme on regarde du blé vert. Nous marchons vers le nord : les Belges se sont ligués, on parle de trois cent mille hommes en armes.<br><br>Le camp sur l’Aisne est un ouvrage de manuel : fossé de dix-huit pieds, deux redoutes, un pont gardé. César ne livre bataille que sur un terrain qu’il a fabriqué lui-même.`,
  evenement:'axona' },
{ an:-57, sa:'aestas', lieu:'La Sambre, chez les Nerviens', titre:'La Sambre', bataille:'sabis',
  recit:`Nous bâtissions le camp au-dessus de la rivière, sacs à terre, quand les Nerviens sont sortis du bois d’un seul coup. Soixante mille hommes. Pas de ligne, pas de trompettes, pas d’ordre reçu — chacun se range à l’enseigne la plus proche.<br><br>Sur l’aile gauche, la XII est en train de mourir : tous ses centurions sont tombés, le porte-enseigne de la quatrième cohorte est mort avec son aigle.` },
{ an:-57, sa:'hiberna', lieu:'Chez les Aduatuques', titre:'Le prix de la parole donnée',
  recit:`Les Aduatuques se sont enfermés dans leur oppidum et ont ri de nos tours de siège, jusqu’à ce qu’ils voient une tour de bois marcher vers eux. Alors ils ont demandé la paix, rendu leurs armes par-dessus le mur — et, la nuit venue, ont tenté une sortie avec les armes cachées.<br><br>Au matin, César a vendu la ville entière : cinquante-trois mille têtes, adjugées d’un seul lot au marchand qui suivait l’armée. Chaque homme a touché sa part.`,
  evenement:'aduatuques' },

/* ---------------- 56 : les Vénètes ---------------- */
{ an:-56, sa:'ver', lieu:'Sur l’Océan, chez les Vénètes', titre:'Une guerre sur l’eau',
  recit:`Les Vénètes ont saisi nos officiers envoyés chercher du blé. Leurs oppida sont sur des pointes que la marée isole deux fois par jour : on prend la ville, la marée monte, la flotte les emporte, et tout est à recommencer.<br><br>César a fait bâtir des galères sur la Loire. Des légionnaires qui n’ont jamais vu la mer arment des vaisseaux contre des marins.`,
  evenement:'venetes' },
{ an:-56, sa:'aestas', lieu:'Golfe du Morbihan', titre:'Les faux de marine', bataille:'venetes' },
{ an:-56, sa:'hiberna', lieu:'Quartiers d’hiver, vallée de la Loire', titre:'Le partage du monde',
  recit:`À Lucques, ce printemps, César, Pompée et Crassus se sont partagé le monde comme trois hommes partagent une succession : l’Espagne à l’un, la Syrie à l’autre, et cinq années de plus en Gaule pour le nôtre.<br><br>Cinq ans. Le camp fait ses comptes : cinq ans de solde, de butin, de marches — et, pour beaucoup, cinq ans de vie.`,
  evenement:'hiberna_gen' },

/* ---------------- 55 : le Rhin et la Bretagne ---------------- */
{ an:-55, sa:'ver', lieu:'Confluent de la Meuse et du Rhin', titre:'Les Usipètes',
  recit:`Quatre cent mille Germains ont passé le Rhin. Leurs chefs sont venus au camp sous couvert de trêve. César les a fait arrêter, puis a lancé l’armée sur le camp resté sans chefs.<br><br>Il n’y a pas eu de bataille. Il y a eu ce qui suit une bataille, mais sans la bataille : les femmes et les enfants dans le confluent, la cavalerie derrière. À Rome, Caton demandera qu’on livre César aux Germains pour crime contre la parole donnée.`,
  evenement:'usipetes' },
{ an:-55, sa:'aestas', lieu:'Rive du Rhin, puis Portus Itius', titre:'Dix jours de pont',
  recit:`Il aurait pu passer sur les barques des Ubiens. Il a jugé cela indigne du peuple romain. Le génie a planté des pieux jumelés en biais dans le courant, entretoisés, lestés par la poussée du fleuve lui-même : plus l’eau pousse, plus le pont serre.<br><br>Dix jours de la coupe du bois au passage des légions. Dix-huit jours en Germanie, personne à combattre, et le pont détruit derrière nous. Le message est passé.<br><br>Puis on a mis à la voile pour la Bretagne, avec deux légions et pas assez de navires.`,
  evenement:'britannia1' },
{ an:-55, sa:'hiberna', lieu:'Quartiers d’hiver, Belgique', titre:'La flotte brisée',
  recit:`Une marée de pleine lune, que personne n’avait prévue, a jeté les navires de transport les uns sur les autres. Nous sommes rentrés à l’étroit, en deux voyages, sans un otage de plus qu’au départ.<br><br>Rome a décrété vingt jours d’actions de grâces. Le camp, lui, sait exactement ce qui s’est passé.`,
  evenement:'hiberna_gen' },

/* ---------------- 54 : la Bretagne, puis le désastre ---------------- */
{ an:-54, sa:'ver', lieu:'Portus Itius', titre:'Huit cents navires',
  recit:`Cette fois, huit cents navires bâtis sur un modèle dessiné par César lui-même : plus bas, plus larges, tirés à sec facilement. Cinq légions et deux mille cavaliers.<br><br>Dumnorix l’Éduen a refusé d’embarquer et a fui avec sa cavalerie en criant qu’il était un homme libre d’un peuple libre. La cavalerie l’a rattrapé et tué.`,
  evenement:'dumnorix' },
{ an:-54, sa:'aestas', lieu:'Au-delà de la Tamise, chez les Trinovantes', titre:'Cassivellaunos', bataille:'britannia' },
{ an:-54, sa:'hiberna', lieu:'Atuatuca, chez les Éburons', titre:'Atuatuca', bataille:'atuatuca',
  recit:`La récolte a manqué : les huit légions sont dispersées en huit camps d’hiver, à cent milles les uns des autres. C’est là qu’Ambiorix a frappé.<br><br>Sabinus a cru à sa parole et fait sortir quinze cohortes du camp d’Atuatuca. Elles sont mortes dans un défilé, jusqu’au dernier ou presque. Cotta est tombé le visage fracassé, en refusant de parlementer. Le lendemain, les Nerviens étaient devant le camp de Quintus Cicéron.` },

/* ---------------- 53 : la vengeance ---------------- */
{ an:-53, sa:'ver', lieu:'Camp d’hiver, Samarobriva', titre:'Reconstruire',
  recit:`César a juré de ne pas se raser ni se couper les cheveux avant d’avoir vengé les quinze cohortes. Trois légions ont été levées en une saison — dont une empruntée à Pompée, qui la prêta de bonne grâce. Alors.<br><br>Il y a maintenant dix légions en Gaule. Le camp est plein d’hommes qui ne savent pas encore tenir un rang.`,
  evenement:'levee53' },
{ an:-53, sa:'aestas', lieu:'Forêt des Ardennes, chez les Éburons', titre:'La chasse à Ambiorix',
  recit:`Ce n’est pas une guerre, c’est une battue. César a fait proclamer que le pays des Éburons était offert au pillage à quiconque voudrait venir : Gaulois, Germains, marchands. On brûle les fermes, on coupe le blé sur pied, on comble les puits.<br><br>Ambiorix s’échappe toujours, avec quatre cavaliers. Le camp commence à trouver cela drôle, puis ne le trouve plus.`,
  evenement:'eburons' },
{ an:-53, sa:'hiberna', lieu:'Quartiers d’hiver, Gaule du Nord', titre:'Carrhes',
  recit:`La nouvelle est arrivée de Syrie avec deux mois de retard. Crassus, sept légions, anéanties par les archers parthes à Carrhes. Trente mille Romains. On dit qu’ils ont coulé de l’or fondu dans la bouche du triumvir.<br><br>Ils étaient trois à se partager le monde. Ils ne sont plus que deux, et il n’y a plus rien entre eux.`,
  evenement:'carrhes' },

/* ---------------- 52 : Vercingétorix ---------------- */
{ an:-52, sa:'ver', lieu:'Avaricum, chez les Bituriges', titre:'Avaricum', bataille:'avaricum',
  recit:`Toute la Gaule s’est levée derrière un jeune Arverne. Il a compris ce qu’aucun n’avait compris : ne pas nous livrer bataille, brûler devant nous. Vingt villes des Bituriges ont brûlé en un jour, par la main de leurs habitants.<br><br>Ils ont supplié d’épargner Avaricum, la plus belle ville de Gaule. Vercingétorix a cédé. Nous sommes devant, dans la boue, à la ration de vingt jours qui en dure quarante. La terrasse monte : vingt-cinq pieds de haut, trois cents de large.` },
{ an:-52, sa:'aestas', lieu:'Gergovie, chez les Arvernes', titre:'Gergovie', bataille:'gergovie' },
{ an:-52, sa:'hiberna', lieu:'Alésia, chez les Mandubiens', titre:'Alésia', bataille:'alesia',
  recit:`Onze milles de contrevallation vers l’intérieur, quatorze de circonvallation vers l’extérieur. Deux fossés, l’un rempli d’eau détournée. Des <span class="lat">cippi</span>, des <span class="lat">lilia</span>, des <span class="lat">stimuli</span> — des pieux ferrés cachés sous la terre battue. Vingt-trois redoutes.<br><br>Quatre-vingt mille hommes enfermés dedans. Une armée de secours gauloise qu’on annonce à un quart de million derrière nous. Et nous entre les deux, sur une bande de terre de nos propres mains.` },

/* ---------------- 51 : la fin de la Gaule ---------------- */
{ an:-51, sa:'ver', lieu:'Chez les Bituriges, puis les Carnutes', titre:'Éteindre les braises',
  recit:`Il n’y a plus d’armée gauloise. Il reste des peuples qui n’ont pas encore compris. César marche en plein hiver, deux légions, quarante jours de raid, puis rentre et distribue une prime de deux cents sesterces par homme et deux mille par centurion, pour la peine d’avoir marché hors saison.<br><br>Il paie de sa bourse. Personne n’a l’air de trouver cela étrange.`,
  evenement:'pacification' },
{ an:-51, sa:'aestas', lieu:'Uxellodunum, chez les Cadurques', titre:'Uxellodunum', bataille:'uxellodunum' },
{ an:-51, sa:'hiberna', lieu:'Quartiers d’hiver, Belgique', titre:'Le compte des années',
  recit:`La Gaule est prise. Un million de morts, dit-on, autant d’esclaves. César passe l’hiver à parcourir les cités, à couvrir les chefs d’honneurs et à ne rien exiger de plus : il lui faut la Gaule tranquille derrière lui.<br><br>Car à Rome, ses ennemis comptent les jours qui le séparent de la fin de son commandement, et du procès qui suivra. Un proconsul est inviolable. Un particulier ne l’est pas.`,
  evenement:'hiberna_gen' },

/* ---------------- 50 : l’année suspendue ---------------- */
{ an:-50, sa:'ver', lieu:'Cisalpine, quartiers de Ravenne', titre:'Deux légions rendues',
  recit:`Le Sénat a exigé deux légions pour la guerre parthe : une de Pompée, une de César. Pompée a réclamé celle qu’il avait prêtée en 53. César a donc rendu deux légions — et donné à chaque homme deux cent cinquante deniers avant le départ.<br><br>Les deux légions n’ont jamais vu la Parthie. Elles sont en Italie, sous Pompée. À qui appartiennent des hommes qu’on a payés d’une main et transférés de l’autre ? La question traîne dans le camp comme une odeur.`,
  evenement:'legions_rendues' },
{ an:-50, sa:'aestas', lieu:'Cisalpine', titre:'L’attente',
  recit:`Rien à assiéger, rien à marcher. L’armée s’engourdit dans les villes du Pô, et César fait le tour des colonies en candidat plus qu’en proconsul : il paie les dettes, dote les municipes, se fait acclamer.<br><br>À Rome, le tribun Curion propose que les deux hommes déposent leurs armées en même temps. La motion passe par trois cent soixante-dix voix contre vingt-deux. Le consul lève la séance et fait comme si de rien n’était.`,
  evenement:'attente50' },
{ an:-50, sa:'hiberna', lieu:'Ravenne', titre:'Le décret ultime',
  recit:`Le sept janvier, le Sénat a voté le <span class="lat">senatus consultum ultimum</span> : que les magistrats veillent à ce que la République ne subisse aucun dommage. Les tribuns Antoine et Cassius ont fui Rome déguisés en esclaves et sont arrivés à Ravenne dans une charrette louée.<br><br>César n’a ici qu’une légion : la tienne. Les autres sont encore en Gaule, à des semaines de marche. Il fait donner des jeux, dîne longuement, et sort de table.`,
  evenement:'veille_rubicon' },

/* ---------------- 49 : le Rubicon ---------------- */
{ an:-49, sa:'ver', lieu:'Le Rubicon, frontière de l’Italie', titre:'Le Rubicon', evenement:'rubicon',
  recit:`Un ruisseau. On le passe à gué sans se mouiller les genoux. De l’autre côté, ce n’est plus la province : c’est l’Italie, où nul proconsul n’entre en armes.<br><br>Il est resté longtemps sur la rive à ne rien dire. Puis il s’est tourné vers nous.` },
{ an:-49, sa:'aestas', lieu:'Ilerda, Hispanie citérieure', titre:'Ilerda', bataille:'ilerda' },
{ an:-49, sa:'hiberna', lieu:'Placentia, Cisalpine', titre:'La mutinerie de Plaisance', evenement:'placentia',
  recit:`L’Espagne prise sans grande bataille, Massilia tombée, la Sardaigne et la Sicile acquises. Et pourtant l’armée gronde : en Afrique, Curion et deux légions ont été anéantis par les Numides. Le butin promis n’arrive pas. La Neuvième refuse de marcher.<br><br>César est venu seul devant elle et a prononcé le mot de <span class="lat">decimatio</span>.` },

/* ---------------- 48 : Dyrrachium et Pharsale ---------------- */
{ an:-48, sa:'ver', lieu:'Dyrrachium, Épire', titre:'Dyrrachium', bataille:'dyrrachium',
  recit:`Nous avons passé l’Adriatique en hiver, en deux voyages, sous le nez d’une flotte cinq fois supérieure. La moitié de l’armée est restée bloquée trois mois de l’autre côté.<br><br>Ici, l’assiégeant est le plus affamé : Pompée tient la mer et le port, nous tenons quinze milles de lignes autour de lui et nous mangeons une racine broyée qu’on appelle du pain. Les Pompéiens en ont jeté des morceaux par-dessus le rempart en riant.` },
{ an:-48, sa:'aestas', lieu:'Plaine de Pharsale, Thessalie', titre:'Pharsale', bataille:'pharsale' },
{ an:-48, sa:'hiberna', lieu:'Alexandrie, quartier du palais', titre:'Le piège d’Alexandrie',
  recit:`Pompée est mort sur une plage égyptienne, la tête coupée par ses propres affranchis. On l’a apportée à César dans un linge ; il a détourné les yeux et pleuré, et personne n’a su la part de chaque chose.<br><br>Puis il s’est mêlé de la succession d’Égypte avec trois mille deux cents hommes, dans une ville de trois cent mille. Nous sommes enfermés dans le quartier du palais, à boire l’eau des puits que les Alexandrins salent depuis la mer.`,
  evenement:'alexandrie' },

/* ---------------- 47 : Alexandrie, Zela, la mutinerie ---------------- */
{ an:-47, sa:'ver', lieu:'Le Phare, Alexandrie', titre:'Le combat du Phare', bataille:'pharos' },
{ an:-47, sa:'aestas', lieu:'Zela, Pont — puis Campanie', titre:'Veni, vidi, vici',
  recit:`Pharnace, fils de Mithridate, a cru le moment venu et a lancé ses chars à faux en montée contre notre camp en construction. Quatre heures, et le royaume de Pont était rendu. César a écrit trois mots à un ami de Rome.<br><br>Mais en Campanie, les légions vétérannes qui attendent d’embarquer pour l’Afrique refusent de bouger. Elles réclament leur congé, leurs terres et l’argent promis. La Dixième est en tête.`,
  evenement:'mutinerie_x' },
{ an:-47, sa:'hiberna', lieu:'Lilybée, Sicile — embarquement pour l’Afrique', titre:'Vers l’Afrique',
  recit:`César a fait dresser sa tente sur la plage même, à portée de vague, pour que nul ne doute qu’on embarque. Il part sans savoir où sont ses navires ni combien le suivent, en plein hiver, contre une armée pompéienne de dix légions et cent vingt éléphants.<br><br>À terre, en Afrique, il a trébuché en sautant du navire. Il a saisi le sable à deux mains et crié : « <em>Je te tiens, Afrique !</em> » On a ri. C’était le but.`,
  evenement:'hiberna_gen' },

/* ---------------- 46 : Ruspina, Thapsus, les triomphes ---------------- */
{ an:-46, sa:'ver', lieu:'Ruspina, Africa', titre:'Ruspina', bataille:'ruspina' },
{ an:-46, sa:'aestas', lieu:'Thapsus, Africa', titre:'Thapsus', bataille:'thapsus' },
{ an:-46, sa:'hiberna', lieu:'Rome — le Champ de Mars', titre:'Quatre triomphes',
  recit:`Quatre triomphes en un mois : Gaule, Égypte, Pont, Afrique. Vercingétorix, gardé six ans dans une cellule du Tullianum, a marché devant le char, puis on l’a étranglé le soir même selon l’usage.<br><br>Vingt-deux mille tables dressées dans la ville. Chaque légionnaire touche cinq mille deniers — vingt ans de solde — et chaque centurion le double. Les hommes chantent derrière le char des vers si obscènes sur l’imperator qu’aucun n’oserait les dire à jeun.`,
  evenement:'triomphes' },

/* ---------------- 45 : Munda, et après ---------------- */
{ an:-45, sa:'ver', lieu:'Munda, Hispanie ultérieure', titre:'Munda', bataille:'munda' },
{ an:-45, sa:'aestas', lieu:'Retour d’Espagne', titre:'Le compte final', evenement:'fin',
  recit:`L’Espagne est soumise. Il n’y a plus d’armée pompéienne, plus de guerre, plus de province à conquérir. Pour la première fois depuis treize ans, le camp n’a pas de destination.<br><br>Les vétérans sont convoqués un par un devant les tables des questeurs, où l’on tient les registres du congé, des terres, des primes. On appelle ton nom.` }
];

function chroniqueAt(an, sa){ return CHRONIQUE.find(c => c.an===an && c.sa===sa) || null; }

BATAILLES.bibracte = {

  ennemi:'Helvètes, Boïens et Tulinges — 90 000 combattants', dc:52, issue:'victoire',
  intro:`Quatre légions en triple ligne à mi-pente ; les deux légions neuves et les auxiliaires au sommet, à garder les bagages. Les chevaux sont partis. Les Helvètes montent en phalange, boucliers imbriqués.`,
  phases:[
  { titre:'Le pilum',
    texte:`Ils arrivent à quarante pas. L’ordre court le long du rang : <span class="lat">pila</span> prêts. Le trait romain a une hampe de fer doux qui plie à l’impact — il ne se renvoie pas, et il condamne le bouclier qu’il traverse.`,
    vue:{ soldat:'Tu vois trois rangs de boucliers gaulois et la buée de leur souffle.', sousoff:'Ta centurie est en deuxième ligne du rang. Les hommes serrent trop.', centurion:'Ta cohorte tient le centre-droit. La pente joue pour nous.', superieur:'Toute la première ligne est engagée. La deuxième attend à cinquante pas.' },
    opts:[

      succes:{ txt:'La volée part à vingt-cinq pas. La phalange s’ouvre comme un fruit : les boucliers percés se collent deux à deux, les Helvètes les jettent et se battent à découvert.', eff:{disciplina:2,fama:2,unit:{cohaesio:4}}, perf:2 },

      echec:{ txt:'Les traits tombent court. On perd la volée pour rien et il faut recevoir la charge au gladius.', eff:{}, pertes:4, perf:0 } },
    { id:'c', scopes:['centurion','superieur'], txt:'Décaler la cohorte pour prendre la phalange en écharpe', note:'Manœuvrer sous une charge est ce qui distingue une légion d’une foule armée.',
      req:{scientia:40}, test:{attr:'scientia', unit:'experientia', dc:10}, risque:'élevé',
      crit:{ txt:'Tu fais glisser la cohorte de vingt pas sur la droite pendant qu’ils montent. La volée les prend de biais, sur le flanc non couvert. Un légat te montre du doigt à César.', eff:{scientia:3,auctoritas:3,fama:6,favor:{caesar:6}}, perf:7 },
      succes:{ txt:'Le décalage se fait, moins net que voulu, mais les traits portent de biais et la phalange s’ouvre.', eff:{scientia:2,fama:3}, perf:4 },
      echec:{ txt:'La manœuvre prend un temps de trop. La cohorte est encore en déplacement quand ils arrivent : on reçoit la charge en marchant.', eff:{auctoritas:-2,unit:{cohaesio:-8}}, pertes:12, blessure:.2, perf:-3 } }
    ]},
  { titre:'Le corps à corps',
    texte:`Les Helvètes reculent pas à pas vers une hauteur, à un mille. On les suit. C’est là que les Boïens et les Tulinges, quinze mille hommes restés en arrière, apparaissent sur notre flanc droit découvert.`,
    vue:{ soldat:'Tu entends une clameur sur la droite, tu ne vois rien.', sousoff:'Le flanc droit de la centurie n’est plus appuyé sur rien.', centurion:'Une masse d’hommes descend sur le flanc, sans ordre mais nombreuse.', superieur:'César fait faire demi-tour à la troisième ligne. Il n’y a pas de réserve derrière.' },
    opts:[

      test:{attr:'virtus', unit:'cohaesio', dc:5}, risque:'moyen',
      succes:{ txt:'Une vingtaine d’hommes pivotent avec toi. Le petit front improvisé tient assez longtemps pour que la troisième ligne arrive.', eff:{virtus:3,auctoritas:2,fama:4}, pertes:8, perf:3 },
      echec:{ txt:'Tu pivotes ; peu te suivent. On te bouscule, tu perds ton bouclier et l’on te ramasse dix pas en arrière.', eff:{virtus:1,valetudo:-14}, blessure:.35, pertes:10, perf:-1 } },
    { id:'b', scopes:['soldat','sousoff'], txt:'Rester dans le rang et pousser en avant',
      test:{attr:'disciplina', dc:-10}, risque:'faible',
      succes:{ txt:'Tu tiens ta place. Le front avant continue de gagner du terrain pendant que d’autres s’occupent du flanc.', eff:{disciplina:2}, pertes:5, perf:1 },
      echec:{ txt:'Le rang avance et le flanc s’effondre derrière : tu te retrouves à te battre des deux côtés à la fois.', eff:{valetudo:-10,unit:{cohaesio:-6}}, pertes:12, blessure:.2, perf:-1 } },
    { id:'c', scopes:['centurion','superieur'], txt:'Retourner la troisième ligne contre les Boïens', note:'Ce que César ordonne au même instant. Le faire avant l’ordre, c’est du mérite ou de l’insubordination selon l’issue.',
      test:{attr:'auctoritas', unit:'experientia', dc:5}, risque:'moyen',
      crit:{ txt:'Tes cohortes font demi-tour, marchent au flanc et l’arrêtent net. L’armée combat désormais sur deux fronts sans qu’un seul rang ait cédé — cas d’école dont on parlera longtemps.', eff:{auctoritas:4,scientia:3,fama:8,favor:{caesar:8,labienus:4}}, pertes:9, perf:7 },
      succes:{ txt:'La manœuvre se fait, un peu tard. Le flanc est bouché ; le prix en est correct.', eff:{auctoritas:2,fama:4}, pertes:12, perf:3 },
      echec:{ txt:'Le demi-tour se fait en désordre, deux centuries se prennent les enseignes. Les Boïens entrent dans l’intervalle avant qu’on les rejette.', eff:{auctoritas:-3,unit:{cohaesio:-10}}, pertes:20, blessure:.25, perf:-2 } },
    { id:'d', scopes:['centurion','superieur'], txt:'Refuser le flanc en échelon, sans faire demi-tour', req:{scientia:55},
      test:{attr:'scientia', unit:'cohaesio', dc:0}, risque:'moyen',
      succes:{ txt:'Tu fais reculer les centuries de droite en escalier, chacune couvrant la précédente. Le flanc devient une ligne, sans rupture ni panique.', eff:{scientia:4,auctoritas:3,fama:5}, pertes:7, perf:5 },
      echec:{ txt:'L’échelon se comprend mal. Deux centuries reculent, la troisième pas : le trou est exactement là où il ne fallait pas.', eff:{unit:{cohaesio:-9}}, pertes:16, blessure:.2, perf:-2 } }
    ]},
  { titre:'Les chariots',
    texte:`Le combat a duré de la septième heure jusqu’au soir sans qu’un seul Helvète ne montre le dos. La nuit tombée, ils se replient sur leur laager : des milliers de chariots rangés en muraille, où les femmes et les enfants tendent des javelots par-dessous.`,
    vue:{ soldat:'Tu ne sens plus tes bras. On te tend une outre d’eau tiède.', sousoff:'Les enseignes sont regroupées. Il manque un homme sur dix.', centurion:'La cohorte peut encore donner une heure, pas deux.', superieur:'On peut forcer les chariots cette nuit, ou attendre le jour et la reddition.' },
    opts:[
    { id:'a', scopes:['*'], txt:'Forcer le laager dans la nuit',

      echec:{ txt:'On se prend les pieds dans les timons, dans le noir, sous les traits lancés à bout portant par des gens qui n’ont plus rien à perdre. On décroche au matin.', eff:{valetudo:-12,unit:{cohaesio:-6}}, pertes:18, blessure:.35, perf:-2 } },
    { id:'b', scopes:['*'], txt:'Investir le laager et attendre le jour',
      test:{attr:'disciplina', dc:-20}, risque:'faible',
      succes:{ txt:'On dort en armes, à cent pas. Au matin, ce qui reste se rend : cent dix mille survivants sur trois cent soixante-huit mille partis. On les renvoie reconstruire leurs villages, pour qu’aucun Germain ne prenne la place vide.', eff:{disciplina:2,peculium:70}, pertes:2, perf:1 },
      echec:{ txt:'Six mille Verbigènes s’échappent vers le Rhin dans la nuit sous ton secteur. On les rattrapera, mais ton nom a été cité dans le rapport.', eff:{fama:-4,favor:{caesar:-4}}, pertes:2, perf:-1 } },

      test:{attr:'scientia', dc:-5}, risque:'faible',
      succes:{ txt:'Tes piquets cueillent les Verbigènes qui tentent de gagner le Rhin. César apprend qu’un officier avait prévu ce qu’il n’avait pas ordonné.', eff:{scientia:3,fama:6,favor:{caesar:7}}, perf:4 },
      echec:{ txt:'Les piquets sont trop clairsemés, la nuit trop noire. La bande passe entre deux postes.', eff:{fama:-2}, perf:-1 } }
    ]}
  ]};

BATAILLES.arioviste = {
  nom:'Arioviste', lieu:'Plaine d’Alsace, près du Rhin', date:'Septembre 58 av. J.-C.',
  ennemi:'Suèves, Harudes, Marcomans — 120 000 Germains', dc:56, issue:'victoire',
  intro:`Ils rangent leurs peuples chacun à part, et cernent l’arrière de leur ligne de chariots où les femmes crient de ne pas les laisser prendre. Les prêtresses ont tiré les sorts : les Germains ne doivent pas vaincre avant la nouvelle lune. César a décidé d’attaquer aujourd’hui.`,

  { titre:'L’aile droite en péril',
    texte:`Notre gauche a enfoncé la leur. Mais leur droite, plus dense, écrase la nôtre. Publius Crassus, qui commande la cavalerie et voit mieux le champ que ceux qui sont dedans, engage de sa propre initiative la troisième ligne.`,
    vue:{ soldat:'On te pousse dans le dos. Le rang derrière toi avance sans qu’on ait donné d’ordre.', sousoff:'La troisième ligne monte. Il faut leur ouvrir un passage sans rompre.', centurion:'Trois cohortes de réserve arrivent au pas de course sur ton secteur.', superieur:'Crassus a engagé la réserve sans ordre. C’est la bonne décision et une faute de discipline.' },

      echec:{ txt:'L’ouverture se fait mal, la réserve butte sur les rangs fatigués, et pendant un moment il y a deux lignes romaines emmêlées sous les coups.', eff:{unit:{cohaesio:-9}}, pertes:15, blessure:.2, perf:-2 } },

      succes:{ txt:'Tu écris que la réserve a été engagée « conformément à l’intention manifestée ». Crassus le sait. Sa maison est l’une des plus riches de Rome.', eff:{ingenium:3,favor:{crassus:20,caesar:2}}, perf:1 },
      echec:{ txt:'La formule est trop transparente. César relève le mot en souriant, et Crassus comprend qu’on l’a fait passer pour un enfant.', eff:{favor:{crassus:-6},fama:-2}, perf:0 } }

  { titre:'Jusqu’au Rhin',
    texte:`Ils cassent et fuient vers le fleuve, à cinq milles. Arioviste trouve une barque et passe. Ses deux femmes et une de ses filles meurent dans la fuite. La cavalerie fait le reste du travail.`,

      succes:{ txt:'Vous atteignez la rive. Ce qui se passe entre l’eau et le rang, on n’en parle pas au camp. Le butin, si.', eff:{virtus:2,peculium:260,fama:3}, pertes:4, perf:2 },
      echec:{ txt:'Les hommes s’éparpillent sur cinq milles. Trois de tes gens ne rentreront jamais : ni morts au champ, ni vivants.', eff:{unit:{cohaesio:-10},fama:-3}, pertes:8, perf:-2 } },
    { id:'b', scopes:['*'], txt:'Rassembler ton monde et rentrer en ordre',
