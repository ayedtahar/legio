/* ===== src/engine.js ===== */
/* ============================================================
   MOTEUR
   ============================================================ */

let S = null;               /* état de partie */
const CLE = 'cvrsvs_militiae_v1';

/* ---------- utilitaires ---------- */
const clamp = (v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const rnd   = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const chance= (p)=>Math.random()*100<p;
const pick  = (arr)=>arr[Math.floor(Math.random()*arr.length)];

function romain(n){
  if(n<=0) return '—';
  const t=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let r=''; for(const [v,s] of t){ while(n>=v){ r+=s; n-=v; } } return r;
}
function annEcrite(an){ return Math.abs(an)+' av. J.-C.'; }
function auc(an){ return romain(754+an)+' a.u.c.'; }

/* ---------- effets sur l'état ---------- */
/* rendements décroissants : une recrue progresse vite, un vétéran arrache
   chaque point. On ne peut pas exceller partout — il faut choisir un profil. */
function facteurProgres(v){
  if(v<40) return 1;
  if(v<55) return 0.72;
  if(v<68) return 0.48;
  if(v<78) return 0.30;
  if(v<86) return 0.17;
  return 0.08;
}
function attenuer(v,n){
  const brut=n*facteurProgres(v);
  const ent=Math.floor(brut);
  return ent + (Math.random() < (brut-ent) ? 1 : 0);
}
function bump(s,attr,n){
  if(n===0) return null;
  if(n>0) n=attenuer(s[attr],n);
  if(n===0) return null;
  const av=s[attr]; s[attr]=clamp(s[attr]+n);
  const d=s[attr]-av; if(d===0) return null;
  const A=ATTRS.find(a=>a.id===attr);
  return (A?A.nom:attr)+' '+(d>0?'+':'')+d;
}
function favor(s,pid,n){
  const p=P[pid]; if(!p) return null;
  if(!(pid in s.patrons)) return null;
  if(n>0) n=attenuer(Math.max(0,s.patrons[pid]), n);
  if(n===0) return null;
  s.patrons[pid]=clamp(s.patrons[pid]+n,-100,100);
  return p.nom+' '+(n>0?'+':'')+n;
}
function hasPatron(s,pid,seuil){ return (s.patrons[pid]||0)>=seuil; }
function vivant(s,pid){ return pid in s.patrons; }
function superieurDirect(s){
  const dispo=Object.keys(s.patrons).filter(k=>k!=='caesar');
  return dispo.length? pick(dispo) : 'caesar';
}

const VULNERA=[
  {n:'Balafre au visage',            e:{ingenium:-2},   d:'La joue ouverte du sourcil à la mâchoire.'},
  {n:'Épaule droite raide',          e:{virtus:-3},     d:'Le bras ne monte plus au-dessus de l’horizontale.'},
  {n:'Jambe percée',                 e:{disciplina:-3}, d:'Elle porte, mais elle ne court plus vingt milles.'},
  {n:'Trois côtes ressoudées de travers',e:{disciplina:-2,virtus:-1},d:'Le souffle manque au bout d’une heure de combat.'},
  {n:'Main gauche à trois doigts',   e:{virtus:-2,disciplina:-1}, d:'Le bouclier tient par la courroie et l’habitude.'},
  {n:'Œil gauche perdu',             e:{scientia:-3,virtus:-1}, d:'On perd la profondeur, et on ne s’y fait jamais.'},
  {n:'Trait de fronde dans le crâne',e:{ingenium:-3,scientia:-2}, d:'Des maux de tête qui durent trois jours.'},
  {n:'Tendon du poignet sectionné',  e:{virtus:-3,disciplina:-1}, d:'Le glaive se tient autrement, moins bien.'}
];
function addVulnus(s){
  const dispo=VULNERA.filter(v=>!s.vulnera.some(x=>x.n===v.n));
  if(!dispo.length){ s.valetudo=clamp(s.valetudo-12); return 'Ancienne blessure rouverte'; }
  const v=pick(dispo); s.vulnera.push(v);
  for(const k in v.e) s[k]=clamp(s[k]+v.e[k]);
  return 'Blessure : '+v.n;
}

/* ---------- application d'un bloc d'effets ---------- */
function appliquer(eff, extra){
  const out=[];
  if(!eff) return out;
  for(const k in eff){
    const v=eff[k];
    if(k==='unit'){
      for(const uk in v){
        S.unit[uk]=clamp(S.unit[uk]+v[uk]);
        out.push({t:v[uk]>0?'up':'dn', s:'Unité · '+UNIT_LABEL[uk]+' '+(v[uk]>0?'+':'')+v[uk]});
      }
    } else if(k==='favor'){
      for(const pid in v){ const r=favor(S,pid,v[pid]); if(r) out.push({t:v[pid]>0?'up':'dn', s:r}); }
    } else if(k==='peculium'){
      let n = typeof v==='string' ? Math.round(evalStip(v)) : v;
      S.peculium=Math.max(0,S.peculium+n);
      out.push({t:n>0?'up':'dn', s:(n>0?'+':'')+n+' deniers'});
    } else if(k==='fama'){
      const n = v>0 ? attenuer(S.fama, v) : v;
      if(n===0) continue;
      S.fama=clamp(S.fama+n); out.push({t:n>0?'up':'dn', s:'Fama '+(n>0?'+':'')+n});
    } else if(k==='valetudo'||k==='valetudoEff'){
      S.valetudo=clamp(S.valetudo+v); out.push({t:v>0?'up':'dn', s:'Santé '+(v>0?'+':'')+v});
    } else if(ATTRS.some(a=>a.id===k)){
      const r=bump(S,k,v); if(r) out.push({t:v>0?'up':'dn', s:r});
    }
  }
  if(extra){
    if(extra.pertes) out.push(...pertesUnite(extra.pertes));
    if(extra.blessure && chance(extra.blessure*100)) out.push({t:'dn', s:addVulnus(S)});
    if(extra.candidature) { S.candidature+=extra.candidature; out.push({t:'up', s:'Candidature appuyée'}); }
    if(extra.karma) S.karma+=extra.karma;
    if(extra.soigne){ S.vulnera=S.vulnera.filter(()=>!chance(30)); }
    if(extra.favorRand){
      const ids=Object.keys(S.patrons).filter(k=>k!=='caesar');
      if(ids.length){ const r=favor(S,pick(ids),extra.favorRand); if(r) out.push({t:extra.favorRand>0?'up':'dn', s:r}); }
    }
  }
  return out;
}
const UNIT_LABEL={cohaesio:'cohésion',fatigatio:'fatigue',experientia:'expérience',fides:'fidélité',effectif:'effectif'};
function evalStip(str){
  const stip=S.grade.stip||225;
  const m=str.match(/^(-?)stip\*([\d.]+)$/);
  if(!m) return 0;
  return (m[1]==='-'?-1:1)*stip*parseFloat(m[2]);
}
function pertesUnite(pct){
  const out=[];
  const perdu=Math.max(1,Math.round(S.unit.effectif*pct/100));
  S.unit.effectif=Math.max(1,S.unit.effectif-perdu);
  S.unit.cohaesio=clamp(S.unit.cohaesio-Math.round(pct/3));
  out.push({t:'dn', s:'Pertes : '+perdu+' hommes ('+pct+'%)'});
  /* les camarades meurent avec l'unité */
  const vivants=S.commilitones.filter(c=>c.vivant);
  vivants.forEach(c=>{
    if(chance(pct*0.55)){
      c.vivant=false; c.mort={an:S.annee, lieu:S.lieu||'—'};
      out.push({t:'dn', s:'† '+c.nom+' — '+c.role});
      S.unit.fides=clamp(S.unit.fides-4);
    }
  });
  return out;
}

/* ---------- test de résolution ---------- */
function resoudre(test, dcBase){
  if(!test) return {niv:'succes', score:0, dc:0};
  const attr = test.brut ? (S[test.attr]||0) : (S[test.attr]||0);
  let uf;
  if(test.unit){ uf = S.unit[test.unit]||0; if(test.inv) uf = 100-uf; }
  else uf = Math.round((S.unit.cohaesio + S.unit.experientia)/2);
  const malus = (100-S.valetudo)*0.15 + S.unit.fatigatio*0.06;
  const jet = rnd(0,100);
  const score = 18 + 0.55*attr + 0.22*uf + 0.30*jet - malus;
  const dc = (dcBase||50) + (test.dc||0);
  let niv;
  if(score >= dc+22) niv='crit';
  else if(score >= dc) niv='succes';
  else niv='echec';
  return {niv, score:Math.round(score), dc:Math.round(dc), jet};
}

/* ---------- options visibles selon le grade ---------- */
function optsVisibles(opts){
  const sc=S.grade.scope;
  return opts.filter(o=>{
    if(!o.scopes) return true;
    if(o.scopes.includes('*')) return true;
    return o.scopes.includes(sc);
  }).map(o=>{
    let bloque=null;
    if(o.req){
      for(const k in o.req) if((S[k]||0) < o.req[k]){
        const A=ATTRS.find(a=>a.id===k);
        bloque=(A?A.nom:k)+' '+o.req[k]+' requis';
      }
    }
    return {...o, bloque};
  });
}

function nouveauPersonnage(nom, origineId){
  const O=ORIGINES.find(o=>o.id===origineId)||ORIGINES[0];
  const s={
    nom, origine:O.id, originNom:O.nom,
    annee:-58, saison:'ver', turn:0,
    gradeId:'miles', grade:G.miles,
    virtus:26, disciplina:26, scientia:22, auctoritas:22, ingenium:24,
    fama:5, peculium:O.peculium, valetudo:100, aetas:rnd(18,23), stipendia:0,
    vulnera:[], legion:'Legio X Equestris', faction:'caesar', eques:O.id==='eques',
    patrons:{}, vacances:0, candidature:0, karma:0,
    batailles:0, decorations:[], commilitones:[], toursDansGrade:0,
    unit:{ type:'contubernium', nominal:8, effectif:8, cohaesio:45, fatigatio:10, experientia:15, fides:40 },
    log:[], mort:null, fin:null, tempus:2, faites:[], queue:[], etape:null, bat:null,
    lieu:'Genava, sur le Rhône', modeDur:true
  };
  for(const k in O.bonus) s[k]=clamp(s[k]+O.bonus[k]);
  /* patrons de départ */
  s.patrons.caesar = 4;
  s.patrons.balventius = 20;
  s.patrons.labienus = 3;
  if(O.id==='municipal'){ s.patrons.cicero = 22; }
  if(O.id==='eques'){ s.patrons.labienus = 18; s.patrons.crassus = 14; }
  if(O.id==='veteran'){ s.patrons.balventius = 34; }
  /* camarades */
  const usedN=new Set();
  COMMILITONES_ROLES.forEach(r=>{
    let n; do{ n=pick(PRAENOMINA)+' '+pick(COGNOMINA); }while(usedN.has(n)); usedN.add(n);
    s.commilitones.push({ nom:n, role:r.role, trait:pick(r.traits), vivant:true, grade:'Miles' });
  });
  return s;
}

/* ---------- patrons : arrivées, départs, morts ---------- */
function majPatrons(){
  PATRONS.forEach(p=>{
    if(p.arrivee && S.annee>=p.arrivee.annee && !(p.id in S.patrons)){
      S.patrons[p.id]=p.fav||0;
      journal(p.nom+' rejoint l’état-major.','y');
    }
    if(p.mort && S.annee>=p.mort.annee && (p.id in S.patrons)){
      delete S.patrons[p.id];
      journal('† '+p.nom+' — '+(p.id==='crassus'?'tué à Carrhes':'tombé au service'),'r');
    }
    if(p.depart && S.annee>=p.depart.annee && (p.id in S.patrons)){
      delete S.patrons[p.id];
      journal(p.nom+' quitte l’armée des Gaules.','');
    }
  });
  /* bascule de 49 */
  if(S.annee>=-49 && S.faction==='caesar' && (S.patrons.labienus!==undefined)){
    const f=S.patrons.labienus;
    delete S.patrons.labienus;
    journal('T. Labienus passe à Pompée. Neuf ans de service auprès de César, et il part.','r');
    if(f>45){ S.fama=clamp(S.fama-6); journal('Ton nom était lié au sien. On te regarde.','r'); }
  }
}

/* ---------- promotions ---------- */
const CURSUS={
  tiro:['miles'], miles:['immunis'], immunis:['tesserarius'],
  tesserarius:['optio','signifer'], signifer:['optio','aquilifer'], aquilifer:['centurio'],
  optio:['centurio'], centurio:['pilus_prior'], pilus_prior:['primi_ordinis'],
  primi_ordinis:['primipilus'], primipilus:['praef_fabrum','tribunus'],
  praef_fabrum:['tribunus'], tribunus:['legatus'], legatus:[], praef_equit:['tribunus']
};
/* attrs : liste de jeux d'exigences ALTERNATIFS — il suffit d'en satisfaire un.
   Chaque grade a la ou les portes que l'histoire lui connaît :
   l'immunis est un spécialiste, le signifer tient la caisse d'épargne de la
   centurie autant que l'enseigne, le préfet des ouvriers est un ingénieur. */
const SEUILS={
  immunis:      {fama:8,  favor:6,  attrs:[{disciplina:32},{scientia:34},{ingenium:36}]},
  tesserarius:  {fama:16, favor:13, attrs:[{disciplina:40,auctoritas:30},{scientia:44,disciplina:34}]},
  optio:        {fama:26, favor:22, attrs:[{auctoritas:42,disciplina:42},{auctoritas:38,ingenium:46}]},
  signifer:     {fama:26, favor:22, attrs:[{virtus:44,disciplina:40},{virtus:40,ingenium:44}]},
  aquilifer:    {fama:40, favor:38, attrs:[{virtus:54,disciplina:50}]},
  centurio:     {fama:38, favor:34, attrs:[{virtus:48,auctoritas:48},{auctoritas:52,scientia:46},{virtus:52,ingenium:48}]},
  pilus_prior:  {fama:48, favor:42, attrs:[{auctoritas:56,virtus:50},{auctoritas:52,scientia:54}]},
  primi_ordinis:{fama:62, favor:58, favorDe:'caesar', attrs:[{auctoritas:66,virtus:58},{auctoritas:61,scientia:63},{auctoritas:61,ingenium:63}]},
  primipilus:   {fama:78, favor:76, favorDe:'caesar', attrs:[{auctoritas:79,virtus:69,disciplina:67},{auctoritas:75,virtus:65,scientia:71}]},
  praef_fabrum: {fama:70, favor:70, favorDe:'caesar', attrs:[{scientia:79,ingenium:63},{scientia:75,disciplina:71}]},
  tribunus:     {fama:76, favor:74, favorDe:'caesar', eques:true, attrs:[{ingenium:69,scientia:69,auctoritas:73},{ingenium:77,auctoritas:75}]},
  legatus:      {fama:88, favor:88, favorDe:'caesar', eques:true, attrs:[{auctoritas:80,scientia:76,ingenium:72}]}
};
/* Le cursus romain se parcourait lentement : on servait des années dans un
   grade avant d'être proposé au suivant. Sans cela, une bonne saison suffirait
   à traverser toute l'échelle. */
const TEMPS_MIN={ miles:1, immunis:2, tesserarius:3, optio:3, signifer:3, aquilifer:4,
  centurio:4, pilus_prior:5, primi_ordinis:6, primipilus:6, praef_fabrum:5, tribunus:6, legatus:8 };

function meilleurPatron(){
  let best=null, v=-999;
  for(const pid in S.patrons){ if(S.patrons[pid]>v){ v=S.patrons[pid]; best=pid; } }
  return {pid:best, fav:v};
}
function candidatsPromotion(){
  const suite=CURSUS[S.gradeId]||[];
  const mp=meilleurPatron();
  return suite.filter(gid=>{
    const req=SEUILS[gid]; if(!req) return false;
    if((S.toursDansGrade||0) < (TEMPS_MIN[gid]||3)) return false;
    if(req.eques && !S.eques) return false;
    if(S.fama < req.fama - S.candidature*3) return false;
    const ok = req.attrs.some(jeu => Object.keys(jeu).every(k => (S[k]||0) >= jeu[k]));
    if(!ok) return false;
    const fav = req.favorDe ? (S.patrons[req.favorDe]!==undefined ? S.patrons[req.favorDe] : -100) : mp.fav;
    if(fav < req.favor - S.candidature*4) return false;
    return true;
  });
}
function promouvoir(gid){
  const g=G[gid];
  S.gradeId=gid; S.grade=g; S.vacances=Math.max(0,S.vacances-1); S.candidature=0; S.toursDansGrade=0;
  if(gid==='primipilus'){ S.eques=true; journal('Le primipilat te vaut l’inscription à l’ordre équestre.','y'); }
  const u=UNITES[g.unite];
  if(u && S.unit.type!==g.unite){
    S.unit={ type:g.unite, nominal:u.nominal, effectif:Math.round(u.nominal*0.9),
      cohaesio:clamp(S.unit.cohaesio-6), fatigatio:S.unit.fatigatio,
      experientia:clamp(S.unit.experientia-4), fides:clamp(S.unit.fides-10) };
  }
  journal('PROMOTION — '+g.nom,'y');
}

/* ---------- journal ---------- */
function journal(txt,cls){
  S.log.unshift({t:txt, c:cls||'', d:SAISONS.find(x=>x.id===S.saison).nom+' '+Math.abs(S.annee)});
  if(S.log.length>130) S.log.pop();
}

/* ---------- construction du tour ---------- */
function construireTour(){
  const ch=chroniqueAt(S.annee,S.saison);
  S.lieu = ch? ch.lieu : S.lieu;
  S.chron = ch;
  S.queue=[];
  if(ch && ch.recit) S.queue.push({t:'recit'});
  S.queue.push({t:'ordres'});
  if(ch && ch.evenement) S.queue.push({t:'ev', id:ch.evenement});
  else if(chance(72)) S.queue.push({t:'alea'});
  if(ch && ch.bataille){
    let bid=ch.bataille;
    if(S.faction==='pompee' && bid==='pharsale') bid='pharsale_pomp';
    if(BATAILLES[bid]) S.queue.push({t:'bat', id:bid});
  }
  S.queue.push({t:'bilan'});
  S.tempus=2; S.faites=[];
  suivant();
}
function suivant(){
  if(!S.queue.length){ avancerSaison(); return; }
  S.etape=S.queue.shift();
  if(S.etape.t==='alea'){
    const dispo=ALEA.filter(e=>!e.cond || e.cond(S));
    if(!dispo.length){ suivant(); return; }
    const total=dispo.reduce((a,e)=>a+(e.poids||5),0);
    let r=Math.random()*total, choisi=dispo[0];
    for(const e of dispo){ r-=(e.poids||5); if(r<=0){ choisi=e; break; } }
    S.etape={t:'ev', ev:choisi};
  }
  if(S.etape.t==='ev' && S.etape.id==='fin'){ finPartie('carriere'); return; }
  if(S.etape.t==='ev' && S.etape.id) S.etape.ev=EVENEMENTS[S.etape.id];
  if(S.etape.t==='bat'){ S.bat={ id:S.etape.id, ph:0, perf:0, hist:[] }; S.batailles++; }
  if(S.etape.t==='bilan'){ bilan(); return; }
  render();
}

/* ---------- fin de tour ---------- */
function bilan(){
  const out=[];
  /* solde */
  const paie=Math.round((S.grade.stip||225)/3);
  S.peculium+=paie;
  /* récupération */
  if(S.saison==='hiberna'){ S.valetudo=clamp(S.valetudo+rnd(6,14)); S.unit.fatigatio=clamp(S.unit.fatigatio-rnd(14,24)); }
  else { S.valetudo=clamp(S.valetudo+rnd(1,5)); S.unit.fatigatio=clamp(S.unit.fatigatio-rnd(3,8)); }
  /* recomplètement */
  if(S.unit.effectif < S.unit.nominal){
    const r=Math.min(S.unit.nominal-S.unit.effectif, Math.ceil(S.unit.nominal*(S.saison==='hiberna'?0.14:0.05)));
    if(r>0){
      S.unit.effectif+=r;
      S.unit.experientia=clamp(S.unit.experientia-Math.round(r/S.unit.nominal*22));
      out.push(r+' recrue'+(r>1?'s':'')+' incorporée'+(r>1?'s':''));
    }
  }
  /* fatigue chronique */
  if(S.unit.fatigatio>80){ S.unit.fides=clamp(S.unit.fides-4); out.push('Épuisement : la fidélité s’effrite.'); }
  if(S.valetudo<25) out.push('Ta santé est mauvaise. Une saison de plus et tu ne tiendras pas.');
  /* patrons */
  majPatrons();
  /* la réputation suit l’ancienneté, la conduite et l’opinion de l’unité */
  const cible = Math.min(58, Math.round(14 + S.stipendia*1.7 + (S.unit.fides-50)*0.22 + S.decorations.length*5 + S.grade.ordre*1.6));
  if(S.fama < cible){ S.fama=clamp(S.fama+rnd(1,3)); }
  else if(S.fama > cible+22){ S.fama=clamp(S.fama-1); }
  /* vacances d’officiers */
  if(chance(26)) S.vacances++;
  /* promotion */
  const cands=candidatsPromotion();
  if(S.vacances>0 && cands.length){
    S.etape={t:'promo', cands};
    S.bilanNotes=out; render(); return;
  }
  S.bilanNotes=out;
  S.etape={t:'bilanAff'};
  render();
}
function avancerSaison(){
  S.turn++; S.toursDansGrade=(S.toursDansGrade||0)+1;
  const ordre=['ver','aestas','hiberna'];
  let i=ordre.indexOf(S.saison);
  if(i===2){ S.saison='ver'; S.annee++; S.aetas++; S.stipendia++; }
  else S.saison=ordre[i+1];
  if(S.valetudo<=0){ mourir('Ta santé a cédé avant l’ennemi.'); return; }
  const ch=chroniqueAt(S.annee,S.saison);
  if(!ch){ finPartie('survie'); return; }
  sauver();
  construireTour();
}

/* ---------- mort et fin ---------- */
function mourir(cause){
  S.mort={ cause, an:S.annee, sa:S.saison, lieu:S.lieu };
  journal('† '+cause,'r');
  sauver(); render();
}
function finPartie(type){
  S.fin={ type };
  sauver(); render();
}

/* ---------- sauvegarde ---------- */
function sauver(){ try{ localStorage.setItem(CLE, JSON.stringify(S)); }catch(e){} }
function charger(){
  try{
    const raw=localStorage.getItem(CLE); if(!raw) return null;
    const s=JSON.parse(raw); s.grade=G[s.gradeId]; return s;
  }catch(e){ return null; }
}
function effacer(){ try{ localStorage.removeItem(CLE); }catch(e){} }

/* ---------- règle à encoches ---------- */
function tally(v, seuil){
  const n=20, plein=Math.round(v/100*n);
  let h='<div class="tally">';
  for(let i=0;i<n;i++){
    let c='tick';
    if(i<plein) c+= (v>=80?' hi':'');
    if(i<plein && !(v>=80)) c+=' on';
    if(seuil && v<seuil && i<plein) c='tick warn';
    h+='<div class="'+c+'"></div>';
  }
  return h+'</div>';
}

/* ---------- inscription lapidaire ---------- */
function lapidaire(txt){
  return txt.toUpperCase().replace(/U/g,'V').replace(/ /g,'&nbsp;·&nbsp;');
}

      </div>`;
    }).join('')}
    ${S.vacances>0?`<hr class="rule" style="margin:12px 0;"><div class="kv"><span>Places vacantes</span><b class="gold">${S.vacances}</b></div>`:''}
    ${exigenceProchainGrade()}
  </div></div>`;
}
function exigenceProchainGrade(){
  const suite=CURSUS[S.gradeId]||[]; if(!suite.length) return '';
  const lignes=suite.map(gid=>{
    const r=SEUILS[gid]; if(!r) return '';
    const manque=[];
    if((S.toursDansGrade||0) < (TEMPS_MIN[gid]||3)) manque.push('ancienneté');
    if(S.fama < r.fama - S.candidature*3) manque.push('fama '+S.fama+'/'+r.fama);
    const ok=r.attrs.some(j=>Object.keys(j).every(k=>(S[k]||0)>=j[k]));
    if(!ok){
      const best=r.attrs.map(j=>Object.entries(j).filter(([k,v])=>(S[k]||0)<v))
        .sort((a,b)=>a.length-b.length)[0];
      best.forEach(([k,v])=>{const A=ATTRS.find(a=>a.id===k); manque.push((A?A.nom:k)+' '+S[k]+'/'+v);});
    }
    const fav = r.favorDe ? (S.patrons[r.favorDe]!==undefined?S.patrons[r.favorDe]:-100) : meilleurPatron().fav;
    if(fav < r.favor - S.candidature*4) manque.push((r.favorDe?'faveur de César ':'faveur ')+fav+'/'+r.favor);
    if(r.eques && !S.eques) manque.push('ordre équestre');
    if(S.vacances<=0) manque.push('aucune place vacante');
    return `<div class="kv" style="align-items:flex-start;"><span style="max-width:60%;">${esc(G[gid].nom)}</span>
      <b style="text-align:right;font-size:10.5px;line-height:1.5;${manque.length?'color:var(--brass-faint)':'color:var(--aerugo)'}">${manque.length?esc(manque.join(' · ')):'conditions réunies'}</b></div>`;
  }).join('');
  return `<hr class="rule" style="margin:12px 0;"><div class="attr-n" style="margin-bottom:6px;">Pour monter</div>${lignes}`;
}

function panLog(){
  return `<div class="pan"><div class="pan-h">Acta <em>Journal de campagne</em></div><div class="pan-b">
    <div class="log">${S.log.slice(0,40).map(l=>`<div class="${l.c}"><span class="y">${esc(l.d)}</span> — ${l.t}</div>`).join('')||'<div>—</div>'}</div>

/* ---------- blocs réutilisables ---------- */
function blocOptions(opts, handler){
  const lettres=['A','B','C','D','E'];
  return `<div class="opts">${opts.map((o,i)=>{
    const meta=[];
    if(o.risque) meta.push('<span class="risk">Risque '+o.risque+'</span>');
    if(o.test){ const A=ATTRS.find(a=>a.id===o.test.attr); if(A) meta.push('<span>'+A.nom+' '+S[o.test.attr]+'</span>'); }
    if(o.test&&o.test.unit) meta.push('<span>Unité · '+UNIT_LABEL[o.test.unit]+'</span>');
    if(o.decide) meta.push('<span class="lock">Décision irréversible</span>');
    if(o.bloque) meta.push('<span class="lock">'+esc(o.bloque)+'</span>');
    return `<button class="opt" ${o.bloque?'disabled':''} onclick="${handler}(${i})">
      <span class="opt-k">${lettres[i]}</span>${esc(o.txt)}
      ${o.note?'<div class="opt-note">'+esc(o.note)+'</div>':''}
      <div class="opt-meta">${meta.join('')}</div>
    </button>`;
  }).join('')}</div>`;
}
function blocEffets(effs, titre){
  if(!effs||!effs.length) return '';
  return `<div class="effs">${effs.map(e=>`<span class="eff-${e.t}">${e.t==='up'?'▲':(e.t==='dn'?'▼':'·')} ${esc(e.s)}</span>`).join('')}</div>`;
}
function blocResultat(res){
  const cls=res.niv==='echec'?'ill':(res.niv==='crit'?'bene':'');
  const t=res.niv==='crit'?'Réussite éclatante':(res.niv==='succes'?'Réussite':'Échec');
  return `<div class="outcome ${cls}">
    <div class="outcome-t">${t}</div>
    <div class="prose" style="font-size:16.5px;">${res.txt}</div>
    ${blocEffets(res.effs)}
  </div>`;
}

/* ============================================================
   ACTIONS DU JOUEUR
   ============================================================ */
function lancerAction(id){
  const a=ACTIONS.find(x=>x.id===id); if(!a||S.tempus<=0) return;
  if(a.cible==='patron'){ choisirPatron(a); return; }
  const notes=a.apply(S,null)||[];
  S.tempus--; S.faites.push(id);
  S.derniersEffets=notes.filter(Boolean).map(n=>({t:/-|−/.test(n)&&!/\+/.test(n)?'dn':'up', s:n}));
  journal(a.nom,'');
  sauver(); render();
}
function choisirPatron(a){
  const ids=Object.keys(S.patrons);
  $('app').insertAdjacentHTML('beforeend',`
  <div class="wrap" id="modal" style="position:fixed;inset:0;background:rgba(8,7,5,.93);z-index:50;overflow:auto;padding-top:60px;">
    <div class="pan setup"><div class="pan-h">Auprès de qui ?</div><div class="pan-b">
      <p class="prose">Un présent, un service, une soirée bien employée. La faveur d’un homme puissant est la seule échelle qui existe.</p>
      <div class="opts">
      ${ids.map(id=>{const p=P[id];return `<button class="opt" onclick="ambitioVers('${id}')">
        <span class="opt-k">✦</span>${esc(p.nom)}
        <div class="opt-note">${esc(p.titre)} — ${esc(p.trait)}</div>
        <div class="opt-meta"><span>Faveur actuelle ${S.patrons[id]>0?'+':''}${S.patrons[id]}</span></div></button>`;}).join('')}
      </div>
      <div class="btnrow"><button class="btn" onclick="fermerModal()">Renoncer</button></div>
    </div></div>
  </div>`);
}
function fermerModal(){ const m=$('modal'); if(m) m.remove(); }
function ambitioVers(pid){
  fermerModal();
  const a=ACTIONS.find(x=>x.id==='ambitio');
  const notes=a.apply(S,pid)||[];
  S.tempus--; S.faites.push('ambitio');
  S.derniersEffets=notes.filter(Boolean).map(n=>({t:/^-/.test(n)?'dn':'up', s:n}));
  journal('Ambitio — '+P[pid].nom,'');
  sauver(); render();
}
function finOrdres(){ S.derniersEffets=null; suivant(); render(); }

/* ---------- événements ---------- */
function evChoix(i){
  const ev=S.etape.ev, opts=optsVisibles(ev.opts), o=opts[i];
  if(!o||o.bloque) return;
  const r=resoudre(o.test, 50);
  let branche = (r.niv==='crit'&&o.crit)?o.crit:(r.niv==='echec'?o.echec:o.succes);
  if(r.niv==='crit'&&!o.crit) branche=o.succes;
  const effs=appliquer(branche.eff, branche);
  if(o.decide) appliquerDecision(o.decide);
  S.etape.res={ niv:r.niv, txt:branche.txt, effs };
  journal(ev.titre+' — '+(r.niv==='echec'?'échec':'réussite'), r.niv==='echec'?'r':'g');
  if(S.valetudo<=0){ mourir('Mort des suites de tes blessures, à '+S.lieu+'.'); return; }
  sauver(); render();
}

/* ---------- décisions structurantes ---------- */
function appliquerDecision(d){
  if(d==='caesar'){ S.faction='caesar'; journal('Tu as passé le Rubicon derrière lui.','y'); }
  if(d==='pompee'){
    S.faction='pompee'; S.legion='Legio I (Pompeiana)';
    delete S.patrons.caesar;
    journal('Tu as quitté César pour le Sénat.','r');
  }
  if(d==='venia'){
    S.faction='caesar'; S.legion='Legio X Equestris';
    S.patrons.caesar=-10;
    const chaine=Object.keys(CURSUS).find(k=>CURSUS[k].includes(S.gradeId));
    if(chaine){ S.gradeId=chaine; S.grade=G[chaine]; }
    journal('Rendu et pardonné. Grade réduit d’un cran.','r');
  }
  if(d==='afrique'){ S.faction='pompee'; S.legion='Legio (Pompeiana), Africa'; }
  if(d==='missio'){ finPartie('missio'); }
  if(d==='missio_riche'){ finPartie('missio_riche'); }
}

/* ---------- bataille ---------- */
function batChoix(i){
  const B=BATAILLES[S.bat.id], ph=B.phases[S.bat.ph];
  const opts=optsVisibles(ph.opts), o=opts[i];
  if(!o||o.bloque) return;
  const r=resoudre(o.test, B.dc);
  let branche = (r.niv==='crit'&&o.crit)?o.crit:(r.niv==='echec'?o.echec:o.succes);
  if(r.niv==='crit'&&!o.crit) branche=o.succes;
  const effs=appliquer(branche.eff, branche);
  if(branche.perf) S.bat.perf+=branche.perf;
  S.unit.fatigatio=clamp(S.unit.fatigatio+rnd(5,11));
  if(o.decide) appliquerDecision(o.decide);
  /* mort au combat */
  if(branche.mort && chance(branche.mort*100)){
    S.bat.res={ niv:r.niv, txt:branche.txt, effs };
    mourir('Tué à '+B.nom+' — '+B.date); return;
  }
  if(S.valetudo<=0){ S.bat.res={niv:r.niv,txt:branche.txt,effs}; mourir('Mort de tes blessures à '+B.nom+' — '+B.date); return; }
  S.bat.res={ niv:r.niv, txt:branche.txt, effs };
  S.bat.hist.push({ph:ph.titre, niv:r.niv});
  sauver(); render();
}
function phaseSuivante(){
  const B=BATAILLES[S.bat.id];
  S.bat.res=null; S.bat.ph++;
  if(S.bat.ph>=B.phases.length) finirBataille(B);
  render();
}
function finirBataille(B){
  S.bat.fini=true;
  const p=S.bat.perf, eff=[];
  /* tenir son rang est attendu ; c'est l'acte remarquable qui fait la réputation */
  const courbe=(x)=> x<=0 ? x*1.25 : (x<=9 ? x*0.18 : 9*0.18 + (x-9)*1.55);
  const famaG=Math.round(courbe(p));
  const famaN = famaG>0 ? attenuer(S.fama, famaG) : famaG;
  if(famaN){ S.fama=clamp(S.fama+famaN); eff.push({t:famaN>0?'up':'dn', s:'Fama '+(famaN>0?'+':'')+famaN}); }
  const favG=Math.round(courbe(p)*0.85);
  if(favG && 'caesar' in S.patrons){ favor(S,'caesar',favG); eff.push({t:favG>0?'up':'dn', s:'C. Iulius Caesar '+(favG>0?'+':'')+favG}); }
  /* les batailles créent des vacances d'officiers */
  const v=Math.max(0, Math.round((B.dc-50)/7) + rnd(0,1));
  if(v){ S.vacances+=v; eff.push({t:'nt', s:v+' poste'+(v>1?'s':'')+' d’officier vacant'+(v>1?'s':'')}); }
  /* décorations */
  if(p>=14 && !S.decorations.includes('Corona civica')){
    S.decorations.push('Corona civica'); eff.push({t:'up', s:'Corona civica — pour avoir sauvé un citoyen'});
  } else if(p>=10 && S.decorations.length<5){
    const d=pick(['Torques','Phalerae','Armillae','Hasta pura','Corona aurea']).toString();
    if(!S.decorations.includes(d)){ S.decorations.push(d); eff.push({t:'up', s:'Dona militaria : '+d}); }
  }
  /* butin de victoire */
  if(B.issue.indexOf('défaite')<0){ const b=rnd(60,180)+S.grade.ordre*40; S.peculium+=b; eff.push({t:'up', s:'+'+b+' deniers de butin'}); }
  S.bat.bilanEff=eff;
  journal('Bataille de '+B.nom+' — '+(p>=5?'conduite remarquée':(p>=0?'tenu ton rang':'conduite critiquée')), p>=5?'g':(p<0?'r':''));
  sauver();
}

/* ---------- promotions ---------- */
function accepterPromo(gid){ promouvoir(gid); S.etape={t:'bilanAff'}; sauver(); render(); }
function refuserPromo(){ S.vacances=Math.max(0,S.vacances-1); S.fama=clamp(S.fama-4); journal('Promotion refusée.','r'); S.etape={t:'bilanAff'}; sauver(); render(); }

/* ---------- abandon / aide ---------- */
function abandonner(){
  if(confirm('Abandonner cette carrière et effacer la sauvegarde ?')){ effacer(); S=null; ecranSetup(); }
}
function ecranAide(){
  $('app').insertAdjacentHTML('beforeend',`

   <div class="setup">
    <div class="pan"><div class="pan-h">Comment se joue une carrière</div><div class="pan-b">
      <p class="prose"><strong>Le temps.</strong> Trois saisons par an, de 58 à 45 av. J.-C. — quarante-deux tours. Chaque saison : deux emplois du temps, un événement, parfois une bataille.</p>
      <p class="prose"><strong>Le grade change le jeu.</strong> Ce n’est pas un titre : c’est ton champ de vision et l’éventail de tes ordres. Un <span class="lat">miles</span> voit vingt pas et décide de son propre corps. Un centurion manœuvre. Un primipile lit toute la ligne et dispose des réserves. Les options en bataille sont filtrées par ton grade — certaines ne t’apparaîtront jamais si tu ne montes pas.</p>
      <p class="prose"><strong>Les cinq attributs.</strong> ${ATTRS.map(a=>'<em>'+a.nom+'</em> — '+a.desc).join('<br>')}</p>
      <p class="prose"><strong>Monter en grade</strong> exige trois choses réunies : une place vacante (elles s’ouvrent surtout après les batailles meurtrières), des attributs et une <em>fama</em> au niveau, et un patron qui parle pour toi. Sans patron, tu resteras <span class="lat">miles</span> seize ans, ce qui était le sort de la majorité.</p>
      <p class="prose"><strong>Les patrons</strong> ont leur propre histoire : Crassus meurt en Parthie en 53, Balventius tombe en 54, Antoine arrive en 52. Et en janvier 49, Labienus passe à Pompée — si toute ta faveur reposait sur lui, tu le sentiras passer.</p>
      <p class="prose"><strong>L’unité.</strong> Cohésion, expérience, fidélité et fatigue décident autant que tes attributs. Une cohorte épuisée échoue à ce qu’une cohorte fraîche réussit. Les pertes sont définitives et tes camarades nommés peuvent mourir.</p>
      <p class="prose"><strong>La mort est réelle</strong>, en bataille comme des suites d’une blessure. Il n’y a pas de sauvegarde antérieure.</p>
      <p class="prose" style="color:var(--brass-faint);font-style:italic;">Les batailles, les dates, les unités, les noms des patrons et l’essentiel des situations sont historiques. Les dialogues attribués à César sont ceux que rapportent ses propres <span class="lat">Commentarii</span>, Suétone, Plutarque et Appien.</p>
      <div class="btnrow"><button class="btn prim" onclick="fermerModal()">Retour</button></div>
    </div></div>
   </div>
  </div>`);
}

/* ============================================================
   FINS — la pierre gravée
   ============================================================ */
function inscrNom(nom){ return nom.toUpperCase().replace(/U/g,'V').split(' ').join('&nbsp;·&nbsp;'); }

function ecranMort(){
  const m=S.mort;
  const grade=S.grade.court;
  const camarades=S.commilitones.filter(c=>c.vivant);
  $('app').innerHTML=`
  <div class="wrap">
    <div class="stone">
      <div class="stone-l dm">D&nbsp;&nbsp;&nbsp;&nbsp;M</div>
      <div class="stone-l big">${inscrNom(S.nom)}</div>
      <div class="stone-l">${grade}&nbsp;·&nbsp;${lapidaire(S.legion.replace('Legio','LEG'))}</div>
      <div class="stone-l">STIPENDIORVM&nbsp;·&nbsp;${romain(Math.max(1,S.stipendia))}</div>
      <div class="stone-l">VIXIT&nbsp;·&nbsp;ANNIS&nbsp;·&nbsp;${romain(S.aetas)}</div>
      ${S.decorations.length?`<div class="stone-l">${S.decorations.map(d=>lapidaire(d)).join('&nbsp;&nbsp;')}</div>`:''}
      <div class="stone-l">H&nbsp;·&nbsp;S&nbsp;·&nbsp;E</div>
      <div class="stone-foot">
        ${esc(m.cause)}<br><br>
        ${camarades.length ? esc(camarades.map(c=>c.nom).join(', '))+(camarades.length>1?' ont':' a')+' cotisé pour la pierre.'
          : 'Aucun de ceux avec qui tu t’es engagé n’a survécu pour cotiser à la pierre. La légion l’a payée sur la caisse.'}
      </div>
    </div>
    ${resumeCarriere()}
    <div class="btnrow center" style="justify-content:center;">
      <button class="btn prim" onclick="effacer();S=null;ecranSetup()">Une autre carrière</button>
    </div>
  </div>`;
}

function ecranFin(){
  const t=S.fin.type;
  let titre, texte, hono;
  const o=S.grade.ordre;
  if(t==='missio'){
    titre='MISSIO';
    texte=`Tu as quitté l’armée au Rubicon, avec ta solde et sans ta part des guerres civiles. Douze ans plus tard, quand on parlera de César dans ta ville, tu diras que tu as servi en Gaule et l’on ne te croira qu’à moitié.`;
  } else if(t==='missio_riche'){
    titre='MISSIO&nbsp;·&nbsp;HONESTA';
    texte=`Congé régulier obtenu à Capoue en 47, avec les terres et la prime. Tu as vu la Sambre, Alésia et Pharsale, et tu es sorti debout avec des biens — ce que quatre-vingt-dix hommes sur cent n’ont pas fait.`;
  } else if(S.faction==='pompee'){
    titre='VICTIS';
    texte=`Tu es resté du côté du Sénat jusqu’au bout. Il n’y a plus de Sénat qui commande des armées, plus de Caton, plus de Labienus. On ne t’a pas proscrit : on t’a oublié, ce qui prend plus longtemps.`;
  } else {
    titre='MISSIO&nbsp;·&nbsp;HONESTA';
    if(o>=9) hono='Le primipilat achevé, tu passes dans l’ordre équestre. Ton fils portera l’anneau d’or sans avoir marché.';
    else if(o>=6) hono='Le centurionat te vaut une terre, une clientèle et le droit de te faire appeler par ton cognomen dans ta ville.';
    else if(o>=4) hono='Le grade de principal double ta prime de démobilisation et te vaut un lot correct.';
    else hono='Le lot ordinaire du légionnaire : de la terre, et de la terre qu’il faut défricher.';
    texte=`Mars 45 : Munda est la dernière bataille. Il n’y a plus d’armée à combattre, plus de province à prendre. Devant la table des questeurs, on lit ton dossier à voix haute : les années, les campagnes, les blessures, les décorations.<br><br>${hono}<br><br>Dans onze mois, aux ides de mars, l’homme que tu as suivi pendant treize ans sera tué au pied de la statue de Pompée par soixante sénateurs, dont quatorze qu’il avait épargnés à Pharsale. Tu l’apprendras par un colporteur, en labourant.`;
  }
  $('app').innerHTML=`
  <div class="wrap">
    <div class="stone">
      <div class="stone-l dm">${titre}</div>
      <div class="stone-l big">${inscrNom(S.nom)}</div>
      <div class="stone-l">${lapidaire(S.grade.nom)}</div>
      <div class="stone-l">${lapidaire(S.legion.replace('Legio','LEG'))}</div>
      <div class="stone-l">STIPENDIORVM&nbsp;·&nbsp;${romain(Math.max(1,S.stipendia))}&nbsp;&nbsp;ANNORVM&nbsp;·&nbsp;${romain(S.aetas)}</div>
      ${S.decorations.length?`<div class="stone-l">${S.decorations.map(d=>lapidaire(d)).join('&nbsp;&nbsp;')}</div>`:''}
      <div class="stone-foot">${texte}</div>
    </div>
    ${resumeCarriere()}
    <div class="btnrow center" style="justify-content:center;">
      <button class="btn prim" onclick="effacer();S=null;ecranSetup()">Une autre carrière</button>
    </div>
  </div>`;
}

function resumeCarriere(){
  const morts=S.commilitones.filter(c=>!c.vivant);
  const vifs=S.commilitones.filter(c=>c.vivant);
  const patrons=Object.keys(S.patrons).sort((a,b)=>S.patrons[b]-S.patrons[a]).slice(0,3);
  return `
  <div class="board" style="margin-top:34px;">
    <div class="pan" style="margin-top:0;"><div class="pan-h">États de service</div><div class="pan-b">
      <div class="kv"><span>Grade atteint</span><b class="gold">${esc(S.grade.nom)}</b></div>
      <div class="kv"><span>Années de service</span><b>${S.stipendia}</b></div>
      <div class="kv"><span>Batailles livrées</span><b>${S.batailles}</b></div>
      <div class="kv"><span>Fama finale</span><b>${S.fama}</b></div>
      <div class="kv"><span>Peculium</span><b>${S.peculium.toLocaleString('fr-FR')} deniers</b></div>
      <div class="kv"><span>Blessures</span><b class="${S.vulnera.length>3?'bad':''}">${S.vulnera.length}</b></div>
      <hr class="rule">
      ${ATTRS.map(a=>`<div class="kv"><span>${a.nom}</span><b>${S[a.id]}</b></div>`).join('')}
    </div></div>
    <div class="pan" style="margin-top:0;"><div class="pan-h">Les hommes</div><div class="pan-b">
      ${vifs.length?`<div class="attr-n" style="margin-bottom:8px;">Vivants</div>${vifs.map(c=>`<div class="row"><div class="row-n">${esc(c.nom)}</div></div>`).join('')}`:''}
      ${morts.length?`<div class="attr-n" style="margin:14px 0 8px;">Tombés</div>${morts.map(c=>`<div class="row dead"><div><div class="row-n">${esc(c.nom)}</div><span class="row-s">${Math.abs(c.mort.an)} av. J.-C. · ${esc(c.mort.lieu)}</span></div></div>`).join('')}`:''}
      ${S.vulnera.length?`<div class="attr-n" style="margin:14px 0 8px;">Ce que ton corps a gardé</div><div class="vulnera">${S.vulnera.map(v=>'<div>— '+esc(v.n)+' : '+esc(v.d)+'</div>').join('')}</div>`:''}
    </div></div>
    <div class="pan" style="margin-top:0;"><div class="pan-h">Protections</div><div class="pan-b">
      ${patrons.length?patrons.map(id=>`<div class="row"><div><div class="row-n">${esc(P[id].nom)}</div><span class="row-s">${esc(P[id].titre)}</span></div><div class="row-v">${S.patrons[id]>0?'+':''}${S.patrons[id]}</div></div>`).join('')
        :'<p class="prose" style="font-size:15px;">Tu n’as eu personne pour parler de toi. C’était le cas de presque tous.</p>'}
      ${S.decorations.length?`<div class="attr-n" style="margin:14px 0 8px;">Dona militaria</div><div class="vulnera" style="color:var(--bronze);">${S.decorations.map(d=>'<div>— '+esc(d)+'</div>').join('')}</div>`:''}
      <hr class="rule">
      <div class="attr-n" style="margin-bottom:8px;">Dernières lignes du journal</div>
      <div class="log" style="max-height:190px;">${S.log.slice(0,14).map(l=>`<div class="${l.c}"><span class="y">${esc(l.d)}</span> — ${l.t}</div>`).join('')}</div>
    </div></div>
  </div>`;
}

/* ---------- démarrage ---------- */
window.addEventListener('DOMContentLoaded',()=>{
  const s=charger();
  if(s && !s.mort && !s.fin){ S=s; if(!S.etape) construireTour(); else render(); }
  else ecranSetup();
});

</script>
