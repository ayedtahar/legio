<title>Legio X Equestris</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --noir:#0C0A08;
  --panel:#16120D;
  --panel-2:#1E1913;
  --panel-3:#272016;
  --velours:#6B1E1E;
  --velours-2:#421010;
  --or:#C79A45;
  --or-clair:#F2DFA6;
  --or-vif:#E8CB7C;
  --or-sombre:#7A6031;
  --or-nuit:#4A3A1E;
  --ivoire:#E9DDC2;
  --gris:#9C8C6E;
  --gris-2:#6E6249;
  --vert:#7FB05A;
  --rouge:#C4544A;
  --rouge-fonce:#8E2F27;

  --caps:'Cinzel',Georgia,serif;
  --prose:'EB Garamond',Georgia,serif;
  --data:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;background:#080706;color:var(--ivoire);
  font-family:var(--prose);font-size:17px;line-height:1.55;
  min-height:100vh;
}
h1,h2,h3{margin:0;font-family:var(--caps);font-weight:700;letter-spacing:.04em;text-wrap:balance;}
p{margin:0 0 12px;} p:last-child{margin-bottom:0;}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer;}
:focus-visible{outline:2px solid var(--or-vif);outline-offset:2px;}
::selection{background:var(--velours);color:#F7ECD2;}
.ic{width:1em;height:1em;fill:currentColor;stroke:currentColor;display:block;flex:none;}
.ic[stroke-width]{fill:none;}

/* ---------- coque façon application ---------- */
.app{
  max-width:470px;margin:0 auto;min-height:100vh;position:relative;
  background:
    radial-gradient(ellipse 120% 40% at 50% 0%, rgba(110,30,30,.35), transparent 60%),
    linear-gradient(180deg,#12100C 0%,#0C0A08 40%,#0A0806 100%);
  box-shadow:0 0 70px rgba(0,0,0,.8);
  padding-bottom:96px;
}

/* ---------- bannière de velours ---------- */
.banniere{
  position:relative;padding:16px 16px 14px;text-align:center;
  background:
    linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.55)),
    repeating-linear-gradient(94deg, #7A2222 0 7px, #661C1C 7px 14px, #571818 14px 21px),
    var(--velours);
  border-bottom:2px solid var(--or-nuit);
  box-shadow:inset 0 -14px 26px rgba(0,0,0,.55), 0 4px 14px rgba(0,0,0,.5);
}
.banniere::before,.banniere::after{
  content:'';position:absolute;top:8px;bottom:8px;width:16px;
  border:1px solid rgba(199,154,69,.35);
}
.banniere::before{left:8px;border-right:0;}
.banniere::after{right:8px;border-left:0;}
.aigle{font-size:42px;color:var(--or-vif);margin:0 auto 3px;width:42px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7));}
.titre{
  font-family:var(--caps);font-weight:700;font-size:30px;letter-spacing:.11em;line-height:1;
  background:linear-gradient(180deg,#F7E7B8 0%,#D8B45E 42%,#A87F35 62%,#F0D999 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.55)) drop-shadow(0 2px 5px rgba(0,0,0,.5));
}
.sous-titre{
  margin-top:5px;font-family:var(--caps);font-size:12px;letter-spacing:.34em;
  color:var(--or);text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.sous-titre::before,.sous-titre::after{content:'';height:1px;width:26px;background:linear-gradient(90deg,transparent,var(--or-sombre));}
.sous-titre::after{background:linear-gradient(270deg,transparent,var(--or-sombre));}
.banniere-legende{margin-top:7px;font-size:15px;color:#E4CFA0;font-style:italic;}

/* ---------- cadre orné ---------- */
.cadre{
  position:relative;margin:12px;border:1px solid var(--or-nuit);border-radius:3px;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  box-shadow:inset 0 1px 0 rgba(242,223,166,.09), 0 3px 12px rgba(0,0,0,.5);
}
.cadre::before{
  content:'';position:absolute;inset:3px;border:1px solid rgba(199,154,69,.18);
  border-radius:2px;pointer-events:none;
}
.cadre-t{
  font-family:var(--caps);font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:var(--or);text-align:center;padding:11px 14px 9px;
  display:flex;align-items:center;justify-content:center;gap:11px;
}
.cadre-t::before,.cadre-t::after{content:'◆';font-size:8px;color:var(--or-sombre);}
.cadre-b{padding:0 15px 15px;}

/* ---------- barre du personnage ---------- */
.perso{display:flex;align-items:center;gap:12px;padding:13px 14px;}
.portrait{
  position:relative;width:66px;height:66px;flex:none;border-radius:50%;
  background:radial-gradient(circle at 40% 30%,#3A2E1E,#16120D);
  border:2px solid var(--or-sombre);
  box-shadow:inset 0 0 14px rgba(0,0,0,.8), 0 0 0 1px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.6);
  display:grid;place-items:center;color:var(--or-sombre);font-size:34px;
}
.grade-ecu{
  position:absolute;left:-7px;bottom:-5px;width:26px;height:29px;
  background:linear-gradient(180deg,#8E6B2C,#5C4520);
  clip-path:polygon(0 0,100% 0,100% 68%,50% 100%,0 68%);
  display:grid;place-items:center;
  font-family:var(--caps);font-size:13px;font-weight:700;color:#F7E7B8;
  border:1px solid var(--or);box-shadow:0 2px 5px rgba(0,0,0,.7);
}
.perso-c{flex:1;min-width:0;}
.perso-n{font-family:var(--caps);font-size:19px;font-weight:700;color:#F3E6C6;line-height:1.15;}
.perso-g{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:15.5px;color:var(--or-vif);}
.perso-g .ic{font-size:14px;color:var(--or);}
.xp{margin-top:7px;display:flex;align-items:center;gap:9px;}
.xp-b{flex:1;height:9px;border:1px solid var(--or-nuit);border-radius:5px;background:#0A0806;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.8);}
.xp-b i{display:block;height:100%;background:linear-gradient(180deg,#F0D18A,#B98C36);box-shadow:0 0 8px rgba(199,154,69,.5);transition:width .5s ease;}
.xp-n{font-family:var(--data);font-size:10.5px;color:var(--gris);white-space:nowrap;}

/* vexillum de la légion */
.vexille{
  flex:none;width:56px;padding:7px 4px 0;text-align:center;
  background:linear-gradient(180deg,#7A2222,#4E1414);
  border:1px solid var(--or-sombre);
  clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%);
  box-shadow:0 3px 8px rgba(0,0,0,.6);
}
.vexille-t{font-family:var(--caps);font-size:8.5px;letter-spacing:.13em;color:var(--or-clair);}
.vexille .ic{font-size:19px;color:var(--or-vif);margin:2px auto 1px;}
.vexille-n{font-family:var(--caps);font-size:8px;letter-spacing:.1em;color:var(--or-clair);padding-bottom:7px;}

/* ---------- bandeau des attributs ---------- */
.attrs{
  display:grid;grid-template-columns:repeat(3,1fr);
  margin:0 12px;border:1px solid var(--or-nuit);border-radius:3px;
  background:linear-gradient(180deg,#221C14,#15110C);
  box-shadow:inset 0 1px 0 rgba(242,223,166,.07);overflow:hidden;
}
.at{padding:9px 6px;text-align:center;border-right:1px solid rgba(122,96,49,.28);border-bottom:1px solid rgba(122,96,49,.28);}
.at:nth-child(3n){border-right:0;}
.at:nth-child(n+4){border-bottom:0;}
.at .ic{font-size:19px;color:var(--or);margin:0 auto 3px;}
.at-n{font-family:var(--caps);font-size:9px;letter-spacing:.14em;color:var(--gris);text-transform:uppercase;}
.at-v{font-family:var(--caps);font-size:19px;font-weight:700;color:#F1E2BE;line-height:1.1;margin-top:1px;
  display:flex;align-items:center;justify-content:center;gap:4px;}
.at-v small{font-size:11px;}
.at-v small.up{color:var(--vert);} .at-v small.dn{color:var(--rouge);}
.at.bas .at-v{color:var(--rouge);} .at.bas .ic{color:var(--rouge);}
.at.haut .at-v{color:var(--or-clair);}

/* ---------- panneau d'illustration gravé ---------- */
.grav{
  position:relative;height:154px;border:1px solid var(--or-nuit);border-radius:2px;overflow:hidden;
  background:
    radial-gradient(ellipse 90% 80% at 50% 40%, #2E2517 0%, #171208 70%),
    var(--panel);
  display:grid;place-items:center;
}
.grav::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(45deg, rgba(0,0,0,.13) 0 2px, transparent 2px 5px);
  pointer-events:none;
}
.grav .scene{position:absolute;inset:0;width:100%;height:100%;}
.grav::before{content:'';position:absolute;inset:0;z-index:1;
  box-shadow:inset 0 0 44px rgba(0,0,0,.75), inset 0 -22px 30px rgba(6,5,4,.7);pointer-events:none;}
.grav-l{z-index:2;}
.grav-l{
  position:absolute;left:0;right:0;bottom:0;padding:9px 13px;
  background:linear-gradient(180deg,transparent,rgba(6,5,4,.93));
  font-family:var(--caps);font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--or-vif);
}
.grav img{width:100%;height:100%;object-fit:cover;}

/* ---------- l'événement ---------- */
.ev-t{
  font-family:var(--caps);font-size:24px;font-weight:700;line-height:1.16;letter-spacing:.02em;
  background:linear-gradient(180deg,#F7E7B8,#D3AE5C 55%,#EBD69B);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.5));
  margin-top:13px;
}
.ev-l{
  margin-top:6px;font-family:var(--caps);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gris-2);display:flex;align-items:center;gap:8px;
}
.ev-l::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--or-nuit),transparent);}
.ev-x{margin-top:14px;font-size:17.5px;line-height:1.62;color:#DCCDAA;}
.ev-x em{color:var(--or-vif);font-style:italic;}
.ev-x strong{color:#F7E7B8;font-weight:600;}
.ev-x .lat{font-style:italic;color:var(--or);}
.guerre .ev-t{background:linear-gradient(180deg,#F7D6B8,#D08A5C 55%,#EFC9A0);-webkit-background-clip:text;background-clip:text;}
.guerre .ev-l{color:#B0664E;}

.vue{
  margin-top:14px;padding:10px 13px;border-radius:2px;
  border:1px solid rgba(122,96,49,.4);border-left:3px solid var(--or-sombre);
  background:rgba(199,154,69,.05);
}
.vue b{
  display:flex;align-items:center;gap:6px;
  font-family:var(--caps);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--or);
  margin-bottom:4px;font-weight:700;
}
.vue b .ic{font-size:12px;}
.vue span{font-size:15.5px;color:var(--gris);line-height:1.5;font-style:italic;}

/* ---------- les choix ---------- */
.choix{margin-top:16px;display:flex;flex-direction:column;gap:9px;}
.ch{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:12px 13px;border-radius:3px;position:relative;
  border:1px solid var(--or-nuit);
  background:linear-gradient(180deg,rgba(46,37,23,.85),rgba(22,18,13,.9));
  transition:border-color .14s, background .14s, transform .12s;
}
.ch:not(:disabled):hover{border-color:var(--or);background:linear-gradient(180deg,rgba(62,49,28,.9),rgba(30,24,16,.95));transform:translateY(-1px);}
.ch:not(:disabled):active{transform:translateY(0);}
.ch:disabled{opacity:.42;cursor:not-allowed;}
.ch.rouge{background:linear-gradient(180deg,rgba(86,26,22,.7),rgba(30,14,12,.85));border-color:#6B2A22;}
.ch.rouge:not(:disabled):hover{border-color:#C4544A;}
.ch.vert{background:linear-gradient(180deg,rgba(38,60,32,.6),rgba(16,24,14,.85));border-color:#3E5A31;}
.ch.vert:not(:disabled):hover{border-color:var(--vert);}
.ch.bleu{background:linear-gradient(180deg,rgba(26,38,60,.6),rgba(12,18,28,.85));border-color:#2E425F;}
.ch.bleu:not(:disabled):hover{border-color:#5E86B8;}

.medaille{
  flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 38% 30%,#3D3120,#171208);
  border:1.5px solid var(--or-sombre);
  box-shadow:inset 0 1px 3px rgba(242,223,166,.15), 0 2px 5px rgba(0,0,0,.65);
  color:var(--or-vif);font-size:22px;
}
.ch-c{flex:1;min-width:0;}
.ch-t{font-family:var(--caps);font-size:15.5px;font-weight:600;color:#EFDFB6;line-height:1.25;letter-spacing:.01em;}
.ch-note{margin-top:4px;font-size:14.5px;font-style:italic;color:var(--gris-2);line-height:1.35;}
.puces{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px 9px;align-items:center;}
.puce{
  display:inline-flex;align-items:center;gap:4px;
  font-family:var(--data);font-size:10.5px;letter-spacing:.02em;
}
.puce .ic{font-size:12px;}
.puce.gain{color:var(--vert);} .puce.perte{color:var(--rouge);}
.puce.pari{color:var(--or-vif);} .puce.verrou{color:var(--gris-2);font-style:italic;}
.ch-fl{flex:none;color:var(--or-sombre);font-size:22px;font-family:var(--caps);}

/* ---------- résultat ---------- */
.res{margin-top:16px;padding-top:15px;border-top:1px solid var(--or-nuit);}
.verdict{
  display:inline-flex;align-items:center;gap:7px;margin-bottom:10px;
  font-family:var(--caps);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;
  padding:4px 11px;border-radius:2px;border:1px solid currentColor;
}
.verdict.ok{color:var(--vert);} .verdict.ko{color:var(--rouge);}
.res-x{font-size:17.5px;line-height:1.62;color:#DCCDAA;}
.res-e{margin-top:13px;display:flex;flex-wrap:wrap;gap:6px;}
.res-e .puce{padding:4px 9px;border-radius:2px;border:1px solid currentColor;font-size:11px;}

/* nota */
.nota{margin-top:15px;}
.nota-b{
  display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:2px;
  border:1px solid var(--or-nuit);background:rgba(199,154,69,.06);
  font-family:var(--caps);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--or);
}
.nota-b:hover{border-color:var(--or);color:var(--or-clair);}
.nota-b .ic{font-size:13px;}
.nota-x{
  margin-top:9px;padding:12px 14px;border-radius:2px;
  border:1px solid rgba(122,96,49,.3);background:rgba(0,0,0,.3);
  font-size:15.5px;line-height:1.58;color:var(--gris);font-style:italic;
}
.nota-x .lat{font-style:normal;color:var(--or);}

/* ---------- grand bouton ---------- */
.cta-w{display:flex;align-items:center;gap:10px;justify-content:center;margin:18px 12px 4px;}
.cta-w .ic{font-size:30px;color:var(--or-sombre);flex:none;}
.cta-w .ic:last-child{transform:scaleX(-1);}
.cta{
  flex:1;padding:14px 18px;border-radius:3px;position:relative;
  background:linear-gradient(180deg,#8E2F27,#5E1B16);
  border:1px solid var(--or);
  box-shadow:inset 0 1px 0 rgba(242,223,166,.28), inset 0 -8px 16px rgba(0,0,0,.4), 0 3px 10px rgba(0,0,0,.6);
  font-family:var(--caps);font-size:16px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:#F7E7B8;text-shadow:0 1px 2px rgba(0,0,0,.7);
  transition:filter .14s, transform .12s;
}
.cta:hover{filter:brightness(1.18);} .cta:active{transform:translateY(1px);}
.cta.sombre{background:linear-gradient(180deg,#2E2618,#191309);border-color:var(--or-sombre);color:var(--or-vif);}

/* ---------- listes ---------- */
.ligne{
  display:flex;align-items:center;gap:11px;padding:10px 0;
  border-bottom:1px solid rgba(122,96,49,.22);
}
.ligne:last-child{border-bottom:0;}
.ligne .ic{font-size:19px;color:var(--or-sombre);flex:none;}
.ligne-c{flex:1;min-width:0;}
.ligne-t{font-family:var(--caps);font-size:15px;font-weight:600;color:#E7D7B0;}
.ligne-d{font-size:14.5px;color:var(--gris-2);font-style:italic;margin-top:2px;line-height:1.35;}
.ligne-v{font-family:var(--data);font-size:12px;color:var(--gris);white-space:nowrap;}

/* rail du cursus */
.rail-l{display:flex;gap:12px;padding:9px 0;position:relative;}
.rail-p{
  flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  border:1.5px solid var(--or-nuit);background:#12100B;color:var(--gris-2);font-size:17px;position:relative;z-index:1;
}
.rail-l.fait .rail-p{border-color:var(--or-sombre);color:var(--or-sombre);}
.rail-l.ici .rail-p{border-color:var(--or);color:var(--or-vif);box-shadow:0 0 0 3px rgba(199,154,69,.16), 0 0 14px rgba(199,154,69,.35);}
.rail-l.suiv .rail-p{border-color:var(--or-sombre);color:var(--or);}
.rail-l::before{content:'';position:absolute;left:16.5px;top:0;bottom:0;width:1px;background:rgba(122,96,49,.3);}
.rail-l:first-child::before{top:50%;} .rail-l:last-child::before{bottom:50%;}
.rail-l.fait::before,.rail-l.ici::before{background:var(--or-sombre);}
.rail-c{flex:1;padding-top:4px;}
.rail-t{font-family:var(--caps);font-size:16px;font-weight:600;color:var(--gris-2);}
.rail-l.ici .rail-t{color:#F3E6C6;font-size:18px;}
.rail-l.suiv .rail-t{color:var(--or-vif);}
.rail-d{font-size:14px;color:var(--gris-2);font-style:italic;margin-top:1px;}
.rail-l.ici .rail-d{color:var(--or);font-style:normal;font-family:var(--caps);font-size:11px;letter-spacing:.15em;text-transform:uppercase;}

/* exigences de promotion */
.exig{padding:10px 0;border-bottom:1px solid rgba(122,96,49,.2);}
.exig:last-child{border-bottom:0;}
.exig-t{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
.exig-t .ic{font-size:17px;color:var(--or-sombre);}
.exig-n{flex:1;font-size:15.5px;color:#DFCFA8;}
.exig-v{font-family:var(--data);font-size:12px;color:var(--gris);}
.exig-v b{color:var(--or-vif);font-weight:500;}
.exig-v.ok b{color:var(--vert);}
.exig-b{height:6px;border-radius:3px;background:#0A0806;border:1px solid var(--or-nuit);overflow:hidden;}
.exig-b i{display:block;height:100%;background:linear-gradient(180deg,#EDCE86,#B0842F);transition:width .5s ease;}
.exig-b.ok i{background:linear-gradient(180deg,#9FD07A,#5F8C41);}

/* ---------- navigation basse ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  max-width:470px;margin:0 auto;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:linear-gradient(180deg,#1B1610,#0B0906);
  border-top:2px solid var(--or-nuit);
  box-shadow:0 -6px 20px rgba(0,0,0,.75);
}
.nav-b{
  padding:9px 2px 10px;text-align:center;color:var(--gris-2);
  border-right:1px solid rgba(122,96,49,.2);transition:.14s;
}
.nav-b:last-child{border-right:0;}
.nav-b .ic{font-size:22px;margin:0 auto 4px;}
.nav-b span{font-family:var(--caps);font-size:9px;letter-spacing:.11em;text-transform:uppercase;display:block;}
.nav-b:hover{color:var(--or);}
.nav-b.on{
  color:var(--or-clair);
  background:linear-gradient(180deg,#7A2222,#4A1212);
  box-shadow:inset 0 2px 0 var(--or), inset 0 -10px 18px rgba(0,0,0,.4);
}

/* ---------- écran de promotion ---------- */
.promo{text-align:center;padding:26px 16px 20px;}
.promo .ic.gros{font-size:56px;color:var(--or-vif);margin:0 auto 12px;filter:drop-shadow(0 0 16px rgba(199,154,69,.4));}
.promo-de{font-family:var(--caps);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gris-2);}
.promo-a{
  font-family:var(--caps);font-size:29px;font-weight:700;letter-spacing:.09em;margin:8px 0 12px;
  background:linear-gradient(180deg,#F7E7B8,#D3AE5C 55%,#EBD69B);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

    res:{ r:`Ta voix porte au-dessus des autres. Le centurion instructeur te regarde une seconde de trop. Les recrues aussi.`, e:{disciplina:6, auctoritas:6} } },
  { t:'Ne rien tenter, te fondre dans le rang',
    res:{ r:`Personne ne retient ton nom. C’est souvent la meilleure façon de survivre au premier mois.`, e:{valetudo:5, disciplina:3} } }
  ]},

{ t:'Ad palum', lieu:'Terrain d’exercice',
  x:`Six heures par jour contre un poteau de bois, avec un bouclier d’osier et un glaive de bois deux fois plus lourds que les vrais. <em>Pointe, ne taille pas.</em> C’est la seule leçon, répétée mille fois.`,
  nota:`L’entraînement au <span class="lat">palus</span> employait des armes de bois au double du poids réel. La doctrine romaine privilégiait l’estoc : deux pouces de fer dans le ventre suffisent, et l’estoc découvre moins le flanc que le coup de taille.`,
  o:[
  { t:'Doubler ta ration d’exercice, le soir, seul',
    res:{ r:`Tes mains saignent, mais ton poignet apprend l’angle. Le corps retient ce que la tête oublie.`, e:{virtus:8, scientia:3, valetudo:-3} } },
  { t:'Payer une amphore de vin au campidoctor',
    res:{ r:`Il corrige ta garde en dix minutes, ce que six mois ne t’auraient pas appris. Tout s’achète au camp, même le savoir.`, e:{scientia:8, virtus:4, peculium:-40} } },
  { t:'Apprendre à nager avec les Cisalpins du contubernium',
    res:{ r:`Le Rhône est glacé et personne ne t’a demandé de le traverser. Un jour, quelqu’un le fera.`, e:{scientia:6, auctoritas:5, valetudo:-2} } }
  ]},

{ t:'Gradus militaris', lieu:'Route de la Province',
  x:`Vingt milles en cinq heures, avec trente kilos sur l’épaule : armes, pieu, meule, outils, rations de seize jours. On appelle cela une <span class="lat">mulus Marianus</span> — une mule de Marius. Un homme de ton contubernium s’effondre au quatorzième mille.`,
  nota:`Végèce donne le pas militaire à vingt milles romains — environ vingt-neuf kilomètres — en cinq heures d’été, chargé. Marius avait fait porter le barda par l’homme plutôt que par le train, doublant la vitesse de marche des légions.`,
  o:[
  { t:'Le porter, quitte à finir vidé',
    check:{ s:'valetudo', dc:64 },
    ok:{ r:`Tu le traînes jusqu’au camp. Le contubernium n’oublie pas ce genre de dette : huit hommes, une tente, une meule — et désormais une créance sur toi qui joue dans l’autre sens.`, e:{auctoritas:11, valetudo:-5} },
    ko:{ r:`Vous tombez tous les deux au dix-septième mille. Le campidoctor vous fait finir la marche en courant, sous les yeux de la colonne.`, e:{auctoritas:5, valetudo:-9, disciplina:-3} } },
  { t:'Rester au pas, ne pas rompre le rang',
    note:'Il sera ramassé par la voiture des bagages. Et il le saura.',
    res:{ r:`L’instructeur note ta tenue. L’homme est ramassé par le train, vivant, et ne te regardera plus jamais tout à fait pareil.`, e:{disciplina:9, auctoritas:-6} } },
  { t:'Forcer l’allure et doubler la tête de colonne',
    check:{ s:'virtus', dc:56 },
    ok:{ r:`Tu arrives dans les premiers, presque sec. Le tribun demande ton nom au centurion, qui le lui donne.`, e:{virtus:7, gratia:6, valetudo:-3} },
    ko:{ r:`Tu craques au dernier mille et termines cassé en deux, à vomir sur le bas-côté. Le camp voit tout, toujours.`, e:{valetudo:-7, auctoritas:-5} } }
  ]},

{ t:'Le compte du signifer', lieu:'Sous l’enseigne de la centurie',
  x:`Première solde. Le <span class="lat">signifer</span> tient le registre : sur tes soixante-quinze deniers du quadrimestre, il retient le blé, les bottes, le foin, la literie, la caisse des Saturnales et la contribution funéraire. Reste dix-sept.`,
  nota:`Des papyrus de solde retrouvés en Égypte détaillent ces retenues — <span class="lat">in victum, caligas, fascias, saturnalicium</span>. Le signifer gérait aussi la caisse d’épargne obligatoire de la centurie : c’était le trésorier autant que le porte-enseigne.`,
  o:[
  { t:'Contester le compte ligne par ligne',
    check:{ s:'scientia', dc:48 },
    ok:{ r:`Tu relèves une erreur sur le foin. Le signifer corrige, sec, et te déteste désormais avec précision.`, e:{peculium:45, scientia:5, gratia:-7} },
    ko:{ r:`Tu t’emmêles dans les chiffres. Il te fait répéter devant la file entière. Rire général.`, e:{auctoritas:-7, gratia:-4} } },
  { t:'Payer et te taire',
    res:{ r:`Tu signes. C’est ainsi que fonctionne l’armée : ce n’est pas ton argent, c’est un dépôt qu’on te rendra si tu vis.`, e:{disciplina:5} } },
  { t:'Proposer de tenir le registre à sa place les soirs de garde',
    need:{ s:'scientia', min:34 },
    res:{ r:`Il te tend le stylet en haussant les épaules. Le <span class="lat">tabularium</span> est une porte, et tu viens d’y mettre le pied.`, e:{scientia:10, gratia:7} } }
  ]},

{ t:'Le bizutage du contubernium', lieu:'Tente huit, deuxième centurie',
  x:`Huit hommes, une tente, une meule, une mule. Ils ont vidé ton sac pendant ta garde et attendent de voir ce que tu feras de ton bol brisé.`,
  nota:`Le <span class="lat">contubernium</span> — huit hommes partageant tente et repas — était l’unité de vie réelle du légionnaire. On y mangeait, on y dormait, on y mourait ensemble ; la cohésion de la légion se fabriquait à cette échelle.`,
  o:[
  { t:'Trouver qui a fait le coup et le corriger devant les autres',
    check:{ s:'virtus', dc:52 },
    ok:{ r:`Tu le mets à terre en trois échanges et tu lui tends la main. La tente a sa réponse : on peut compter sur toi, et il ne faut pas te chercher.`, e:{virtus:6, auctoritas:9, valetudo:-3} },
    ko:{ r:`Tu te trompes d’homme. Il te rend coup pour coup et la tente entière rit de toi pendant six semaines.`, e:{auctoritas:-9, valetudo:-4} } },
  { t:'Rire, partager ton vin et n’en plus parler',
    res:{ r:`Tu paies une tournée sur ton viatique. Au matin, ton bol est remplacé par un autre, volé à la centurie voisine. C’est de l’amitié, à leur manière.`, e:{auctoritas:7, gratia:-2, peculium:-30} } },
  { t:'Le signaler au tesserarius',
    note:'Le règlement te donne raison. Sept hommes te donneront tort pendant seize ans.',
    res:{ r:`L’affaire est traitée, deux hommes sont punis, et tu dors désormais dans une tente où personne ne te parle. Le règlement a été appliqué.`, e:{disciplina:8, auctoritas:-12} } }
  ]},

{ t:'La question du blé', lieu:'Magasin du camp',
  x:`Le blé livré par le contractant est coupé de son et d’ivraie. Tout le monde le sait, personne ne le dit : le fournisseur a des protections jusque chez les tribuns.`,
  nota:`L’approvisionnement passait par des <span class="lat">publicani</span> adjudicataires. La fraude sur la qualité était endémique, et les officiers touchaient souvent une commission pour fermer les yeux.`,
  o:[
  { t:'Le signaler au centurion',
    res:{ r:`Il te regarde longuement. « Je sais. » Puis il fait remplacer le lot pour ta centurie seulement, et tu comprends d’un coup comment fonctionne réellement une armée.`, e:{scientia:6, gratia:-4, auctoritas:5} } },
  { t:'Trier le grain toi-même et apprendre à reconnaître l’ivraie',
    res:{ r:`Trois soirs à trier. Tu sais désormais ce qu’un lot vaut d’un coup d’œil — un savoir qui servira longtemps.`, e:{scientia:7, valetudo:-2} } },
  { t:'Racheter du bon grain aux marchands qui suivent l’armée',
    res:{ r:`Tu paies et tu manges correctement. Deux hommes de la tente te demandent de leur en prendre aussi.`, e:{valetudo:7, auctoritas:4, peculium:-60} } }
  ]}
]},

/* ==================== II. HELVETII ==================== */
{
id:'helvetii', n:'Helvetii', sub:'La première campagne', y0:-58, y1:-58, len:6,
events:[

{ at:0, t:'Le rempart de Genève', lieu:'Rive gauche du Rhône',
  x:`Le proconsul est arrivé de Rome en huit jours — on dit qu’il a crevé des chevaux. Il n’a qu’une légion : la tienne. Il fait couper le pont et bâtir dix-neuf milles de rempart contre trois cent mille Helvètes qui veulent traverser.`,
  nota:`César décrit lui-même cet ouvrage : dix-neuf milles de muraille et de fossé de seize pieds, bâtis en quelques semaines. Le génie fut son arme la plus constante — plus décisive, en Gaule, que le glaive.`,
  o:[
  { t:'Prendre le pieu et creuser sans lever la tête',
    res:{ r:`Fossé, palissade, redoutes. Tu ne sais toujours pas te battre, mais tu sais bâtir un mur en une nuit, et cela tuera plus de Gaulois que ton glaive.`, e:{disciplina:8, scientia:4, valetudo:-3} } },
  { t:'Te faire affecter aux équipes d’arpentage',
    need:{ s:'scientia', min:38 },
    res:{ r:`On te met à la corde et à la <span class="lat">groma</span>. Tracer un camp est un métier ; tu l’apprends de l’homme qui l’exerce depuis vingt ans.`, e:{scientia:11, gratia:5} } },
  { t:'Te porter volontaire pour les postes avancés',
    check:{ s:'virtus', dc:50 },
    ok:{ r:`Trois nuits à guetter sur la rive. Tu vois les premiers Helvètes de ta vie, à cinquante pas, qui te regardent aussi.`, e:{virtus:7, scientia:4, valetudo:-2} },
    ko:{ r:`Une sortie nocturne te surprend au poste. Tu t’en tires en courant, ce qui est raisonnable et qu’on ne te pardonnera pas tout de suite.`, e:{valetudo:-6, auctoritas:-5} } }
  ]},

{ at:2, t:'Bibracte', lieu:'Pente au-dessus de la plaine éduenne', guerre:true,
  x:`Ils ont contourné le rempart par le pays séquane. Nous les suivons depuis quinze jours. Ce matin, César a fait retirer tous les chevaux du champ, à commencer par le sien : <em>que nul n’ait d’espoir dans la fuite.</em><br><br>La colline est derrière nous. Les Helvètes montent en phalange, boucliers imbriqués.`,
  vue:{ soldat:'Tu vois trois rangs de boucliers gaulois et la buée de leur souffle.',
        sousoff:'Ta centurie est en deuxième ligne. Les hommes serrent trop les coudes.',
        centurion:'Ta cohorte tient le centre-droit. La pente joue pour nous.',
        superieur:'Toute la première ligne est engagée. La deuxième attend à cinquante pas.' },
  nota:`Le <span class="lat">pilum</span> avait une hampe de fer doux qui pliait à l’impact : il ne pouvait être renvoyé, et il condamnait le bouclier qu’il traversait. À Bibracte, les Helvètes durent jeter des boucliers cloués deux à deux et combattre à découvert.`,
  o:[
  { t:'Lancer à vingt-cinq pas, au commandement',
    note:'Deux fois plus mortel. Et plus rien entre eux et toi si le rang flanche.',
    check:{ s:'disciplina', dc:54 },
    ok:{ r:`La volée part à bout portant. La phalange s’ouvre comme un fruit : les boucliers percés se collent, les Helvètes les jettent et se battent à découvert.`, e:{disciplina:6, virtus:5, gratia:4} },
    ko:{ r:`Deux hommes lancent trop tôt, le reste suit en désordre. La volée s’éparpille et la phalange arrive presque intacte sur les boucliers.`, e:{valetudo:-7, auctoritas:-4} } },
  { t:'Lancer tôt, sûrement, garder le rang',
    res:{ r:`Volée propre à soixante pas. Moins d’effet, mais le rang n’a pas bougé d’un pouce et le second pilum reste en main.`, e:{disciplina:6, virtus:2} } },
  { t:'Décaler la cohorte pour prendre la phalange en écharpe',
    p:'centurion', need:{ s:'scientia', min:48 },
    res:{ r:`Tu fais glisser la cohorte de vingt pas sur la droite pendant qu’ils montent. La volée les prend de biais, sur le flanc non couvert. Un légat te montre du doigt à César.`, e:{scientia:7, auctoritas:6, gratia:10} } },
  { t:'Faire face à droite quand les Boïens tombent sur le flanc',
    p:'sousoff',
    check:{ s:'auctoritas', dc:58 },
    ok:{ r:`Une vingtaine d’hommes pivotent avec toi. Le petit front improvisé tient assez longtemps pour que la troisième ligne arrive. César ordonnera la même manœuvre trois minutes plus tard.`, e:{auctoritas:10, virtus:6, gratia:7, valetudo:-4} },
    ko:{ r:`Tu pivotes ; peu te suivent. On te bouscule, tu perds ton bouclier et l’on te ramasse dix pas en arrière.`, e:{valetudo:-10, auctoritas:-4, vulnus:1} } }
  ]},

{ t:'Les chariots', lieu:'Laager helvète, à la nuit', guerre:true,
  x:`Le combat a duré de la septième heure au soir sans qu’un seul Helvète montre le dos. La nuit tombée, ils se replient sur leur <span class="lat">laager</span> : des milliers de chariots rangés en muraille, où les femmes tendent des javelots par-dessous.`,
  vue:{ soldat:'Tu ne sens plus tes bras. On te tend une outre d’eau tiède.',
        sousoff:'Les enseignes sont regroupées. Il manque un homme sur dix.',
        centurion:'La cohorte peut encore donner une heure, pas deux.',
        superieur:'Forcer cette nuit, ou attendre le jour et la reddition.' },
  nota:`Sur trois cent soixante-huit mille partis, César dit qu’il en rentra cent dix mille. Il les renvoya reconstruire leurs villages : un pays vide se serait rempli de Germains, et il valait mieux des Helvètes vaincus qu’un vide à la frontière.`,
  o:[
  { t:'Forcer le laager dans la nuit',
    note:'Le butin est réel. Ce qui se passe entre les timons ne se raconte pas au camp.',
    res:{ r:`On arrache les chariots à la main sous les javelots lancés à bout portant par des gens qui n’ont plus rien à perdre. Le camp est pris avant l’aube.`, e:{virtus:6, peculium:220, valetudo:-8, auctoritas:3} } },
  { t:'Investir et attendre le jour',
    res:{ r:`On dort en armes, à cent pas. Au matin, ce qui reste se rend. Tes hommes sont tous vivants et la part de butin est maigre.`, e:{disciplina:6, valetudo:3, peculium:70} } },
  { t:'Poster des piquets sur les routes du nord',
    p:'centurion',
    res:{ r:`Six mille Verbigènes tentent de gagner le Rhin dans la nuit ; tes piquets les cueillent. César apprend qu’un officier avait prévu ce qu’il n’avait pas ordonné.`, e:{scientia:7, gratia:11} } }
  ]},

{ at:4, t:'Arioviste', lieu:'Plaine d’Alsace, près du Rhin', guerre:true,
  x:`À Besançon, la panique a pris l’armée : les marchands racontaient la taille des Germains, leur regard qu’on ne peut soutenir. Des tribuns demandaient des congés en pleurant.<br><br>César a dit qu’il partirait avec la Dixième seule, s’il le fallait, et qu’elle lui servirait de garde. Ta légion en est encore ivre d’orgueil. Ils chargent si vite qu’il n’y a pas de place pour lancer les <span class="lat">pila</span>.`,
  vue:{ soldat:'Un homme énorme, torse nu, saute sur les boucliers devant toi.',
        sousoff:'Ta centurie recule d’un pas sous le choc. Un pas seulement.',
        centurion:'Le choc est frontal partout. Leur aile gauche est la plus mince.',
        superieur:'César commande en personne l’aile droite, face au point faible.' },
  nota:`Les prêtresses germaines avaient tiré les sorts : Arioviste ne devait pas combattre avant la nouvelle lune. César attaqua donc immédiatement. Le <span class="lat">gladius</span>, arme de vingt pouces faite pour la pointe, se révéla supérieur dans la presse à l’épée longue germaine.`,
  o:[
  { t:'Jeter la hampe et prendre le glaive dans le même mouvement',
    res:{ r:`Tu es au fer avant qu’il t’atteigne. Vingt pouces, dans la presse, à hauteur de ventre. L’arme fait son travail.`, e:{virtus:8, valetudo:-4} } },
  { t:'Reculer d’un pas pour laisser retomber ceux qui sautent',
    need:{ s:'scientia', min:40 },
    res:{ r:`Le rang s’ouvre d’un pas, le Germain tombe dans le vide entre les boucliers, et trois pointes le trouvent avant qu’il touche terre. Un vieux te tape sur le casque en riant.`, e:{scientia:7, virtus:4, auctoritas:4} } },
  { t:'Porter l’effort sur leur aile gauche',
    p:'centurion',
    check:{ s:'auctoritas', dc:60 },
    ok:{ r:`Tu pousses là où c’est mou. L’aile gauche germanique se replie sur ses chariots et la ligne entière commence à se tordre.`, e:{auctoritas:8, scientia:5, gratia:9} },
    ko:{ r:`L’effort s’enlise. Ta cohorte est en pointe et prend des coups des deux côtés à la fois.`, e:{valetudo:-9, auctoritas:-5, vulnus:1} } },
  { t:'Ouvrir les intervalles pour laisser passer la réserve',
    p:'sousoff',
    res:{ r:`Les centuries s’écartent en quinconce, la réserve de Crassus passe au travers et prend le combat. Les hommes épuisés s’asseyent littéralement sur place.`, e:{disciplina:8, auctoritas:6, gratia:4} } }
  ]},

{ t:'Jusqu’au Rhin', lieu:'Cinq milles de poursuite', guerre:true,
  x:`Ils cassent et fuient vers le fleuve. Arioviste trouve une barque et passe ; ses deux femmes et une de ses filles meurent dans la fuite. La cavalerie fait le reste.`,
  nota:`César écrit que la poursuite se fit sur cinquante milles jusqu’au Rhin. Les chiffres qu’il donne — quatre-vingt mille morts — sont ceux d’un homme qui rédige son propre rapport pour le Sénat et l’opinion romaine.`,
  o:[
  { t:'Poursuivre jusqu’au fleuve sans regarder derrière',
    res:{ r:`Vous atteignez la rive. Ce qui se passe entre l’eau et le rang, on n’en parle pas au camp. Le butin, si.`, e:{virtus:4, peculium:280, valetudo:-4} } },
  { t:'Rassembler ton monde et rentrer en ordre',
    note:'Moins de butin. Les vétérans remarquent autre chose.',
    res:{ r:`Tu ramènes tes hommes complets, en rang, avec leurs armes. Un centurion de la première cohorte te regarde passer et retient ton visage.`, e:{auctoritas:9, disciplina:6, gratia:3} } }
  ]},

{ t:'Le premier hiver', lieu:'Quartiers d’hiver, chez les Séquanes',
  x:`Des baraques de bois à la place des tentes, un four, une infirmerie. On répare, on recoud, on enterre proprement ceux qu’on avait enterrés vite. Les lettres d’Italie arrivent par paquets de trois mois.`,
  nota:`Les <span class="lat">hiberna</span> occupaient plus de la moitié de l’année. C’est là que se faisait l’essentiel de la vie militaire : réparation, instruction, comptes, et l’intrigue de camp qui décidait des carrières.`,
  o:[
  { t:'Refaire ton équipement de fond en comble',
    res:{ r:`Cotte recloutée, semelles, courroies, fourreau. Un hiver d’atelier qui vaudra cher au printemps.`, e:{disciplina:5, valetudo:8, peculium:-70} } },
  { t:'Passer l’hiver à te faire voir des officiers',
    res:{ r:`Dîners, chasses, parties de dés perdues à propos. Un hiver bien employé vaut deux batailles pour un cursus.`, e:{gratia:11, auctoritas:-3, peculium:-150} } },
  { t:'Écouter les vieux refaire les batailles sur le sable',
    res:{ r:`Ils te montrent où placer un homme qui a peur, et comment reconnaître qu’une ligne va céder trois minutes avant qu’elle cède.`, e:{scientia:9, auctoritas:4} } },
  { t:'Soigner réellement tes blessures',
    res:{ r:`Trois mois sans marcher. Le médecin grec de la légion recoud correctement ce qui avait été recousu vite.`, e:{valetudo:20, gratia:-3}, soin:1 } }
  ]}
]},

/* ==================== III. BELGAE ==================== */
{
id:'belgae', n:'Belgae', sub:'Le pays des Belges et l’Océan', y0:-57, y1:-56, len:6,
events:[

{ at:0, t:'Le camp sur l’Aisne', lieu:'Chez les Rèmes',
  x:`Deux légions neuves sont arrivées de Cisalpine. Les vétérans les regardent comme on regarde du blé vert. Les Belges se sont ligués : on parle de trois cent mille hommes en armes.<br><br>Le camp sur l’Axona est un ouvrage de manuel : fossé de dix-huit pieds, deux redoutes, un pont gardé.`,
  nota:`César ne livrait bataille que sur un terrain qu’il avait fabriqué. Le camp romain, retranché chaque soir même en marche, était moins un abri qu’une pièce de manœuvre : il permettait de refuser le combat jusqu’au moment choisi.`,
  o:[
  { t:'Tenir le gué et interdire le passage',
    check:{ s:'virtus', dc:54 },
    ok:{ r:`Le gué reste romain. Ils s’y écrasent par vagues, en aveugle, et rebroussent.`, e:{virtus:7, gratia:6, valetudo:-3} },
    ko:{ r:`Un groupe passe cent pas plus bas pendant que tu regardes le gué. On te le fait remarquer, et pas doucement.`, e:{gratia:-6, valetudo:-5} } },
  { t:'Reconnaître la rive avant de te poster',
    res:{ r:`Tu trouves deux passages à sec en aval que personne n’avait signalés, et tu les fais garnir avant de tenir le tien.`, e:{scientia:9, gratia:6} } },
  { t:'Fortifier ton poste avant toute chose',
    p:'sousoff',
    res:{ r:`Fossé, pieux, une nuit de travail. Au matin, l’attaque bute sur un ouvrage qui n’existait pas la veille.`, e:{disciplina:7, auctoritas:6, valetudo:-3} } }
  ]},

{ at:1, t:'La Sambre — sac à terre', lieu:'Sabis, chez les Nerviens', guerre:true,
  x:`Le pire jour de la guerre des Gaules. Nous bâtissions le camp au-dessus de la rivière, sacs à terre, quand soixante mille Nerviens sont sortis du bois d’un seul coup.<br><br>Pas de ligne, pas de trompettes, pas d’ordre reçu. César fait dresser l’étendard rouge et court d’un point à l’autre en parlant à qui il croise.`,
  vue:{ soldat:'Ton casque est sur ton sac, à trente pas, sous le sac d’un autre.',
        sousoff:'Tes hommes sont éparpillés sur trois cents pas de chantier.',
        centurion:'Aucun ordre ne viendra. C’est toi qui commandes, maintenant, et pour de bon.',
        superieur:'Deux légions sont coupées. On ne voit rien de l’aile gauche.' },
  nota:`César raconte qu’il n’eut le temps ni de faire sonner, ni de donner le mot d’ordre, ni de ranger la ligne : chaque homme se forma sur l’enseigne la plus proche. C’est cette capacité à se recomposer sans ordre qui distinguait une légion d’une foule armée.`,
  o:[
  { t:'Te ranger à la première enseigne venue, pas à la tienne',
    note:'La règle est de rejoindre sa propre centurie. La règle vaut moins qu’une minute.',
    res:{ r:`Tu te ranges sous une enseigne inconnue, avec des hommes que tu ne connais pas — et le front existe. C’est exactement ce que la légion sait faire et que rien d’autre au monde ne sait faire.`, e:{disciplina:8, virtus:5, valetudo:-4} } },
  { t:'Perdre trente secondes à lacer casque et découvrir le bouclier',
    res:{ r:`Trente secondes. Tu arrives au rang équipé comme il faut quand la moitié se bat tête nue. Cela se paiera à la troisième heure de combat.`, e:{scientia:5, valetudo:9, auctoritas:-3} } },
  { t:'Rameuter à la voix tout ce qui passe',
    p:'sousoff',
    check:{ s:'auctoritas', dc:60 },
    ok:{ r:`Ta voix porte au-dessus du bruit. Cent cinquante hommes de quatre centuries différentes se rangent sur toi. Il y a désormais un front là où il n’y avait qu’un chantier.`, e:{auctoritas:13, gratia:9, virtus:4, valetudo:-4} },
    ko:{ r:`Tu cries dans un vacarme où l’on ne s’entend pas à cinq pas. Tu finis par te battre avec trois hommes, dos à un chariot.`, e:{valetudo:-10, vulnus:1} } }
  ]},

{ at:2, t:'La Douzième meurt', lieu:'Aile gauche, Sabis', guerre:true,
  x:`La XII a tous ses centurions à terre, son porte-aigle de la quatrième cohorte tué, l’enseigne perdue, le primipile Sextius Baculus percé de coups au point de ne plus tenir debout.<br><br>Les rangs se sont tassés les uns dans les autres : les hommes ne peuvent plus lever le bras.`,
  vue:{ soldat:'Devant toi, un rang de dos. Personne ne frappe plus, la presse est trop forte.',
        sousoff:'L’enseigne de la centurie voisine est à terre. Personne ne la relève.',
        centurion:'La XII est un bloc compressé qui ne combat plus. Elle va se faire égorger sur place.',
        superieur:'César a pris un bouclier à un homme du dernier rang et est entré dans la ligne à pied.' },
  nota:`Sextius Baculus, primipile de la XII, survécut à ce jour et reparaîtra deux fois dans les <span class="lat">Commentarii</span>, chaque fois blessé et chaque fois debout. César dit qu’il fit lui-même ouvrir les rangs pour que les hommes pussent se servir de leur glaive.`,
  o:[
  { t:'Aller chercher l’enseigne tombée',
    note:'Tu la relèveras. Tu prendras un coup en le faisant : c’est certain, pas probable.',
    res:{ r:`Tu la relèves et tu la portes en avant de trois pas. Trois pas, et deux cents hommes qui se croyaient morts se remettent à frapper. Une pointe t’ouvre l’épaule au passage. On te fera raconter cela pendant vingt ans.`, e:{virtus:11, auctoritas:14, gratia:12, valetudo:-12, vulnus:1} } },
  { t:'Élargir les rangs pour qu’on puisse frapper',
    need:{ s:'scientia', min:46 },
    res:{ r:`Tu fais ouvrir les rangs et reculer les enseignes pour donner de l’air. Les hommes retrouvent la place de leur bras droit. C’est précisément ce que César ordonne à l’autre bout de la ligne, au même instant.`, e:{scientia:11, auctoritas:9, gratia:10, valetudo:-3} } },
  { t:'Tenir le rang et frapper ce qui vient',
    res:{ r:`Tu tiens ta place dans la presse et tu frappes dans les intervalles. Rien d’héroïque : la ligne existe encore à la fin de l’heure grâce à trois cents hommes qui ont fait exactement cela.`, e:{disciplina:8, virtus:4, valetudo:-7} } },
  { t:'Faire relever les blessés pendant que la X revient à revers',
    p:'centurion',
    note:'Aucun avantage tactique. Six cents hommes vivront.',
    res:{ r:`Tu détaches deux centuries pour tirer les blessés de la presse pendant que le reste avance. La XII s’en souviendra ; le rapport de bataille, non.`, e:{auctoritas:12, gratia:-3, valetudo:-4} } }
  ]},

{ t:'Cinquante-trois mille têtes', lieu:'Oppidum des Aduatuques',
  x:`Les Aduatuques ont rendu leurs armes par-dessus le mur, puis tenté une sortie la nuit venue avec les armes cachées. Au matin, César a vendu la ville entière : cinquante-trois mille têtes, adjugées d’un seul lot au marchand qui suit l’armée.`,
  nota:`Le chiffre est de César lui-même. Les marchands d’esclaves suivaient les armées et achetaient en gros sur le champ ; le produit était réparti entre le général, le trésor et les hommes. C’était une part normale de la solde.`,
  o:[
  { t:'Prendre ta part et n’y plus penser',
    res:{ r:`Ta part est comptée et versée. C’est la guerre, c’est le droit de la guerre, ils ont violé leur serment. Toutes ces phrases sont vraies.`, e:{peculium:420, valetudo:-2} } },
  { t:'Racheter une famille de ta part et l’affranchir',
    note:'Personne ne comprendra. Toi non plus, tout à fait.',
    res:{ r:`Tu paies le prix du lot pour trois personnes et tu les fais inscrire libres au registre. Tes hommes te regardent différemment — pas plus mal, différemment.`, e:{peculium:-350, auctoritas:11, gratia:-4} } },
  { t:'Racheter le lot des forgerons pour le revendre en Cisalpine',
    check:{ s:'scientia', dc:52 },
    ok:{ r:`Les artisans valent quatre fois le prix du lot commun sur les marchés du Pô. Tu spécules sur des gens, et tu es très bon à cela.`, e:{peculium:900, scientia:4, auctoritas:-4} },
    ko:{ r:`Le convoi est pillé sur la route de l’Italie. Tu perds ta mise et le reste.`, e:{peculium:-400} } }
  ]},

{ t:'Les faux de marine', lieu:'Golfe du Morbihan', guerre:true,
  x:`Les navires vénètes sont plus hauts que les nôtres, en chêne, chevillés au fer, à voiles de cuir. L’éperon ne peut rien contre eux. Décimus Brutus a fait forger des faux emmanchées sur de longues perches, pour couper les drisses : un navire sans voile est un rocher.`,
  nota:`César décrit précisément ce stratagème. Le vent tomba pendant l’action, immobilisant les deux cent vingt vaisseaux vénètes sous les yeux de l’armée massée sur les falaises. Ce fut la première bataille navale romaine sur l’Océan.`,
  o:[
  { t:'Manœuvrer à la perche et couper',
    res:{ r:`La faux mord, on souque à six, la vergue tombe avec la voile de cuir. Le navire devient un ponton et l’on monte dedans.`, e:{disciplina:6, scientia:4, peculium:140, valetudo:-3} } },
  { t:'Aborder de force sans couper la voile',
    check:{ s:'virtus', dc:62 },
    ok:{ r:`Tu montes à la corde sous les traits, en cotte de mailles, sur un pont plus haut d’un homme. Ceux qui te suivent ne l’oublieront pas.`, e:{virtus:9, auctoritas:8, peculium:180, valetudo:-5} },
    ko:{ r:`On te repousse du bastingage. Deux hommes tombent entre les coques et ne remontent pas.`, e:{valetudo:-9, auctoritas:-5, vulnus:1} } },
  { t:'Attendre la bascule du vent avant d’engager',
    p:'centurion', need:{ s:'scientia', min:50 },
    res:{ r:`Tu lis le calme qui vient et tu retiens tes navires vingt minutes. Le vent tombe : deux cent vingt vaisseaux s’immobilisent devant nous. On les prend un par un jusqu’au soir.`, e:{scientia:10, gratia:12, peculium:300} } }
  ]},

{ t:'Le sort des Vénètes', lieu:'Camp de la Loire',
  x:`La flotte prise, la nation se rend. César décide de faire un exemple parce qu’ils ont saisi des ambassadeurs : il fait exécuter tout le sénat vénète et vendre le reste.`,
  nota:`César justifie la sévérité par la violation du droit d’ambassade. Cicéron, dans une lettre privée, s’inquiétera de ce que son frère Quintus sert sous un homme qui traite ainsi des peuples qui se rendent.`,
  o:[
  { t:'Exécuter les ordres sans commentaire',
    res:{ r:`C’est fait. Le butin est distribué. Le camp n’en parle pas et n’en parlera plus.`, e:{disciplina:5, peculium:200, auctoritas:-3} } },
  { t:'Faire retirer les enfants du lot avant la vente',
    p:'sousoff',
    note:'Cela ne les sauve pas. Cela les sépare autrement.',
    res:{ r:`Tu obtiens du questeur qu’on les vende à part, aux domaines et non aux mines. C’est une différence de dix ans d’espérance de vie, et personne au camp ne comprend pourquoi tu t’en soucies.`, e:{auctoritas:9, scientia:3, peculium:120} } },
  { t:'Objecter au conseil qu’un peuple massacré en arme dix autres',
    p:'centurion',
    check:{ s:'scientia', dc:66 },
    ok:{ r:`Tu le dis calmement, sans emphase. César t’écoute jusqu’au bout, ne change rien, et retient ton nom. Les officiers qui pensent avant de parler sont rares.`, e:{scientia:7, auctoritas:7, gratia:8} },
    ko:{ r:`Tu passes pour un homme au cœur tendre devant vingt officiers. Le mot circulera plus vite que tu ne le voudrais.`, e:{gratia:-9, auctoritas:-5} } }
  ]},

{ t:'Le partage du monde', lieu:'Quartiers d’hiver, vallée de la Loire',
  x:`À Lucques, ce printemps, César, Pompée et Crassus se sont partagé le monde comme trois hommes partagent une succession : l’Espagne à l’un, la Syrie à l’autre, et cinq années de plus en Gaule pour le nôtre.`,
  nota:`La conférence de Lucques, en avril 56, prorogea le commandement de César de cinq ans. Elle scella aussi le sort de Crassus, qui partit pour la Parthie et y mourut à Carrhes trois ans plus tard.`,
  o:[
  { t:'Faire tes comptes : cinq ans de solde et de butin',
    res:{ r:`Tu calcules ce que cinq ans rapportent si tu vis, et ce qu’ils coûtent si tu meurs. Le second chiffre est plus facile à établir.`, e:{scientia:5, peculium:180} } },
  { t:'Écrire à ta famille de placer l’argent en terre plutôt qu’en prêts',
    res:{ r:`La terre survit aux guerres civiles ; les créances, non. Ton correspondant exécute. Dans huit ans, tu seras l’un des rares du camp à posséder encore ce qu’il possédait.`, e:{scientia:6, peculium:200} } },
  { t:'Sonder discrètement les officiers sur ce qu’ils feront si cela tourne mal',
    check:{ s:'gratia', dc:58 },
    ok:{ r:`Tu apprends que Labienus a des terres dans le Picénum, pays de Pompée, et qu’il y écrit souvent. C’est un détail. Dans sept ans, ce sera le détail.`, e:{scientia:7, gratia:4}, lien:{labienus:1} },
    ko:{ r:`Ta curiosité se voit. On te fait dire, par un tiers, qu’un bon soldat ne s’occupe pas de politique.`, e:{gratia:-8, auctoritas:-3} } }
  ]}
]},

/* ===== src2/data-phases-2.js ===== */
/* ==================== IV. OCEANVS ==================== */
{
id:'oceanus', n:'Oceanus', sub:'Le Rhin et la Bretagne', y0:-55, y1:-54, len:6,
events:[

{ at:0, t:'La parole donnée', lieu:'Confluent de la Meuse et du Rhin',
  x:`Quatre cent mille Germains ont passé le Rhin. Leurs chefs sont venus au camp sous couvert de trêve ; César les a fait arrêter, puis a lancé l’armée sur un camp resté sans chefs.<br><br>Il n’y a pas eu de bataille. Il y a eu ce qui suit une bataille, mais sans la bataille.`,
  nota:`À Rome, Caton demanda au Sénat qu’on livrât César aux Germains pour expier la violation de la foi jurée. La motion échoua. César, dans ses <span class="lat">Commentarii</span>, présente l’arrestation comme une réponse à une embuscade germaine.`,
  o:[
  { t:'Faire ton office sans commentaire',
    res:{ r:`Tu fais ce qu’on te dit. Tu n’es ni le premier ni le dernier, et cela ne console de rien.`, e:{disciplina:5, valetudo:-2, auctoritas:-2} } },
  { t:'Laisser passer les non-combattants dans ton secteur',
    note:'Un quart d’heure les yeux ailleurs. Quelques centaines de personnes.',
    res:{ r:`Tu détournes les yeux pendant un quart d’heure. Personne ne saura jamais combien sont passés, ni que c’était toi. Deux hommes de ta tente l’ont vu.`, e:{auctoritas:10, gratia:-6} } },
  { t:'Consigner par écrit les circonstances exactes de l’arrestation des chefs',
    need:{ s:'scientia', min:44 },
    res:{ r:`Tu rédiges un mémoire exact, daté, que tu gardes. Tu ne l’utiliseras jamais. Il existe, et il t’arrive d’y penser.`, e:{scientia:8, gratia:-4} } }
  ]},

{ at:1, t:'Dix jours de pont', lieu:'Rive gauche du Rhin',
  x:`Il aurait pu passer sur les barques des Ubiens. Il a jugé cela indigne du peuple romain.<br><br>Le génie plante des pieux jumelés en biais dans le courant, entretoisés, lestés par la poussée du fleuve lui-même : plus l’eau pousse, plus le pont serre.`,
  nota:`César consacre à ce pont une description technique de plusieurs paragraphes — la plus détaillée de tout l’ouvrage. Dix jours de la coupe du bois au passage. Il resta dix-huit jours en Germanie, ne combattit personne, et détruisit le pont derrière lui. Le message était l’ouvrage.`,
  o:[
  { t:'Travailler à la charpente jour et nuit',
    res:{ r:`Tu apprends à assembler une pile sous un courant de six pieds par seconde. Ce savoir-là ne se perd pas.`, e:{scientia:9, disciplina:5, valetudo:-4} } },
  { t:'Demander à l’architecte comment tient l’assemblage',
    need:{ s:'scientia', min:42 },
    res:{ r:`Il te dessine le principe sur une tablette de cire : les pieux inclinés à contre-courant, la poussée qui verrouille l’ouvrage au lieu de l’emporter. Tu gardes la tablette.`, e:{scientia:12, gratia:5} } },
  { t:'Passer le premier sur le tablier quand il est achevé',
    res:{ r:`Tu marches sur le Rhin. Personne dans ta famille n’a jamais vu ce fleuve, et personne ne te croira.`, e:{virtus:5, auctoritas:6} } }
  ]},

{ at:2, t:'L’aigle de la Dixième', lieu:'Côte de Bretagne', guerre:true,
  x:`Les navires ne peuvent aborder à cause des hauts-fonds : il faut sauter dans l’eau jusqu’à la poitrine, en armes, sous les traits et les chars. Personne ne bouge.<br><br>Alors le porte-aigle de la Dixième saute le premier : <em>« Sautez, soldats, si vous ne voulez pas livrer l’aigle à l’ennemi ! »</em>`,
  vue:{ soldat:'L’eau est plus froide que tout ce que tu connais.',
        sousoff:'Ta centurie hésite une seconde entière. Une seconde, c’est très long.',
        centurion:'Le débarquement se joue dans les quinze prochaines secondes.',
        superieur:'Les navires longs peuvent venir prendre le flanc breton à la rame.' },
  nota:`Le mot est rapporté par César lui-même, qui ne nomme pas le porte-aigle. Perdre une aigle était le déshonneur absolu d’une légion — celles de Crassus, perdues à Carrhes, ne seront récupérées qu’en 20 av. J.-C., par la diplomatie.`,
  o:[
  { t:'Sauter dans la seconde qui suit',
    res:{ r:`Tu es dans l’eau avec lui, et les autres suivent parce qu’on ne laisse pas une aigle seule. On te citera avec les premiers.`, e:{virtus:9, auctoritas:8, gratia:8, valetudo:-4} } },
  { t:'Organiser les barques pour repêcher ceux qui coulent',
    note:'Une cotte de mailles pèse dix kilos. Beaucoup ne savent pas nager.',
    res:{ r:`Tu détaches les chaloupes et les esquifs de reconnaissance. Une quarantaine d’hommes te doivent la vie sans savoir ton nom.`, e:{scientia:7, auctoritas:10, valetudo:-2} } },
  { t:'Faire venir les navires longs prendre les Bretons de flanc',
    p:'centurion',
    res:{ r:`Frondes, arcs et scorpions à bout portant depuis la mer. Les chars bretons décrochent, et la plage devient praticable.`, e:{scientia:8, gratia:9} } }
  ]},

{ t:'Les chars', lieu:'Au-delà de la Tamise', guerre:true,
  x:`Le char breton n’est pas une machine de choc : il court le long du front en jetant des traits, le guerrier saute à terre pour combattre, le conducteur se tient à portée pour le reprendre.<br><br>Cela combine la vitesse du cavalier et la fermeté du fantassin, et nos hommes n’ont jamais vu cela.`,
  vue:{ soldat:'Tu passes tes journées à fourrager en armes.',
        sousoff:'On te confie la garde des fourrageurs de trois centuries.',
        centurion:'Tes détachements rentrent toujours incomplets.',
        superieur:'Il faut choisir entre nourrir l’armée et la garder groupée.' },
  nota:`César consacre au char breton une description admirative : c’était une tactique qu’aucun peuple continental ne pratiquait plus. Il ne parvint jamais à la contrer autrement qu’en refusant de disperser ses hommes.`,
  o:[
  { t:'Fourrager en formation serrée, quitte à rapporter moins',
    note:'La faim est moins mortelle que les chars.',
    res:{ r:`On rentre tous les soirs avec tout le monde et la moitié du grain nécessaire. Les hommes grognent et rentrent.`, e:{disciplina:7, auctoritas:6, valetudo:-3} } },
  { t:'Tendre une embuscade aux embusqueurs',
    check:{ s:'scientia', dc:60 },
    ok:{ r:`Tu laisses un détachement bien visible et bien lent, et tu couches deux centuries dans le fossé de la haie. Les chars entrent dedans. On en prend neuf avec les attelages.`, e:{scientia:9, virtus:5, gratia:9, peculium:200} },
    ko:{ r:`Ils ne mordent pas — ou plutôt, ils mordent ailleurs, et c’est ton détachement-appât qui prend tout.`, e:{auctoritas:-8, valetudo:-7, vulnus:1} } },
  { t:'Traiter avec les Trinovantes contre Cassivellaunos',
    p:'centurion',
    res:{ r:`Ils haïssent Cassivellaunos, qui a tué leur roi. Ils livrent du blé, des otages et l’emplacement de son oppidum. La guerre change de nature en une conversation.`, e:{scientia:6, gratia:11} } }
  ]},

{ t:'La flotte brisée', lieu:'Camp naval, côte du Kent',
  x:`Une marée de pleine lune, que personne n’avait prévue, a jeté les navires de transport les uns sur les autres. Quarante sont perdus, le reste est à réparer.`,
  nota:`Les Romains, gens de Méditerranée, ne connaissaient pas les grandes marées de l’Atlantique. César perdit deux fois sa flotte pour cette raison. Rome décréta vingt jours d’actions de grâces pour une expédition qui ne rapporta ni province ni butin.`,
  o:[
  { t:'Tirer les navires à sec et réparer, dix jours durant',
    res:{ r:`Dix jours de charpente sur une plage, sans dormir. On sauve ce qui peut l’être et l’on rembarque à l’étroit.`, e:{disciplina:6, scientia:5, valetudo:-5} } },
  { t:'Dire aux hommes ce qu’ils ont fait, pas ce qu’ils n’ont pas gagné',
    p:'sousoff',
    res:{ r:`Tu leur dis qu’aucune armée du monde n’a passé cet Océan, que leurs petits-fils le raconteront, et que le blé, lui, est en Gaule. Ils rient. Cela suffit.`, e:{auctoritas:11, disciplina:3} } },
  { t:'Payer une tournée sur ta propre bourse',
    res:{ r:`Deux amphores et une nuit. Les hommes savent d’où vient le vin, et c’est tout l’intérêt.`, e:{auctoritas:9, peculium:-140} } }
  ]},

{ t:'Un homme libre d’un peuple libre', lieu:'Portus Itius',
  x:`Dumnorix l’Éduen refuse d’embarquer et s’enfuit avec sa cavalerie en criant qu’il est un homme libre d’un peuple libre. César interrompt l’embarquement et détache la cavalerie avec ordre de le ramener — ou de le tuer s’il résiste.`,
  nota:`César rapporte la phrase de Dumnorix : <span class="lat">se liberum liberaeque civitatis esse</span>. Il fut rattrapé et tué. Six ans plus tard, les Éduens basculeront dans la révolte de Vercingétorix.`,
  o:[
  { t:'Faire partie du détachement',
    res:{ r:`On le rattrape à six milles. Il se bat, il crie sa phrase jusqu’au bout, et il meurt. Le détachement rentre en silence.`, e:{virtus:4, gratia:8, auctoritas:-5} } },
  { t:'Rester à l’embarquement et le mener proprement',
    res:{ r:`Tu fais embarquer ta part de la légion en bon ordre pendant que d’autres courent après un cavalier. C’est le travail.`, e:{disciplina:7, gratia:3} } },
  { t:'Suggérer qu’un Éduen mort vaut moins qu’un Éduen otage',
    p:'sousoff',
    check:{ s:'scientia', dc:62 },
    ok:{ r:`On ne te suit pas, mais l’argument est retenu — et il resservira dans deux ans, quand les Éduens basculeront et qu’on cherchera pourquoi.`, e:{scientia:8, gratia:6} },
    ko:{ r:`On te répond que la décision est prise et que ton avis n’était pas demandé.`, e:{gratia:-5} } }
  ]}
]},

/* ==================== V. ATVATVCA ==================== */
{
id:'atuatuca', n:'Atuatuca', sub:'Le désastre, et ce qui suit', y0:-54, y1:-53, len:5,
events:[

{ at:0, t:'Quinze cohortes', lieu:'Camp d’hiver d’Atuatuca',
  x:`La récolte a manqué : les huit légions sont dispersées en huit camps, à cent milles les uns des autres. C’est là qu’Ambiorix a frappé.<br><br>Sabinus a cru à sa parole et fait sortir quinze cohortes. Elles sont mortes dans un défilé, jusqu’à la dernière ou presque. Cotta est tombé le visage fracassé, en refusant de parlementer.`,
  nota:`C’est la plus lourde défaite de César en Gaule : environ six mille hommes. Il jura de ne pas se raser ni se couper les cheveux avant de l’avoir vengée. Les <span class="lat">Commentarii</span> chargent Sabinus et innocentent Cotta, qui avait voulu rester dans le camp.`,
  o:[
  { t:'Écouter les survivants et retenir la leçon',
    res:{ r:`Ils sont sept. Ils racontent la colonne étirée dans le défilé, l’ordre de former le cercle donné trop tard, les bagages abandonnés qui ont désorganisé le rang. Tu retiens tout.`, e:{scientia:10, valetudo:-2, auctoritas:3} } },
  { t:'Faire jurer à ta tente de ne jamais parlementer en campagne',
    res:{ r:`Un serment de huit hommes sous une tente, sans témoin. Ce genre de chose ne vaut rien et tient parfois mieux que le règlement.`, e:{auctoritas:9, disciplina:5} } },
  { t:'Vérifier toi-même les défenses de ton propre camp',
    res:{ r:`Tu passes trois nuits à contrôler les postes, les réserves d’eau, les issues. On te trouve pénible. Dans six semaines, on ne te trouvera plus pénible.`, e:{disciplina:8, scientia:5, valetudo:-3} } }
  ]},

{ at:1, t:'Pullo et Vorenus', lieu:'Camp de Q. Cicéron, chez les Nerviens', guerre:true,
  x:`Deux centurions de la première cohorte, Titus Pullo et Lucius Vorenus, se disputent depuis des années le premier rang. Aujourd’hui, Pullo sort du rempart en criant à Vorenus qu’il n’a plus d’excuse pour douter de sa valeur.<br><br>Vorenus le suit, parce qu’il ne peut pas faire autrement. Tout le camp est monté sur le rempart pour regarder.`,
  vue:{ soldat:'Deux hommes seuls contre une ligne gauloise. Personne ne détourne les yeux.',
        sousoff:'C’est absurde et c’est la chose la plus romaine que tu aies vue.',
        centurion:'Tu connais les deux. Tu sais exactement pourquoi ils font cela.',
        superieur:'Deux officiers de la première cohorte hors du rempart. Si tu les perds, tu perds plus que deux hommes.' },
  nota:`César nomme les deux centurions et raconte l’épisode en détail : Pullo cloué au sol par un trait dans le baudrier, Vorenus revenant le chercher, tombant à son tour, et Pullo relevé le tirant en arrière. Ils rentrèrent vivants tous les deux. C’est l’un des rares passages où César s’attarde sur des individus du rang.`,
  o:[
  { t:'Les couvrir avec tout ce qui peut tirer du rempart',
    res:{ r:`Frondeurs, archers, tout ce qui a un bras. Ils rentrent tous les deux, sous une pluie de traits qui vient de tes hommes. Le camp entier a vu qui les couvrait.`, e:{auctoritas:9, gratia:6, scientia:3} } },
  { t:'Sortir les chercher',
    note:'Tu les ramèneras. Tu y laisseras quelque chose : c’est certain.',
    res:{ r:`Tu franchis le rempart avec une poignée d’hommes et tu ramènes les deux centurions par le col, sous les yeux du camp entier et de la moitié de la Gaule. Ton avant-bras est ouvert jusqu’à l’os. Il n’y a pas d’autre monnaie que celle-là dans une légion.`, e:{virtus:12, auctoritas:15, gratia:10, valetudo:-13, vulnus:1} } },
  { t:'Interdire la sortie et les faire rentrer sous peine de sanction',
    p:'centurion',
    note:'Deux centurions vivants valent mieux qu’une légende. Tu seras le seul à le penser aujourd’hui.',
    res:{ r:`Tu les rappelles au nom du légat, devant six mille hommes. Ils obéissent en te haïssant. Le camp te trouve mesquin et Quintus Cicéron te trouve solide.`, e:{disciplina:9, gratia:10, auctoritas:-8} } }
  ]},

{ t:'Le message', lieu:'Camp assiégé, neuvième jour',
  x:`Il faut prévenir César, à cent milles. Tous les messagers envoyés ont été pris et torturés en vue du rempart. Un cavalier nervien à notre solde propose d’essayer, avec la lettre roulée dans la courroie de son javelot.`,
  nota:`César rapporte que la lettre fut écrite en caractères grecs pour être illisible aux Gaulois si elle était prise, et que le javelot resta fiché deux jours dans une tour avant qu’on le remarque.`,
  o:[
  { t:'Payer le Nervien sur ta propre bourse et le lâcher de nuit',
    res:{ r:`Il passe. Le javelot arrivera fiché dans une tour du camp de César, où il restera deux jours avant qu’on le remarque. Mais il arrivera.`, e:{gratia:11, auctoritas:6, peculium:-200} } },
  { t:'Écrire la lettre en caractères grecs',
    need:{ s:'scientia', min:48 },
    res:{ r:`Du latin transcrit en lettres grecques : illisible pour un Gaulois qui lit le latin, immédiat pour un Romain lettré. La précaution paraît mineure jusqu’au jour où elle ne l’est plus.`, e:{scientia:9, gratia:8} } },
  { t:'Sortir toi-même de nuit avec la lettre',
    check:{ s:'virtus', dc:68 },
    ok:{ r:`Trois nuits à travers les Ardennes, dans un manteau gaulois, en évitant les feux. Quand tu arrives, César lit la lettre debout et fait sonner le départ dans l’heure.`, e:{virtus:9, scientia:6, gratia:16, auctoritas:8, valetudo:-10} },
    ko:{ r:`Tu es repéré au deuxième jour et tu passes une semaine à ramper vers le camp le plus proche, sans lettre et sans bottes.`, e:{valetudo:-14, gratia:-5, vulnus:1} } }
  ]},

{ t:'Le pays offert au pillage', lieu:'Forêt des Ardennes',
  x:`César a fait proclamer que le pays des Éburons est ouvert à qui veut. Des Gaulois, des Germains, des marchands, des gens sans nom affluent pour piller.<br><br>Ce n’est pas une guerre, c’est une battue. On brûle les fermes, on coupe le blé sur pied, on comble les puits. Ambiorix s’échappe toujours, avec quatre cavaliers.`,
  nota:`César écrit vouloir que la nation des Éburons cesse d’exister. C’est l’un des rares passages où il décrit une politique d’extermination délibérée. Ambiorix ne fut jamais pris.`,
  o:[
  { t:'Participer aux colonnes de destruction',
    res:{ r:`Méthodique, et ce n’est pas la guerre. Le butin est maigre : il n’y a plus rien à prendre chez des gens qu’on a déjà pris.`, e:{disciplina:3, peculium:180, auctoritas:-6, valetudo:-2} } },
  { t:'Rester au camp et renforcer la garde',
    note:'Un camp à demi vide au milieu d’un pays qu’on saccage est une cible.',
    res:{ r:`Deux mille Sugambres se présentent devant Atuatuca. Le rempart est garni parce que tu l’as voulu. Le vieux primipile Baculus, malade au lit depuis cinq jours, se lève pour tenir la porte et te dit deux mots que tu répéteras toute ta vie.`, e:{scientia:8, virtus:5, gratia:9, auctoritas:7} } },
  { t:'Racheter des captifs aux pillards pour les revendre',
    check:{ s:'gratia', dc:56 },
    ok:{ r:`Tu achètes bas à des Germains pressés et tu revends haut aux marchands qui remontent vers le Rhin. C’est laid et c’est très rentable.`, e:{peculium:700, auctoritas:-6} },
    ko:{ r:`Les Germains te reprennent la marchandise et ton argent à trois milles du camp. Tu rentres à pied.`, e:{peculium:-300, valetudo:-6} } }
  ]},

{ t:'Carrhes', lieu:'Quartiers d’hiver, Gaule du Nord',
  x:`La nouvelle est arrivée de Syrie avec deux mois de retard. Crassus, sept légions, anéanties par les archers parthes. Trente mille Romains. On dit qu’ils ont coulé de l’or fondu dans la bouche du triumvir.<br><br>Ils étaient trois à se partager le monde. Ils ne sont plus que deux, et il n’y a plus rien entre eux.`,
  nota:`Carrhes, juin 53. Julia, fille de César et femme de Pompée, était morte en couches l’année précédente. Avec Crassus disparaît le dernier arbitre, et avec Julia le dernier lien de famille.`,
  o:[
  { t:'Écouter ce qui se dit au camp',
    res:{ r:`Les vétérans disent que cela finira mal et qu’ils suivront César. Les jeunes tribuns de bonne famille disent le contraire, à voix basse. Tu sais désormais qui pense quoi.`, e:{scientia:7, gratia:3} } },
  { t:'Dire tout haut que tu sers la République, pas un homme',
    note:'C’est courageux. Cela se répétera, et déformé.',
    res:{ r:`Tu le dis sans provocation, devant des gens qui ne pensent pas comme toi. On te respecte pour la franchise et l’on te classe.`, e:{disciplina:6, auctoritas:8, gratia:-9}, lien:{labienus:2} } },
  { t:'Dire simplement que tu sers César',
    res:{ r:`La moitié du camp pense pareil et l’autre moitié le pense sans le dire. Ton nom monte d’un cran sur une liste que tu ne verras jamais.`, e:{gratia:11, auctoritas:3}, lien:{caesar:2} } }
  ]}
]},

/* ==================== VI. VERCINGETORIX ==================== */
{
id:'vercingetorix', n:'Vercingetorix', sub:'Toute la Gaule se lève', y0:-52, y1:-52, len:7,
events:[

{ at:0, t:'Avaricum', lieu:'Oppidum des Bituriges', guerre:true,
  x:`Un jeune Arverne a compris ce qu’aucun n’avait compris : ne pas nous livrer bataille, brûler devant nous. Vingt villes des Bituriges ont brûlé en un jour, par la main de leurs habitants.<br><br>Ils ont supplié d’épargner Avaricum. Nous sommes devant, dans la boue, à la ration de vingt jours qui en dure quarante. La terrasse monte : vingt-cinq pieds de haut, trois cents de large.`,
  vue:{ soldat:'Tu portes des fascines depuis trois semaines. Pas de pain depuis dix jours.',
        sousoff:'Tes hommes tiennent par habitude. Ils ne se plaignent pas, et c’est mauvais signe.',
        centurion:'Tu peux exiger le double de travail, ou les ménager pour l’assaut.',
        superieur:'César a proposé de lever le siège. Les légions ont supplié qu’on n’en fasse rien.' },
  nota:`Le <span class="lat">murus gallicus</span> — poutres croisées, pierres et terre, cloué de fiches de fer — résistait au bélier parce que le bois amortissait, et au feu parce que la pierre protégeait. La seule réponse romaine était la terrasse. César dit que ses hommes refusèrent qu’on levât le siège plutôt que de perdre l’honneur.`,
  o:[
  { t:'Pousser le travail sans relâche',
    res:{ r:`La terrasse monte de dix pieds en trois jours. Les hommes dorment sur le chantier, en armes, et il faut les enjamber pour circuler.`, e:{disciplina:8, gratia:6, valetudo:-6} } },
  { t:'Aller chercher du grain dans la campagne brûlée',
    check:{ s:'scientia', dc:58 },
    ok:{ r:`Tu trouves des silos enterrés que les Bituriges avaient oubliés. Deux jours de blé pour la légion, et un nom que les hommes retiennent.`, e:{scientia:8, auctoritas:12, valetudo:4} },
    ko:{ r:`Quarante milles de cendres, deux hommes perdus à la cavalerie gauloise, et le retour à vide devant des gens qui espéraient.`, e:{auctoritas:-8, valetudo:-7} } },
  { t:'Contre-miner leurs galeries',
    p:'centurion', need:{ s:'scientia', min:52 },
    res:{ r:`Tu fais creuser à leur rencontre et l’on se bat sous terre, à la lampe, au couteau, dans un boyau où deux hommes ne passent pas de front. La terrasse cesse de s’affaisser.`, e:{scientia:11, virtus:6, gratia:8, valetudo:-5} } }
  ]},

{ at:1, t:'La nuit du feu', lieu:'Terrasse d’Avaricum', guerre:true,
  x:`Vers minuit, une fumée sort de la terrasse : ils l’ont minée et enflammée par-dessous. Au même instant, ils sortent des deux portes.<br><br>Un Gaulois, debout devant la porte, reçoit les boules de suif que la foule lui passe et les jette au feu. Un trait le tue. Un autre prend sa place sur son corps. Puis un autre.`,
  vue:{ soldat:'La terrasse brûle sous tes pieds.',
        sousoff:'La tour de siège de ta centurie est en flammes.',
        centurion:'Sauver l’ouvrage, ou sauver les hommes.',
        superieur:'Vingt-cinq jours de travail brûlent, et les légions arrivent en désordre.' },
  nota:`César décrit ces hommes se relayant devant la porte comme un spectacle qu’il juge digne d’être rapporté, bien qu’il s’agisse d’ennemis. C’est l’un des rares moments d’admiration explicite des <span class="lat">Commentarii</span>.`,
  o:[
  { t:'Sauver l’ouvrage à tout prix',
    note:'Toute la nuit, à découvert, contre le feu et les Gaulois à la fois.',
    res:{ r:`Au matin la terrasse tient encore et il n’y a plus de nuit à donner. Tu as les mains brûlées jusqu’aux poignets.`, e:{virtus:8, disciplina:6, gratia:9, valetudo:-9} } },
  { t:'Retirer les hommes, laisser brûler, reconstruire demain',
    res:{ r:`Tu décroches proprement. On perd trois jours de terrasse et pas un homme. Le lendemain, elle remonte plus vite qu’elle n’avait monté.`, e:{auctoritas:9, scientia:4, gratia:-4} } },
  { t:'Monter dans la première vague quand l’assaut vient, sous la pluie',
    check:{ s:'virtus', dc:62 },
    ok:{ r:`Le vingt-septième jour, une averse : les gardes se sont abrités. Tu es sur le parapet avant qu’ils comprennent. La récompense est réelle, et la nuit qui suit ne l’est pas moins.`, e:{virtus:9, gratia:8, peculium:400, valetudo:-6} },
    ko:{ r:`L’échelle bascule. Tu tombes de douze pieds sur des pierres, avec ton bouclier sur la figure.`, e:{valetudo:-12, vulnus:1} } }
  ]},

{ at:2, t:'Gergovie', lieu:'Plateau arverne', guerre:true,
  x:`César monte une démonstration pour prendre le camp gaulois du flanc, avec <strong>ordre formel de ne pas aller plus loin</strong>. Le camp est pris presque sans coup férir.<br><br>Puis l’élan emporte tout : trois cohortes continuent de monter vers le mur de la ville.`,
  vue:{ soldat:'Tu montes dans un chemin creux, courbé, depuis une heure.',
        sousoff:'Le camp gaulois est devant, presque vide. Et la pente continue.',
        centurion:'L’ordre est clair : prendre le camp et s’arrêter là.',
        superieur:'La feinte a marché au-delà du calcul. C’est exactement le moment dangereux.' },
  nota:`Seule défaite ouverte de César en Gaule : sept cents morts, dont quarante-six centurions. Le centurion Lucius Fabius atteignit le parapet en criant qu’il aurait la couronne murale ; il y monta et n’en redescendit pas. César blâma publiquement l’indiscipline de ses hommes, puis, voyant l’effet, les consola de leur courage.`,
  o:[
  { t:'Prendre le camp et t’arrêter, comme ordonné',
    check:{ s:'disciplina', dc:60 },
    ok:{ r:`Tu tiens tes hommes sur la ligne exacte que César a désignée pendant que les cohortes voisines montent vers le mur. Demain, on comptera quarante-six centurions morts, et aucun n’est à toi.`, e:{disciplina:10, auctoritas:8, gratia:12} },
    ko:{ r:`Le camp pris, l’élan emporte tout. Tes hommes sont déjà cinquante pas plus haut quand tu cries de t’arrêter.`, e:{auctoritas:-7, valetudo:-8, gratia:-6} } },
  { t:'Monter vers le mur avec les autres',
    note:'Contre les ordres. On monte, on ne redescend pas tous.',
    res:{ r:`Tu montes. Un centurion atteint le parapet et crie qu’il aura la couronne murale ; il n’en redescendra pas. Toi si, avec une gloire douteuse et le nom dans le mauvais rapport.`, e:{virtus:7, auctoritas:5, gratia:-12, valetudo:-12, vulnus:1} } },
  { t:'Faire sonner la retraite pour ton secteur avant l’ordre général',
    p:'centurion',
    res:{ r:`Les hommes t’en veulent une heure et te bénissent le lendemain. Tu es de ceux qui ramènent leur monde.`, e:{auctoritas:11, scientia:6, gratia:9} } },
  { t:'Tenir un point d’appui pour couvrir la descente des autres',
    p:'sousoff',
    note:'Trois cohortes passeront derrière toi. Tu paieras le passage.',
    res:{ r:`Tu tiens un rocher avec vingt hommes pendant que trois cohortes refluent derrière toi. Vous en descendez neuf. Ceux qui sont passés savent ce qu’ils te doivent, et le disent — c’est ainsi qu’on devient quelqu’un dans une légion.`, e:{virtus:11, auctoritas:16, gratia:8, valetudo:-14, vulnus:1} } }
  ]},

{ t:'Après Gergovie', lieu:'Camp arverne',
  x:`Sept cents morts, dont quarante-six centurions. César rassemble l’armée et fait un discours qui blâme les hommes pour leur indiscipline — puis, voyant l’effet, les console de leur courage.<br><br>Il y a des places vides partout.`,
  nota:`Le nombre de centurions tombés — quarante-six — dit où se tenaient les centurions dans un assaut romain : au premier rang, à droite. Le taux de pertes des officiers de rang était structurellement supérieur à celui des hommes.`,
  o:[
  { t:'Prendre publiquement ta part de la faute',
    res:{ r:`Tu dis devant les hommes que l’ordre était clair et que tu ne l’as pas fait respecter assez fort. Personne n’attendait cela. C’est le genre de phrase qui fait qu’on te suivra à Alésia.`, e:{auctoritas:12, gratia:6} } },
  { t:'Te taire et remettre l’unité au travail',
    res:{ r:`Exercice, fossé, inspection d’armes. Au bout de quatre jours les hommes ont autre chose en tête. C’est la vieille méthode et elle fonctionne.`, e:{disciplina:8, auctoritas:-4, valetudo:-2} } },
  { t:'Présenter à César trois de tes meilleurs hommes pour les places vides',
    p:'sousoff',
    note:'Le moment est cynique et il ne reviendra pas.',
    res:{ r:`Tu donnes trois noms avec leurs états de service, sans un mot sur toi. César en promeut deux sur-le-champ. Tu viens de te faire deux centurions qui te doivent tout.`, e:{gratia:10, auctoritas:11, scientia:3} } }
  ]},

{ at:4, t:'Alésia — les lignes', lieu:'Oppidum des Mandubiens', guerre:true,
  x:`Onze milles de contrevallation vers l’intérieur, quatorze de circonvallation vers l’extérieur. Deux fossés dont l’un noyé. Des <span class="lat">cippi</span>, des <span class="lat">lilia</span>, des <span class="lat">stimuli</span> — pieux ferrés cachés sous la terre battue. Vingt-trois redoutes.<br><br>Quatre-vingt mille hommes enfermés dedans. Une armée de secours qu’on annonce à un quart de million derrière nous. Et nous entre les deux, sur une bande de terre de nos propres mains.`,
  vue:{ soldat:'Tu creuses depuis cinq semaines. Tes mains ne se ferment plus complètement.',
        sousoff:'Ta centurie garde vingt pas de rempart, dos à dos.',
        centurion:'Ta cohorte est étirée sur deux cents pas. Il n’y a pas de réserve.',
        superieur:'Labienus tient un secteur, Antoine l’autre. La réserve mobile est de six cohortes pour tout le dispositif.' },
  nota:`Les fouilles de Napoléon III puis les campagnes des années 1990 ont retrouvé les fossés, les trous de <span class="lat">lilia</span> et des <span class="lat">stimuli</span> de fer, confirmant la description de César presque pièce par pièce — un cas rare de texte antique validé par l’archéologie.`,
  o:[
  { t:'Creuser, et creuser encore',
    res:{ r:`Cinq semaines de terrassement pour vingt-cinq milles d’ouvrages. Aucune bataille de l’Antiquité n’a été gagnée à la pelle à ce point.`, e:{disciplina:9, scientia:5, valetudo:-6} } },
  { t:'Dégarnir la face intérieure pour renforcer l’extérieure',
    p:'sousoff', need:{ s:'scientia', min:54 },
    res:{ r:`Tu paries que Vercingétorix mettra une heure à combler ses propres pièges, et tu joues l’heure. Le pari est bon : la face extérieure tient parce que tu l’as doublée.`, e:{scientia:12, auctoritas:8, gratia:10, valetudo:-3} } },
  { t:'Faire passer de l’eau aux Mandubiens chassés entre les deux lignes',
    note:'Vercingétorix les a chassés. César refuse de les prendre. Ils meurent entre nous.',
    res:{ r:`Des outres roulées dans le fossé, la nuit, par deux hommes sûrs. Cela ne sauve personne, en toute rigueur. Tes hommes t’ont vu le faire.`, e:{auctoritas:12, gratia:-7} } },
  { t:'Déplacer ton secteur de travail hors de vue des Mandubiens',
    p:'centurion',
    note:'Ce n’est pas de la pitié. Un homme qui regarde cela dix jours ne se bat pas pareil.',
    res:{ r:`Tu changes ton chantier de côté. C’est de la conservation d’effectif et personne n’a besoin de savoir que tu y as pensé autrement.`, e:{auctoritas:8, scientia:6, disciplina:3} } }
  ]},

{ at:5, t:'Le mont Réa', lieu:'Camp nord, Alésia', guerre:true,
  x:`Ils ont trouvé le point faible : un camp au nord, sur une pente que le terrain empêche d’enfermer proprement. Soixante mille hommes triés y montent à couvert et attaquent à midi.<br><br>La <span class="lat">testudo</span> gauloise avance sous les traits ; ils démantèlent le rempart à mains nues.`,
  vue:{ soldat:'Le rempart s’écroule à dix pas sur ta gauche.',
        sousoff:'Les hommes du camp voisin refluent à travers ta position.',
        centurion:'Le secteur nord va tomber. C’est une question de minutes.',
        superieur:'César envoie Labienus avec six cohortes et l’ordre de tenir, ou de sortir s’il ne peut plus tenir.' },
  nota:`César descendit en personne, reconnaissable à son <span class="lat">paludamentum</span> écarlate qu’il portait au combat pour être vu de loin. La cavalerie germaine à sa solde sortit par une porte dérobée et prit l’armée de secours à revers. Soixante-quatorze enseignes gauloises furent ramassées sur le champ.`,
  o:[
  { t:'Boucher la brèche avec ce que tu as sous la main',
    note:'Blessés, valets, toi. Dix minutes de plus que ce n’aurait dû tenir.',
    res:{ r:`Ça tient dix minutes de plus que cela n’aurait dû, et ces dix minutes-là décident du siège. Tu ne peux plus lever le bras droit quand la relève arrive.`, e:{virtus:12, auctoritas:14, gratia:13, valetudo:-13, vulnus:1} } },
  { t:'Décrocher du camp et te reformer en rase campagne',
    p:'centurion', need:{ s:'scientia', min:56 },
    res:{ r:`Tu abandonnes le camp et tu ramasses en te repliant tout ce qui traîne de cohortes. En rase campagne, avec un front, la légion redevient la légion — et ce sont eux qui sont mal placés. C’est ce que Labienus fait au même moment, avec trente-neuf cohortes.`, e:{scientia:12, auctoritas:10, gratia:12, valetudo:-6} } },
  { t:'Tenir ta position exacte quoi qu’il arrive à côté',
    check:{ s:'disciplina', dc:64 },
