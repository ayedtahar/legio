    ok:{ r:`Tu ne bouges pas d’un pouce. Le flot passe à côté de toi et te laisse sur une île. Quand la contre-attaque arrive, ton îlot est le point d’appui dont elle avait besoin.`, e:{disciplina:10, virtus:7, gratia:8, valetudo:-7} },
    ko:{ r:`Tenir sans appui, c’est être enveloppé. Tu combats sur quatre côtés pendant vingt minutes.`, e:{valetudo:-15, vulnus:1, auctoritas:-4} } }
  ]},

{ t:'La reddition', lieu:'Devant le tribunal de César',
  x:`Vercingétorix convoque son conseil et dit qu’il n’a pas fait cette guerre pour lui mais pour la liberté commune. Il sort à cheval, en armes de parade, fait le tour du tribunal et met bas ses armes aux pieds de César, sans un mot.<br><br>Chaque légionnaire recevra un captif.`,
  nota:`Il resta six ans dans une cellule du Tullianum avant d’être étranglé après le triomphe de 46. César rendit les captifs éduens et arvernes sans rançon, pour raison politique : il lui fallait ces deux peuples tranquilles derrière lui.`,
  o:[
  { t:'Prendre ta part de captifs et la vendre',
    res:{ r:`Un homme, un captif. Les marchands qui suivent l’armée achètent au prix du bétail. Ta part est faite.`, e:{peculium:700, auctoritas:-3} } },
  { t:'Rendre ton captif à son peuple',
    note:'Aucun avantage. Sept cents deniers perdus.',
    res:{ r:`Tu le renvoies chez les Mandubiens. Le geste ne coûte qu’à toi, et deux de tes hommes font la même chose sans rien dire.`, e:{auctoritas:11, scientia:3} } },
  { t:'Demander la garde du captif Vercingétorix jusqu’en Cisalpine',
    p:'centurion',
    check:{ s:'gratia', dc:70 },
    ok:{ r:`Six semaines de route avec un homme qui a failli renvoyer Rome au-delà des Alpes, et qui ne dit presque rien. Tu apprends sur la guerre des choses qu’aucun manuel ne contient.`, e:{scientia:13, gratia:8, auctoritas:5} },
    ko:{ r:`La mission est donnée à un tribun de meilleure naissance. On te remercie de ta proposition.`, e:{gratia:-3} } }
  ]}
]},

/* ===== src2/data-phases-3.js ===== */
/* ==================== VII. FINIS GALLIAE ==================== */
{
id:'finis', n:'Finis Galliae', sub:'La fin de la Gaule, et l’attente', y0:-51, y1:-50, len:5,
events:[

{ at:0, t:'Uxellodunum', lieu:'Oppidum des Cadurques', guerre:true,
  x:`Le dernier oppidum qui résiste, sur un roc entouré par une rivière, imprenable d’assaut. César décide de lui couper l’eau : galeries de sappe pour capter la source, tours pour interdire la descente.<br><br>Ce n’est plus de la guerre, c’est de l’hydraulique.`,
  vue:{ soldat:'Tu es au fond d’une galerie, à la chandelle, à passer des paniers de terre.',
        sousoff:'Tes hommes travaillent en trois relèves. Ils toussent tous.',
        centurion:'Tes ouvrages brûlent deux nuits sur trois.',
        superieur:'Leur source contre notre patience. Le calcul est simple.' },
  nota:`La source tarit au trentième jour. Les assiégés y virent un signe des dieux et se rendirent — César note que le tarissement fit plus que le bélier. Il fit ensuite couper les mains à tous ceux qui avaient porté les armes, et les renvoya vivants.`,
  o:[
  { t:'Pousser les galeries jour et nuit',
    res:{ r:`La source tarit d’un coup, au trentième jour. Les assiégés y voient un signe des dieux, ce qui est plus efficace qu’un bélier.`, e:{disciplina:7, scientia:7, gratia:7, valetudo:-5} } },
  { t:'Garder les ouvrages contre les sorties nocturnes',
    check:{ s:'virtus', dc:60 },
    ok:{ r:`Trois sorties repoussées en cinq nuits. Les ouvrages tiennent debout et la sappe continue sans perdre un jour.`, e:{virtus:7, disciplina:5, gratia:6, valetudo:-4} },
    ko:{ r:`Ils enflamment une tour et une galerie dans la même nuit. On repart de deux semaines en arrière.`, e:{gratia:-7, valetudo:-7} } },
  { t:'Faire épargner les plus jeunes en les déclarant non-combattants',
    p:'sousoff',
    note:'Une liste où quarante garçons deviennent porteurs d’eau. Le questeur signera sans lire.',
    res:{ r:`Il signe sans lire. Personne ne le saura jamais, sauf eux. Ce que tu vois se faire aux autres, ce jour-là, tu ne le raconteras à personne.`, e:{auctoritas:10, scientia:4, gratia:-5, valetudo:-2} } }
  ]},

{ t:'Deux cents sesterces par homme', lieu:'Quartiers d’hiver, Belgique',
  x:`Après quarante jours de raid hivernal, César fait distribuer une gratification sur sa cassette personnelle : deux cents sesterces par légionnaire, deux mille par centurion.<br><br>Il paie de sa bourse. Personne n’a l’air de trouver cela étrange.`,
  nota:`César doubla la solde légionnaire et distribua constamment des primes personnelles. Le Sénat le lui reprochait comme une captation d’armée publique ; c’était exactement cela, et l’armée n’y voyait qu’un général qui payait.`,
  o:[
  { t:'Prendre l’argent',
    res:{ r:`C’est de l’argent. Il vient d’un homme et non de la République, et personne au camp ne fait la différence — ce qui est précisément le sujet.`, e:{peculium:400, gratia:4} } },
  { t:'Redistribuer ta part à tes hommes au prorata des années de service',
    p:'sousoff',
    res:{ r:`Ils ne l’oublieront pas. Tu viens de construire quelque chose qui ne s’achète pas, en l’achetant.`, e:{auctoritas:16, gratia:3, peculium:-400} } },
  { t:'Placer la somme en terre par ton correspondant d’Italie',
    res:{ r:`Un lopin près de Capoue, acheté au bon moment. Dans dix ans, il vaudra trois fois cela.`, e:{peculium:250, scientia:4} } }
  ]},

{ t:'Deux légions rendues', lieu:'Cisalpine, quartiers de Ravenne',
  x:`Le Sénat a exigé deux légions pour la guerre parthe : une de Pompée, une de César. Pompée a réclamé celle qu’il avait prêtée en 53. César a donc rendu deux légions — et donné à chaque homme deux cent cinquante deniers avant le départ.<br><br>Les deux légions n’ont jamais vu la Parthie. Elles sont en Italie, sous Pompée.`,
  nota:`Le procédé fut décisif : ces deux légions, interrogées par Pompée, lui assurèrent que les troupes de César l’abandonneraient au premier signal. Elles se trompaient, et Pompée les crut.`,
  o:[
  { t:'Regarder partir des hommes que tu connais depuis huit ans',
    res:{ r:`On se serre le bras sans rien dire. Dans dix-huit mois, certains seront en face, à Ilerda ou en Épire.`, e:{auctoritas:5, valetudo:-2, scientia:4} } },
  { t:'Te faire une idée précise de qui, dans le camp, penche de quel côté',
    check:{ s:'scientia', dc:60 },
    ok:{ r:`Tu dresses mentalement une liste. Elle sera exacte à deux noms près, et elle te servira dans un an.`, e:{scientia:9, gratia:5} },
    ko:{ r:`Tu te trompes sur les trois quarts. Les gens ne penchent pas où ils le disent.`, e:{scientia:3, gratia:-4} } },
  { t:'Ne t’occuper que de ton unité et de rien d’autre',
    res:{ r:`Exercice, comptes, équipement. La politique est le métier des autres, et tu as le tien.`, e:{disciplina:8, auctoritas:6} } }
  ]},

{ t:'Une armée qui n’a rien à faire', lieu:'Camp de Cisalpine',
  x:`Neuf mois sans campagne. Les hommes jouent, boivent, s’endettent, se battent. La solde arrive régulièrement, ce qui n’arrange rien.`,
  nota:`L’oisiveté était tenue pour le pire danger d’une armée romaine. Les manuels recommandaient de faire construire des routes ou creuser des canaux plutôt que de laisser les légions inoccupées.`,
  o:[
  { t:'Maintenir l’exercice et la discipline coûte que coûte',
    res:{ r:`Marche hebdomadaire, inspection d’armes. On te trouve pénible. En janvier, quand il faudra faire soixante milles en trois jours, on ne te trouvera plus pénible.`, e:{disciplina:9, auctoritas:5, valetudo:-3} } },
  { t:'Tenir les comptes de tes hommes et racheter leurs dettes usuraires',
    res:{ r:`Tu casses un tripot et rachètes deux créances. Tes hommes sont mous et solidaires, ce qui n’est pas le pire des états.`, e:{auctoritas:13, peculium:-250} } },
  { t:'Dîner chez les notables des municipes du Pô',
    res:{ r:`Ils adorent recevoir un officier de César. Tu en tires des créances, une clientèle, et peut-être un mariage.`, e:{gratia:12, peculium:400, disciplina:-4} } }
  ]},

{ at:4, t:'La nuit de Ravenne', lieu:'Ravenne, janvier',
  x:`Le sept janvier, le Sénat a voté le <span class="lat">senatus consultum ultimum</span>. Les tribuns Antoine et Cassius ont fui Rome déguisés en esclaves et sont arrivés dans une charrette louée.<br><br>César n’a ici qu’une légion : la tienne. Il donne des jeux, dîne longuement, et sort de table.`,
  nota:`Suétone rapporte qu’il quitta le banquet en disant qu’il revenait, et partit en voiture louée par des chemins détournés, se perdant même dans la nuit avant de retrouver la route du Rubicon.`,
  o:[
  { t:'Préparer ton unité au départ sans poser de question',
    res:{ r:`Cinq jours de vivres, armes vérifiées, chariots chargés. Tu ne demandes rien à personne. C’est exactement ce qu’on attend de toi cette nuit-là.`, e:{disciplina:8, gratia:9} } },
  { t:'Sonder les hommes sur ce qu’ils feront s’il faut passer en Italie',
    check:{ s:'auctoritas', dc:64 },
    ok:{ r:`Tu prends le pouls, tente par tente. La réponse est unanime et n’a rien de politique : ils suivront César parce qu’ils suivent César. Tu sauras au moins sur quoi tu comptes.`, e:{auctoritas:9, scientia:5} },
    ko:{ r:`La question elle-même sème le doute. Deux hommes se mettent à parler de désertion, alors qu’ils n’y pensaient pas avant que tu poses la question.`, e:{auctoritas:-9, disciplina:-4} } },
  { t:'Refaire ton testament et le déposer chez le signifer',
    res:{ r:`Comme tout légionnaire. Tu le refais ce soir-là plus soigneusement que d’habitude, et tu y penses en le scellant.`, e:{scientia:4, valetudo:4} } }
  ]}
]},

/* ==================== VIII. RVBICO ==================== */
{
id:'rubico', n:'Rubico', sub:'La guerre civile', y0:-49, y1:-48, len:7,
events:[

{ at:0, t:'Le Rubicon', lieu:'Frontière de l’Italie', decisif:true,
  x:`Un ruisseau. On le passe à gué sans se mouiller les genoux. De l’autre côté, ce n’est plus la province : c’est l’Italie, où nul proconsul n’entre en armes.<br><br>Il est resté longtemps sur la rive à ne rien dire. Puis il s’est tourné vers vous : on pouvait encore reculer, mais une fois ce petit pont franchi, tout se réglerait par les armes.<br><br><span class="lat">Alea iacta est.</span> Et il est entré dans l’eau.`,
  nota:`Franchir en armes le <span class="lat">pomerium</span> provincial était un crime capital pour un proconsul et pour chaque homme qui le suivait. César laissa partir sans représailles ceux qui refusèrent — le geste servait sa cause dans l’opinion autant que sa clémence.`,
  o:[
  { t:'Passer le gué derrière lui',
    res:{ r:`Il n’y a pas eu de délibération : il y a eu un homme qui entre dans l’eau et une légion qui entre derrière lui. Ce que tu es devenu ce jour-là, tu mettras des années à le nommer.`, e:{gratia:14, virtus:4, auctoritas:6}, choix:'caesar' } },
  { t:'Refuser de porter les armes contre Rome et passer à Pompée',
    note:'Tu quittes tout : ta légion, tes hommes, ta faveur. Labienus partira le lendemain.',
    res:{ r:`Tu rends ton baudrier au tribun de service et tu dis pourquoi. On ne te retient pas. Tu gagnes Brindes à pied. Labienus, lui, part le lendemain avec sa maison et son trésor.`, e:{virtus:7, auctoritas:8, gratia:-40}, choix:'pompee' } },
  { t:'Demander ton congé et rentrer chez toi',
    note:'La carrière s’arrête ici. Tu es vivant et tu as ta solde.',
    res:{ r:`Tu invoques tes années de service et tes blessures. Le tribun regarde ton dossier, ne discute pas, et signe. Tu quittes le camp par la porte décumane, à pied. Personne ne te salue et personne ne t’insulte.`, e:{}, choix:'missio' } }
  ]},

{ t:'Ilerda', lieu:'Sicoris, Hispanie citérieure', guerre:true,
  x:`<em>« Je vais combattre une armée sans chef, pour aller ensuite combattre un chef sans armée. »</em><br><br>Ce n’est pas une guerre de batailles : c’est une guerre de ponts, de gués et de blé. Une crue emporte nos deux ponts et l’armée est prise entre deux rivières, sans vivres. À Rome, on annonce déjà César perdu.`,
  vue:{ soldat:'Un modius de blé se vend cinquante deniers. Il n’y en a plus à vendre.',
        sousoff:'Tes hommes mangent une racine qu’ils font bouillir.',
        centurion:'Retraverser, ou mourir de faim entre deux fleuves.',
        superieur:'Un pont à vingt-deux milles en amont, ou des barques de coracle bâties sur le modèle breton.' },
  nota:`César fit construire des barques d’osier tressé tendu de peaux, sur le modèle breton, transportables sur chariot. Il fit aussi creuser des dérivations pour abaisser le fleuve. Ilerda se termina par une capitulation sans bataille : il licencia les cinq légions pompéiennes sans exiger de serment.`,
  o:[
  { t:'Bâtir des barques d’osier et de cuir, à la mode bretonne',
    need:{ s:'scientia', min:50 },
    res:{ r:`Coques d’osier tressé tendues de peaux, portables sur chariot. On passe une brigade la nuit, on tient une tête de pont, le pont se bâtit dessus. Six ans de Bretagne servent enfin à quelque chose.`, e:{scientia:11, gratia:10, auctoritas:5} } },
  { t:'Creuser des dérivations pour abaisser le fleuve',
    res:{ r:`Trois canaux de trente pieds. Le fleuve baisse assez pour qu’un gué apparaisse. Les Pompéiens regardent une armée déplacer une rivière et commencent à comprendre à qui ils ont affaire.`, e:{disciplina:8, scientia:7, valetudo:-5} } },
  { t:'Traverser et parler à ceux d’en face',
    res:{ r:`Tu passes une soirée avec des hommes qui t’ont couvert le flanc à Alésia. Vous convenez qu’aucun de vous ne sait pourquoi il est là. Deux jours plus tard, ils se rendent sans un coup de glaive.`, e:{gratia:9, auctoritas:8, scientia:4} } },
  { t:'Renvoyer intacts les Pompéiens trouvés dans notre camp',
    p:'sousoff',
    res:{ r:`Tu les fais raccompagner avec leurs armes pendant que Petreius égorge les nôtres dans son camp. La différence circule dans les deux armées avant le soir. C’est la seule arme qui compte dans cette guerre.`, e:{gratia:12, auctoritas:10, scientia:5} } }
  ]},

{ t:'La décimation de Plaisance', lieu:'Placentia, Cisalpine',
  x:`La Neuvième refuse de marcher. César vient seul devant elle, sans escorte, et annonce qu’il appliquera la lettre du règlement : un homme sur dix, tiré au sort, battu à mort par ses camarades.<br><br>Puis il attend. La légion demande grâce. Il commue en douze exécutions choisies parmi les meneurs.`,
  nota:`L’un des douze, prouvé absent au moment des faits, fut remplacé par le centurion qui l’avait dénoncé à tort. La <span class="lat">decimatio</span> était déjà archaïque à cette date : la menacer suffisait presque toujours.`,
  o:[
  { t:'Soutenir publiquement la sanction',
    res:{ r:`Tu dis devant tes hommes qu’une armée sans discipline est une bande. C’est impopulaire et c’est exact ; ton unité serre les rangs sans t’aimer davantage.`, e:{disciplina:9, gratia:8, auctoritas:-5} } },
  { t:'Intercéder pour un homme de ta connaissance',
    check:{ s:'gratia', dc:64 },
    ok:{ r:`Tu obtiens qu’un nom sorte de la liste, en échange d’un autre que tu n’as pas choisi. C’est un marché atroce et tu l’as fait.`, e:{auctoritas:11, gratia:-4, valetudo:-3} },
    ko:{ r:`On te répond que la liste est close. Elle l’était depuis une heure et l’on t’a laissé demander.`, e:{gratia:-6} } },
  { t:'Te taire',
    res:{ r:`Tu ne dis rien, ni pour ni contre. Douze hommes meurent et l’armée marche.`, e:{disciplina:4, auctoritas:-3} } }
  ]},

{ at:3, t:'Dyrrachium', lieu:'Lignes de siège, Épire', guerre:true,
  x:`Nous assiégeons un adversaire deux fois plus nombreux, ravitaillé par mer, pendant que nous mangeons une racine broyée qu’on appelle <span class="lat">chara</span>. Les Pompéiens en ont jeté des morceaux par-dessus le rempart en riant.<br><br>Deux transfuges ont livré le plan exact de nos lignes et le point de jonction inachevé. Pompée y jette soixante cohortes sur trois faces à la fois.`,
  vue:{ soldat:'Les traits tombent des trois côtés comme de la pluie.',
        sousoff:'Le centurion du fortin a un œil crevé et continue de commander.',
        centurion:'Le fortin est intenable. L’ordre est de tenir.',
        superieur:'Si ce fortin tombe, la ligne entière est prise à revers.' },
  nota:`On ramassa cent vingt trous dans le bouclier du centurion Cassius Scaeva et trente mille traits dans le fortin. César lui donna deux cent mille sesterces et le passa primipile ; les survivants reçurent une double solde. Scaeva mourut de vieillesse.`,
  o:[
  { t:'Tenir le fortin coûte que coûte',
    note:'Il tiendra. Tu n’en sortiras pas entier.',
    res:{ r:`Tu es de ceux qui n’en sont pas sortis en courant. Ton bras gauche restera inutilisable trois mois. César donne une double solde à tous les survivants — toi compris.`, e:{virtus:13, auctoritas:12, gratia:13, peculium:900, valetudo:-14, vulnus:1} } },
  { t:'Faire décrocher la garnison et rétablir la ligne en arrière',
    p:'centurion',
    note:'Militairement juste. Dans une armée, cela porte un nom qu’on t’accolera longtemps.',
    res:{ r:`Tu sacrifies le fortin et tu sauves la garnison sur une seconde ligne improvisée. Ceux que tu as ramenés le savent. Les autres ne retiendront que le fortin perdu.`, e:{scientia:9, auctoritas:9, gratia:-8, valetudo:-4} } },
  { t:'Te mettre en travers de la fuite, enseigne en main',
    check:{ s:'auctoritas', dc:70 },
    ok:{ r:`Tu plantes l’enseigne et tu cries. Trente hommes s’arrêtent, puis cent. César fera la même chose plus loin et se fera bousculer par ses propres soldats ; toi, on t’écoute.`, e:{auctoritas:15, virtus:8, gratia:11, valetudo:-8} },
    ko:{ r:`Le flot te renverse et te piétine. On te relève avec trois côtes cassées et l’enseigne perdue.`, e:{valetudo:-13, auctoritas:-8, vulnus:1} } }
  ]},

{ t:'« S’ils avaient eu quelqu’un pour vaincre »', lieu:'Camp de Dyrrachium',
  x:`Trente-deux enseignes perdues, mille morts — dont trente-deux tribuns et centurions, la plupart écrasés dans la fuite par les leurs.<br><br>César rassemble l’armée et dit cette phrase que tout le camp répétera : <em>« Aujourd’hui la victoire était à l’ennemi, s’ils avaient eu quelqu’un pour vaincre. »</em> Les légions, humiliées, demandent d’elles-mêmes la décimation. Il refuse.`,
  nota:`Pompée ne poursuivit pas. Ses officiers le lui reprochèrent longtemps ; il craignait une embuscade et savait qu’une guerre civile gagnée trop vite se paie politiquement. César leva le camp la nuit même vers la Thessalie.`,
  o:[
  { t:'Assumer devant César pour tes hommes',
    check:{ s:'auctoritas', dc:66 },
    ok:{ r:`Tu dis que la faute est au commandement du secteur, c’est-à-dire à toi. Il te regarde, ne dit rien, et ne te retire rien. Tes hommes ne diront rien non plus, et te suivront à Pharsale comme des chiens.`, e:{auctoritas:14, gratia:6} },
    ko:{ r:`Tu t’accuses trop bien. On te prend au mot : tu descends d’un cran dans l’ordre des cohortes.`, e:{gratia:-9, auctoritas:-6} } },
  { t:'Faire jurer à ton unité de ne pas reculer devant Pompée',
    res:{ r:`Ils jurent devant l’enseigne, à voix basse, sans emphase, comme des gens qui ont l’intention de tenir parole. Ils la tiendront dans trois semaines.`, e:{auctoritas:12, disciplina:6, virtus:4} } },
  { t:'Désigner les fautifs de ton secteur, comme on te le demande',
    res:{ r:`Tu donnes trois noms exacts, sans en ajouter ni en retrancher. On les casse de leur grade et l’on te sait juste, ce qui n’est pas la même chose qu’aimé.`, e:{disciplina:7, gratia:6, auctoritas:-4} } }
  ]},

{ at:5, t:'Pharsale — la quatrième ligne', lieu:'Plaine de l’Énipeus, Thessalie', guerre:true,
  x:`Vingt-deux mille contre quarante-cinq mille, mille cavaliers contre sept mille. Labienus, qui fut neuf ans le premier légat de César et connaît chacune de nos habitudes, a juré de ne revenir au camp que vainqueur.<br><br>César a vu que toute leur cavalerie est massée face à notre droite. Il retire six cohortes de la troisième ligne, les poste en oblique, cachées, avec un ordre singulier : <strong>ne pas lancer le pilum. Le garder en main comme une pique, et pointer au visage.</strong>`,
  vue:{ soldat:'On te retire du rang et on te place en arrière, en biais, sans t’expliquer.',
        sousoff:'Ordre étrange : garder le pilum en main. Viser le visage.',
        centurion:'Ta cohorte fait partie des six. Sept mille cavaliers vont arriver dessus.',
        superieur:'Six cohortes contre sept mille chevaux. Toute la bataille tient là-dessus.' },
  nota:`Ce sont de jeunes nobles romains qui composaient cette cavalerie ; César calcula qu’ils craindraient une cicatrice au visage plus que la mort. Ils tournèrent bride et n’arrêtèrent qu’aux collines. Plutarque rapporte l’ordre presque mot pour mot.`,
  o:[
  { t:'Exécuter l’ordre à la lettre : pilum en main, pointer au visage',
    res:{ r:`Sept mille cavaliers arrivent sur six cohortes qui se lèvent d’un coup et leur portent le fer au visage. Ils tournent bride tous ensemble. La bataille est jouée en quatre minutes, sur une idée.`, e:{disciplina:10, virtus:8, gratia:13, auctoritas:6, valetudo:-5} } },
  { t:'Lancer les pila comme d’habitude et recevoir la charge',
    note:'Ce que tu as toujours fait. Contre de la cavalerie, sans pique.',
    res:{ r:`La volée abat des chevaux, la charge passe quand même, et il faut se battre contre de la cavalerie sans pique. Vous tenez, chèrement, et ce qui devait se briser ne s’est pas brisé.`, e:{virtus:5, gratia:-10, valetudo:-12, vulnus:1} } },
  { t:'Laisser tes hommes s’arrêter d’eux-mêmes à mi-charge pour reprendre haleine',
    p:'sousoff',
    note:'Pompée a ordonné à sa ligne de ne pas bouger. Dix ans de service corrigent son erreur sans qu’on leur parle.',
    res:{ r:`Tu ne dis rien parce qu’il n’y a rien à dire : ils ont raison. C’est une armée qui n’a plus besoin qu’on lui explique, et tu viens de comprendre ce que tu commandes.`, e:{disciplina:9, auctoritas:8, scientia:6} } }
  ]},

{ t:'Le camp de Pompée', lieu:'Après la ligne rompue', guerre:true,
  x:`La troisième ligne fraîche entre au moment où la cavalerie fuit. La ligne pompéienne casse.<br><br>Dans leur camp, on trouve les tentes ornées de myrte, les tables dressées, l’argenterie sortie : ils avaient préparé le banquet de la victoire. Pompée est parti à cheval par la porte arrière.`,
  vue:{ soldat:'Tu entres dans un camp où le repas est servi.',
        sousoff:'Tes hommes se jettent sur les tables plutôt que sur les fuyards.',
        centurion:'Piller le camp, ou poursuivre les légions qui refluent vers la colline.',
        superieur:'Poursuivre maintenant, c’est finir la guerre aujourd’hui.' },
  nota:`César fit crier d’épargner les citoyens. Vingt-quatre mille hommes se rendirent le lendemain sur la colline, coupés de l’eau. Il brûla publiquement la correspondance saisie de Pompée sans la lire — geste qui lui gagna plus de sénateurs que Pharsale.`,
  o:[
  { t:'Poursuivre sans t’arrêter au camp',
    res:{ r:`Tu passes devant les tables sans regarder et tu montes sur la colline. Au matin, vingt-quatre mille hommes se rendent. La guerre pouvait durer trois ans ; elle a duré une après-midi.`, e:{disciplina:10, gratia:12, auctoritas:6, valetudo:-4} } },
  { t:'Piller le camp',
    note:'Tu ne reverras jamais un butin pareil. Et César saura qui a pillé.',
    res:{ r:`La vaisselle des sénateurs de Rome, les coffres, les chevaux.`, e:{peculium:1400, gratia:-8, auctoritas:4} } },
  { t:'Faire épargner et rassembler les prisonniers romains',
    p:'sousoff',
    res:{ r:`Tu tiens tes hommes et tu ramasses les rendus par centaines, désarmés, vivants. Beaucoup serviront sous nos enseignes avant six mois. C’est ainsi que César gagne : il ne détruit pas les armées, il les absorbe.`, e:{auctoritas:12, gratia:13, scientia:5} } },
  { t:'Faire brûler la correspondance saisie sans la lire',
    p:'centurion',
    res:{ r:`Tu fais porter les coffres au feu devant témoins, sans qu’un rouleau soit ouvert. Trente sénateurs t’en seront reconnaissants sans jamais te le dire. Cela vaut mieux que trente ennemis.`, e:{gratia:14, scientia:7, auctoritas:6} } }
  ]}
]},

/* ==================== IX. VLTIMA ==================== */
{
id:'ultima', n:'Ultima', sub:'Alexandrie, l’Afrique, Munda', y0:-47, y1:-45, len:7,
events:[

{ at:0, t:'Trois mille deux cents hommes', lieu:'Alexandrie, quartier du palais',
  x:`Pompée est mort sur une plage égyptienne, la tête coupée par ses propres affranchis. On l’a apportée à César dans un linge ; il a détourné les yeux et pleuré, et personne n’a su la part de chaque chose.<br><br>Puis il s’est mêlé d’une succession dynastique avec deux légions à effectif réduit, dans une ville de trois cent mille habitants. Les Alexandrins ont coupé les aqueducs et pompent l’eau de mer dans les citernes.`,
  nota:`César fit creuser sur toute la longueur du rivage, assurant qu’un sol côtier donne toujours de l’eau douce à faible profondeur. On en trouva à sept pieds. C’est un raisonnement d’ingénieur, appliqué à une panique.`,
  o:[
  { t:'Creuser toute la nuit, secteur par secteur',
    res:{ r:`Une veine d’eau douce à sept pieds, avant l’aube. On boit à genoux dans le sable. Le siège vient de changer de nature parce que quelqu’un a continué de creuser.`, e:{disciplina:8, scientia:6, auctoritas:11, valetudo:-4} } },
  { t:'Fortifier le quartier maison par maison',
    need:{ s:'scientia', min:54 },
    res:{ r:`Carrefours murés, cloisons percées pour circuler sans sortir, terrasses garnies. Une ville se défend comme un camp, à condition de la traiter comme un camp.`, e:{scientia:11, disciplina:6, gratia:9} } },
  { t:'Mettre la main sur les entrepôts du port avant les Alexandrins',
    res:{ r:`Un siège se gagne au grenier. Tu réquisitionnes avant que quiconque y pense.`, e:{scientia:6, auctoritas:9, peculium:200} } }
  ]},

{ t:'Le môle', lieu:'Heptastade, Alexandrie', guerre:true,
  x:`Il faut prendre le môle qui relie le Phare à la ville. On l’enlève, puis les Alexandrins contre-attaquent et la panique prend nos hommes sur une chaussée de trente pas où l’on ne peut ni fuir ni manœuvrer.<br><br>César lui-même doit sauter d’un navire qui coule et gagner le sien à la nage, sur deux cents pas, en tenant ses papiers d’une main hors de l’eau.`,
  vue:{ soldat:'Il y a de l’eau des deux côtés et trente pas de largeur.',
        sousoff:'Les navires qui devaient nous recueillir sont surchargés et coulent.',
        centurion:'Quatre cents hommes vont se noyer si personne ne tient l’extrémité.',
        superieur:'Huit cents morts sur une chaussée. Le pire quart d’heure depuis Gergovie.' },
  nota:`Suétone rapporte que César nagea en tenant ses tablettes hors de l’eau et en tirant son manteau entre les dents pour ne pas le laisser en trophée. Plutarque dit qu’il perdit le manteau.`,
  o:[
  { t:'Tenir l’extrémité du môle pour couvrir le rembarquement',
    note:'Vous serez les derniers à embarquer, à l’eau jusqu’à la ceinture.',
    res:{ r:`Un bouchon de trente hommes en travers de la chaussée pendant que les autres passent. Vous êtes les derniers à embarquer.`, e:{virtus:11, auctoritas:13, gratia:7, valetudo:-10} } },
  { t:'Faire jeter les armes lourdes et nager',
    res:{ r:`Cotte de mailles à la mer, bouclier à la mer, deux cents pas de nage. On perd l’équipement de trois centuries et l’on ramène trois centuries d’hommes.`, e:{scientia:7, auctoritas:10, peculium:-200, valetudo:-5} } },
  { t:'Refuser d’engager sur une chaussée sans issue, et le dire au conseil',
    p:'centurion', need:{ s:'scientia', min:58 },
    res:{ r:`Tu expliques qu’une chaussée de trente pas est un piège quelle que soit la valeur des troupes. On t’écoute à moitié, on engage quand même, mais ta cohorte reste en réserve — et huit cents morts n’en font pas partie.`, e:{scientia:10, auctoritas:11, gratia:4} } }
  ]},

{ at:2, t:'Quirites', lieu:'Campanie, camp d’embarquement', decisif:true,
  x:`Les légions vétéranes refusent d’embarquer pour l’Afrique. Elles réclament le congé, les terres et l’argent promis. Elles ont tué deux sénateurs envoyés pour parlementer et marché sur Rome.<br><br>César arrive seul, monte à la tribune, demande ce qu’elles veulent. Elles crient : le congé. Alors il dit un seul mot : <em>« Quirites. »</em><br><br>Citoyens. Pas « camarades ». Pas « soldats ». Des civils — des gens qui ne sont plus rien pour lui.`,
  nota:`Le mot est rapporté par Suétone, Appien et Dion. La Dixième supplia d’être reprise et de subir la décimation. César refusa la décimation, feignit de céder, et emmena l’armée en Afrique. C’est le sommet documenté de son autorité sur des hommes armés.`,
  o:[
  { t:'Être de ceux qui supplient qu’on les reprenne',
    res:{ r:`Il accepte, en refusant la décimation, et en disant qu’il n’a jamais douté de la Dixième — ce qui est faux et efficace. Tu embarqueras pour l’Afrique.`, e:{auctoritas:8, gratia:12, disciplina:5} } },
  { t:'Prendre la tête de la revendication et négocier',
    note:'Tu obtiendras des garanties réelles. Tu seras désormais un homme qu’on surveille.',
    res:{ r:`Tu formules ce que quinze mille hommes ressentent sans savoir le dire : les terres, les sommes, les délais, par écrit. César traite avec toi parce qu’il vaut mieux traiter avec quelqu’un.`, e:{auctoritas:18, scientia:7, peculium:600, gratia:-14} } },
  { t:'Prendre ton congé maintenant, avec les terres promises',
    note:'Quinze ans de service. Tu sors debout, avec des biens.',
    res:{ r:`Terres en Campanie, prime de démobilisation, quitus. Ce que quatre-vingt-dix hommes sur cent ne font pas.`, e:{peculium:3000}, choix:'missio_riche' } }
  ]},

{ t:'Ruspina', lieu:'Plaine côtière d’Africa', guerre:true,
  x:`Trente cohortes en fourrage, sans cavalerie ou presque. Labienus arrive avec des Numides et des archers montés, et fait ce qu’aucune infanterie ne sait combattre : tourner autour, tirer, refuser le choc, recommencer.<br><br>Il s’avance tête nue et interpelle les nôtres : <em>« Alors, bleus de la Deuxième ? Vous êtes bien féroces ! »</em>`,
  vue:{ soldat:'Tu vois Labienus à quarante pas, sans casque, qui te parle.',
        sousoff:'Un vétéran de ta centurie sort du rang sans qu’on le lui demande.',
        centurion:'Ta cohorte est en anneau, dos à dos, et perd un homme toutes les vingt secondes.',
        superieur:'César fait former un cercle unique et alterner les cohortes face en avant, face en arrière.' },
  nota:`Le <span class="lat">Bellum Africum</span>, écrit par un officier de César, rapporte la réponse : un vétéran ôta son casque pour être reconnu et lui jeta son pilum, tuant son cheval — « pour t’apprendre que c’est un vétéran de la Dixième qui te parle ». Labienus avait formé ces hommes neuf ans durant.`,
  o:[
  { t:'Former le cercle, une file face en avant, une face en arrière',
    res:{ r:`La cohorte devient une roue hérissée des deux côtés. Les Numides ne trouvent plus de dos à tirer. C’est la seule chose qui marche contre eux, et il a fallu la trouver sous les flèches.`, e:{disciplina:11, scientia:8, gratia:9, valetudo:-6} } },
  { t:'Répondre à Labienus',
    check:{ s:'auctoritas', dc:62 },
    ok:{ r:`Toute la ligne éclate de rire, et le rire vaut trois cohortes. Des hommes qui riaient il y a une seconde se remettent à tenir.`, e:{auctoritas:14, virtus:5, gratia:5, valetudo:-4} },
    ko:{ r:`Ta réplique tombe dans le sable. Les hommes autour de toi ont l’air plus vieux qu’il y a une minute.`, e:{auctoritas:-8, valetudo:-6} } },
  { t:'Marcher en carré, blessés au centre, sans accélérer',
    p:'sousoff',
    note:'Deux milles au pas sous le harcèlement. Personne n’est laissé.',
    res:{ r:`Deux milles en carré sans qu’un rang s’ouvre. On rentre avec tous les blessés. Les vieux de Gaule disent que c’est la plus belle chose qu’ils aient faite.`, e:{disciplina:12, auctoritas:15, gratia:7, valetudo:-6} } }
  ]},

{ t:'Thapsus', lieu:'Isthme entre la mer et la lagune', guerre:true,
  x:`César a manœuvré jusqu’à les enfermer sur un isthme où leur nombre et leurs soixante éléphants ne servent à rien.<br><br>Il hésite encore quand un trompette de l’aile droite, poussé par les hommes, sonne la charge de sa propre autorité. Toute la ligne part. Les centurions se jettent devant les enseignes pour retenir les rangs et sont emportés.`,
  vue:{ soldat:'La ligne part sans ordre et tu pars avec.',
        sousoff:'Ton enseigne est déjà à vingt pas devant toi.',
        centurion:'Te jeter devant l’enseigne, ou prendre la tête du mouvement.',
        superieur:'L’armée vient de déclencher elle-même une bataille. Tu peux la conduire ou la subir.' },
  nota:`La Cinquième légion porta l’éléphant sur ses enseignes après cette bataille : un légionnaire en abattit un qui allait piétiner un valet. Le carnage qui suivit — cinq mille rendus massacrés malgré les ordres — est le premier cas où l’armée de César échappa à son général.`,
  o:[
  { t:'Prendre la tête du mouvement et le conduire',
    res:{ r:`Tu ne peux pas l’arrêter, alors tu le diriges : tu cours devant et tu leur donnes une direction. Une charge conduite vaut cent fois une ruée.`, e:{auctoritas:13, virtus:7, gratia:9, valetudo:-5} } },
  { t:'Ouvrir les rangs en couloirs pour laisser passer les éléphants',
    need:{ s:'scientia', min:46 },
    res:{ r:`Les rangs s’ouvrent, la bête passe dans le vide, et douze pointes lui ouvrent les jarrets au passage. La méthode est vieille comme Zama et elle marche encore.`, e:{scientia:9, virtus:5, auctoritas:7, valetudo:-3} } },
  { t:'Tenter d’arrêter le massacre des rendus',
    p:'sousoff',
    check:{ s:'auctoritas', dc:74 },
    ok:{ r:`Tu te mets en travers, tu nommes tes hommes un par un, tu leur rappelles Alésia. Ils s’arrêtent. Deux cents hommes vivront parce que ta voix comptait plus que leur fureur.`, e:{auctoritas:17, gratia:12, virtus:4} },
    ko:{ r:`On te bouscule, on te menace, et un homme de ta propre unité te met la pointe sous le menton avant de te reconnaître. Tu n’oublieras pas cette seconde-là.`, e:{auctoritas:-11, valetudo:-6} } }
  ]},

{ t:'Quatre triomphes', lieu:'Rome, le Champ de Mars',
  x:`Gaule, Égypte, Pont, Afrique. Quarante éléphants portant des flambeaux. Vercingétorix, gardé six ans dans une cellule, marche devant le char, puis on l’étrangle le soir même selon l’usage.<br><br>Chaque légionnaire reçoit cinq mille deniers — vingt ans de solde. Les hommes chantent derrière le char des vers si obscènes que le triomphateur les écoute en souriant, parce que c’est le droit du soldat ce jour-là.`,
  nota:`Vingt-deux mille tables de banquet furent dressées dans la ville. Les tableaux représentant la mort de Caton déplurent au peuple : on pouvait triompher d’étrangers, pas de citoyens. César dut retirer certaines images.`,
  o:[
  { t:'Défiler et prendre l’argent',
    res:{ r:`Tu défiles sur la Voie sacrée, entre des gens qui ne savent rien de la Sambre ni d’Alésia et qui t’acclament quand même. Puis tu touches plus d’argent que ton père n’en a vu dans sa vie.`, e:{peculium:5000, valetudo:8, auctoritas:3} } },
  { t:'Investir immédiatement en terres autour de Capoue',
    res:{ r:`Tu achètes de la terre pendant que les autres achètent du vin. Dans quinze ans tu seras décurion municipal et tes fils seront des gens qu’on salue.`, e:{peculium:2500, scientia:6, gratia:5} } },
  { t:'Chercher les familles de tes morts et leur porter leur part',
    note:'Onze maisons. Dans chacune on te fera asseoir et l’on voudra savoir comment il est mort.',
    res:{ r:`Tu passes ta permission à faire le tour de l’Italie avec une bourse et une liste. Tu racontes onze fois. Tu rentres vidé et entier.`, e:{peculium:-1500, auctoritas:20, gratia:4, valetudo:-3} } }
  ]},

{ at:6, t:'Munda', lieu:'Bétique, sous la colline', guerre:true,
  x:`<em>« J’ai souvent combattu pour la victoire ; aujourd’hui, j’ai combattu pour ma vie. »</em><br><br>Ce ne sont pas des recrues en face : des légions romaines de vétérans, des transfuges, des proscrits qui savent qu’il n’y a pour eux ni pardon ni exil. Ils tiennent la hauteur. Ils n’ont nulle part où aller.<br><br>Les deux armées restent face à face une heure sans qu’un homme bouge. Puis la ligne monte, et s’arrête à mi-pente sans reculer ni avancer. Cela dure des heures.`,
  vue:{ soldat:'Tu pousses depuis deux heures contre un homme qui pousse aussi.',
        sousoff:'Personne ne recule. Personne n’avance. Il n’y a plus de manœuvre.',
        centurion:'Ce n’est plus une bataille, c’est une épreuve de force.',
        superieur:'La Dixième gagne du terrain à droite. Ils y envoient une légion prise à leur droite.' },
  nota:`César mit pied à terre et entra dans le rang avec un bouclier. Trente mille morts, dont Labienus. Sur treize aigles pompéiennes, treize furent prises. Ce fut la dernière bataille de sa vie ; il fut assassiné onze mois plus tard.`,
  o:[
  { t:'Pousser, et tenir, et pousser encore',
    res:{ r:`C’est tout ce que la journée demande et c’est presque plus qu’un homme peut donner. Le rang gagne trois pas en une heure.`, e:{virtus:10, disciplina:8, valetudo:-9} } },
  { t:'Saisir une enseigne et la porter de trois pas en avant',
    note:'Trois pas. La centurie suivra son enseigne. Tu paieras les trois pas.',
    res:{ r:`La centurie suit l’enseigne parce qu’une centurie suit toujours son enseigne, et la ligne entière se décale avec elle. César, qui a mis pied à terre et est entré dans le rang, voit qui a fait cela.`, e:{virtus:12, auctoritas:16, gratia:15, valetudo:-13, vulnus:1} } },
  { t:'Faire relever la première ligne par la deuxième, section par section',
    p:'centurion', need:{ s:'scientia', min:60 },
    res:{ r:`Tu fais tourner les rangs comme une meule : les hommes de devant reculent par les intervalles, les frais prennent leur place. Sur une bataille de poussée, c’est ce qui décide, et presque personne ne sait le faire sous le contact.`, e:{scientia:13, auctoritas:11, gratia:12, valetudo:-7} } },
  { t:'Crier que l’ennemi fuit quand ils déplacent une légion',
    p:'sousoff',
    check:{ s:'auctoritas', dc:70 },
    ok:{ r:`Le cri court des deux côtés de la ligne avec des effets exactement inverses. Leur front, qui tenait depuis huit heures, se persuade en trente secondes qu’il est abandonné — et casse.`, e:{auctoritas:16, gratia:14, scientia:6, valetudo:-6} },
    ko:{ r:`Ton cri est couvert par le bruit. La manœuvre s’achève proprement de leur côté et rien ne change.`, e:{valetudo:-10, auctoritas:-5} } }
  ]}
]}

];

/* ===== src2/data-communs.js ===== */
/* ============================================================
   RÉSERVE — événements de camp, utilisables dans plusieurs chapitres.
   `ch` : chapitres où l'événement peut tomber.
   ============================================================ */
const COMMUNS = [

{ ch:['helvetii','belgae','oceanus','atuatuca'], t:'Les dés sous la tente', lieu:'Tente huit, après l’extinction',
  x:`Le jeu est interdit par le règlement et pratiqué chaque soir. Ce soir la partie est grosse : un vétéran joue trois mois de solde contre un marchand syrien qui suit l’armée et qui n’a pas l’air de perdre souvent.`,
  nota:`Les dés étaient formellement interdits aux légionnaires, sauf pendant les Saturnales. Les graffiti et les dés plombés retrouvés dans les camps montrent l’exacte portée de cette interdiction.`,
  o:[
  { t:'Jouer',
    check:{ s:'gratia', dc:54 },
    ok:{ r:`Tu sors avec le double de ta mise et la réputation de savoir t’arrêter.`, e:{peculium:250, auctoritas:4} },
    ko:{ r:`Tu perds. Puis tu perds encore en essayant de te refaire, ce qui est la partie la plus prévisible de la soirée.`, e:{peculium:-300} } },
  { t:'Repérer comment triche le Syrien',
    need:{ s:'scientia', min:40 },
    res:{ r:`Dés pipés au mercure. Tu le dis à voix haute. Le marchand quitte le camp cette nuit-là sans son chariot, et l’argent revient à qui de droit.`, e:{scientia:6, auctoritas:11} } },
  { t:'Faire cesser la partie et verser les mises à la caisse funéraire',
    p:'sousoff',
    res:{ r:`Tu ramasses les dés et l’argent. Personne ne discute et deux hommes te remercient le lendemain, discrètement.`, e:{disciplina:7, auctoritas:6, gratia:3} } }
  ]},

{ ch:['belgae','oceanus','atuatuca','vercingetorix','finis'], t:'Le convoi de blé', lieu:'Quarante milles en pays mal tenu',
  x:`On te charge d’escorter deux cents chariots sur quarante milles. Une cavalerie ennemie rôde et sait exactement où passer.`,
  nota:`Le ravitaillement fut la contrainte permanente des campagnes de César : il n’engageait presque jamais sans une base de vivres à portée. Les convois étaient la cible privilégiée des Gaulois, qui refusaient la bataille rangée.`,
  o:[
  { t:'Marcher lentement, en formation serrée autour des chariots',
    res:{ r:`Trois jours au lieu de deux, et deux cents chariots à l’arrivée. Le camp mange.`, e:{disciplina:7, gratia:6, valetudo:-3} } },
  { t:'Envoyer des éclaireurs loin devant et adapter l’itinéraire',
    check:{ s:'scientia', dc:52 },
    ok:{ r:`Tes éclaireurs signalent un rassemblement au gué prévu. Tu passes douze milles plus au nord par un chemin de bergers. Rien ne se passe, ce qui est le meilleur rapport d’escorte possible.`, e:{scientia:8, gratia:7} },
    ko:{ r:`L’itinéraire de contournement est impraticable pour des chariots. Tu perds une journée et tu reviens sur le gué.`, e:{valetudo:-4, gratia:-4} } },
  { t:'Acheter le renseignement à un marchand de sel qui passe chaque semaine',
    res:{ r:`Deux cents deniers à un homme qui sait tout et ne risque rien. Son information est meilleure que celle qu’on paie en sang.`, e:{scientia:6, gratia:5, peculium:-200} } }
  ]},

{ ch:['helvetii','belgae','oceanus','atuatuca','vercingetorix'], t:'Le vieux primipile', lieu:'Sous la tente du premier centurion',
  x:`T. Balventius, primipile, vingt-huit ans de service, deux fois décoré. Il te fait venir sous sa tente et te fait asseoir, ce qui n’arrive jamais.`,
  nota:`Balventius est un personnage réel : César le cite comme <span class="lat">primipilus</span> de l’année précédente, gravement blessé à Atuatuca en 54. Les primipilaires formaient l’ossature technique de l’armée et transmettaient un savoir qui n’était écrit nulle part.`,
  o:[
  { t:'L’écouter jusqu’au bout',
    res:{ r:`Il parle deux heures de choses très concrètes : où placer un homme qui a peur, comment reconnaître qu’une ligne va céder trois minutes avant qu’elle cède, pourquoi on ne court jamais devant ses propres hommes sauf une fois par carrière.`, e:{scientia:11, auctoritas:6, gratia:5} } },
  { t:'Lui demander comment on tient quand on a peur',
    res:{ r:`Il répond que personne ne tient : on fait les gestes, et les gestes tiennent l’homme. Puis il te montre lesquels, lentement, deux fois.`, e:{virtus:10, scientia:5, auctoritas:4} } },
  { t:'Lui demander de te faire entrer dans la première cohorte',
    check:{ s:'gratia', dc:58 },
    ok:{ r:`Il te regarde longtemps. « Je verrai. » Deux mois plus tard, ton nom est sur une liste où il n’aurait pas dû être.`, e:{gratia:13, auctoritas:4} },
    ko:{ r:`« Demande-le encore dans trois ans. » Il ne se fâche pas, ce qui est pire.`, e:{gratia:-6} } }
  ]},

{ ch:['belgae','oceanus','atuatuca','vercingetorix','finis','rubico'], t:'Deux hommes se sont battus', lieu:'Devant ta tente',
  x:`Coups portés au camp, ce qui est un délit grave. L’un est un vétéran indiscipliné mais excellent au combat ; l’autre une jeune recrue qui a raison sur le fond. Le règlement prévoit la bastonnade pour les deux.`,
  nota:`Polybe décrit la <span class="lat">fustuarium</span> : le condamné était battu par ses propres camarades. La discipline romaine reposait sur ce principe — la punition venait du groupe, pas seulement du chef.`,
  o:[
  { t:'Appliquer le règlement aux deux, également',
    res:{ r:`Bastonnade publique. La justice aveugle est impopulaire et tient une unité mieux que la justice clairvoyante.`, e:{disciplina:8, auctoritas:5, gratia:4} } },
  { t:'Les mettre au même contubernium et à la même corvée pendant un mois',
    res:{ r:`Un mois de latrines à deux. Au bout de trois semaines ils se couvrent mutuellement devant toi. C’est la plus vieille méthode de l’armée romaine et elle marche encore.`, e:{auctoritas:12, scientia:4} } },
  { t:'Fermer les yeux',
    check:{ s:'auctoritas', dc:58 },
    ok:{ r:`Tu n’as rien vu. Ils règlent cela entre eux et l’affaire meurt. Un officier qui voit tout ne commande rien.`, e:{auctoritas:8, disciplina:-3} },
    ko:{ r:`Le tribun de service, lui, a vu. C’est toi qu’on interroge sur ta manière de tenir ton monde.`, e:{gratia:-9, auctoritas:-5} } }
  ]},

{ ch:['helvetii','belgae','oceanus','atuatuca','vercingetorix','finis'], t:'Une lettre d’Italie', lieu:'Arrivée du courrier',
  x:`Le courrier a mis quatre mois. Il y a une lettre pour toi, écrite par un scribe public au nom de quelqu’un qui ne sait pas écrire.`,
  nota:`Les tablettes de Vindolanda, en Bretagne, ont conservé ce type de correspondance : nouvelles de famille, demandes de chaussettes et de sous-vêtements, invitations d’anniversaire. La vie ordinaire d’une armée d’occupation.`,
  o:[
  { t:'La lire tout de suite',
    check:{ s:'valetudo', dc:40 },
    ok:{ r:`Des nouvelles ordinaires : la récolte, un mariage, un procès de voisinage. Tu la relis trois fois et tu la ranges dans ton coffre. Cela suffit à tenir un hiver.`, e:{valetudo:10, auctoritas:3} },
    ko:{ r:`Une mort. Vieille de quatre mois, à laquelle tu ne peux rien, et dont personne ici ne peut parler avec toi.`, e:{valetudo:-7} } },
  { t:'Envoyer la moitié de ta solde avec le prochain convoi du questeur',
    res:{ r:`Le convoi prend une commission et arrive à peu près sûrement. Chez toi, cela change tout.`, e:{peculium:-300, valetudo:7, auctoritas:3} } },
  { t:'Écrire les lettres des illettrés de ta centurie pendant trois soirs',
    need:{ s:'scientia', min:38 },
    res:{ r:`Vingt-deux lettres. Tu apprends sur ces hommes en trois soirs ce que six ans de rang ne t’avaient pas appris.`, e:{auctoritas:12, scientia:4} } }
  ]},

{ ch:['oceanus','atuatuca','vercingetorix','finis','rubico','ultima'], t:'Le contractant', lieu:'Magasin du camp',
  x:`Un fournisseur de l’armée — blé, cuir, ferraille — te propose une commission régulière contre des réceptions complaisantes. La somme est sérieuse. Le procédé est universel et sanctionné de mort quand il est découvert, ce qui n’arrive presque jamais.`,
  nota:`Les <span class="lat">publicani</span> adjudicataires des marchés militaires formaient une puissance financière considérable, avec des protections jusqu’au Sénat. Corrompre l’officier de réception était la pratique normale, pas l’exception.`,
  o:[
  { t:'Accepter',
    res:{ r:`L’arrangement dure des années et ne se voit jamais. Tu deviens un homme aisé, avec des cuirs un peu minces sur les épaules de tes hommes.`, e:{peculium:2200, auctoritas:-9, gratia:4} } },
  { t:'Refuser et le dénoncer au questeur',
    res:{ r:`Il est chassé, ses stocks confisqués et redistribués. Trois officiers supérieurs qui étaient dans l’arrangement savent maintenant ton nom.`, e:{virtus:5, auctoritas:11, gratia:-11} } },
  { t:'Refuser sans faire d’histoire',
    res:{ r:`Tu dis non, poliment, et l’affaire s’arrête là. Il ira voir le centurion d’à côté, qui dira oui.`, e:{disciplina:5, scientia:3} } }
  ]},

{ ch:['helvetii','belgae','oceanus','vercingetorix','finis'], t:'Le valetudinarium', lieu:'Infirmerie du camp',
  x:`L’hôpital du camp est plein : dysenterie, fièvres, blessures anciennes. Le médecin manque de vinaigre, de bandes et d’un homme pour tenir les registres.`,
  nota:`Les <span class="lat">valetudinaria</span> légionnaires sont les premiers hôpitaux militaires organisés connus : pavillons à chambres, salle d’opération, égout. L’armée romaine perdait davantage d’hommes par maladie que par le fer, et le savait.`,
  o:[
  { t:'Fournir sur ta bourse ce qui manque',
    res:{ r:`Vinaigre, toile, miel, et un scribe payé un mois. Les morts de fièvre baissent d’un tiers ce trimestre. Personne ne fait le lien, sauf le médecin.`, e:{peculium:-300, auctoritas:13} } },
  { t:'Démontrer que les fièvres viennent du site et faire déplacer le camp',
    need:{ s:'scientia', min:48 },
    res:{ r:`Chiffres à l’appui, tu obtiens un déplacement d’un demi-mille sur un versant sec. C’est de la médecine sans médecine, et cela sauve plus d’hommes qu’une victoire.`, e:{scientia:11, gratia:8, auctoritas:9} } },
  { t:'Prendre ton tour de garde auprès des mourants',
    res:{ r:`Trois nuits. On ne fait rien d’autre que rester là, et c’est apparemment tout ce qu’on demande.`, e:{auctoritas:9, valetudo:-3} } }
  ]},

{ ch:['belgae','oceanus','atuatuca','vercingetorix','finis','rubico','ultima'], t:'Vingt milles avant midi', lieu:'Colonne de marche',
  x:`Marche forcée. Trente kilos par homme. César marche parfois plus vite que ses propres nouvelles, et c’est ce qui l’a fait gagner plus souvent que ses batailles.`,
  nota:`La vitesse de marche fut son arme principale : il fit soixante-dix milles en trois jours pour atteindre le camp de Cicéron, et surprit Pompée à Brindes en couvrant l’Italie plus vite qu’aucune nouvelle.`,
  o:[
  { t:'Marcher en tête avec ton paquetage complet',

  { t:'Fermer la colonne et ramasser les traînards',

/* ===== src2/app.js ===== */
/* ============================================================
   MOTEUR + INTERFACE
   ============================================================ */
const $=(id)=>document.getElementById(id);
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const rnd=(n)=>Math.floor(Math.random()*n);
const pick=(a)=>a[Math.floor(Math.random()*a.length)];
const esc=(s)=>String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const CLE='cvrsvs_v3';

let S=null;
let V={ nota:false, res:null, promo:null, onglet:'castra' };

function melange(a){ const x=[...a]; for(let i=x.length-1;i>0;i--){ const j=rnd(i+1); [x[i],x[j]]=[x[j],x[i]]; } return x; }
function romain(n){ if(n<=0) return '—';
  const t=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let r=''; for(const [v,s] of t){ while(n>=v){ r+=s; n-=v; } } return r; }
function lapid(s){ return s.toUpperCase().replace(/U/g,'V').split(' ').join('&nbsp;·&nbsp;'); }

function facteurProgres(v){
  if(v<40) return 1; if(v<55) return .70; if(v<68) return .46;
  if(v<78) return .28; if(v<86) return .16; return .07;
}
function attenuer(v,n){ const b=n*facteurProgres(v), e=Math.floor(b); return e+(Math.random()<(b-e)?1:0); }

/* ---------- séquence ---------- */
function construireSeq(ph){
  const fixes=ph.events.filter(e=>e.at!==undefined);
  const libres=melange(ph.events.filter(e=>e.at===undefined));
  const reserve=melange(COMMUNS.filter(e=>e.ch.includes(ph.id) && !S.vus.includes(e.t)));
  const seq=new Array(ph.len).fill(null);
  fixes.forEach(e=>{ let i=Math.min(e.at,ph.len-1),g=0;
    while(seq[i]&&g<ph.len){ i=(i+1)%ph.len; g++; } seq[i]=e; });
  const pool=[...libres,...reserve]; let pi=0;
  for(let i=0;i<ph.len;i++) if(!seq[i]&&pi<pool.length) seq[i]=pool[pi++];
  return seq.filter(Boolean);
}
function chapitre(){ return S.pompee?POMPEE:PHASES[S.ch]; }
function evenement(){ return S.seq[S.t]; }
function annee(){ const p=chapitre(); return p.y0+Math.round((S.t/Math.max(1,p.len-1))*(p.y1-p.y0)); }
function portee(){ return RANKS[S.rank].p; }
function totalEv(){ return PHASES.reduce((a,p)=>a+p.len,0); }
function faitEv(){ let n=0; for(let i=0;i<S.ch;i++) n+=PHASES[i].len; return n+S.t; }

/* ---------- création ---------- */
function nouvelle(o){
  S={ nom:nomRomain(), orig:o.n, s:{...o.s}, peculium:o.p, rank:1, ch:0, seq:[], t:0,
      vulnera:[], dona:[], log:[], notas:[], liens:{}, vus:[], fin:null, pompee:false, finPromo:null };
  S.seq=construireSeq(PHASES[0]);
  S.log.push({ y:PHASES[0].y0, t:`Sacramentum — ${o.n}` });
  V={ nota:false, res:null, promo:null, onglet:'castra' };
  sauver(); rendre();
}

/* ---------- options ---------- */
function etatOption(o){
  const pi=PORTEE.indexOf(portee()), oi=PORTEE.indexOf(o.p||'soldat');
  if(oi>pi+1) return {cache:true};
  if(oi>pi) return {verrou:PORTEE_N[o.p].n+' requis'};
  if(o.need){ const st=STATS.find(x=>x.k===o.need.s);
    if((S.s[o.need.s]||0)<o.need.min) return {verrou:`${st.n} ${o.need.min}`}; }
  return {};
}
function proba(c){ return Math.round(clamp((S.s[c.s]+25-c.dc+1)/26,0,1)*100); }

/* Aperçu d'une option : on annonce le PRIX, jamais la récompense.
   Un homme sait d'avance si une chose est dangereuse, coûteuse ou sans retour.
   Il ne sait pas qu'elle lui vaudra onze points de courage : cela, il faut le
   lire dans ce qu'on lui décrit — et le découvrir après. */
function apercu(o){
  const out=[];
  const a=(o.res&&o.res.e)||{}, b=(o.ok&&o.ok.e)||{}, c=(o.ko&&o.ko.e)||{};
  const val=Math.min(a.valetudo||0, b.valetudo||0, c.valetudo||0);
  const pec=(a.peculium||0)+(b.peculium||0);
  const blessure=a.vulnus||b.vulnus||c.vulnus;

  if(o.check){
    const p=proba(o.check);
    const mot = p>=78?'tu t’en crois capable' : p>=55?'c’est jouable'
              : p>=32?'c’est incertain'      : 'c’est au-delà de toi';
    out.push({c:'pari', i:'clepsydra', t:mot});
  }
  if(blessure)      out.push({c:'perte', i:'gladius', t:'blessure certaine'});
  else if(val<=-15) out.push({c:'perte', i:'gladius', t:'tu peux y rester'});
  else if(val<=-8)  out.push({c:'perte', i:'gladius', t:'sanglant'});
  else if(val<=-3)  out.push({c:'perte', i:'gladius', t:'rude'});

  if((a.valetudo||0)>0 || (o.res&&o.res.soin)) out.push({c:'gain', i:'caduceus', t:'tu y reprendras des forces'});
  if(pec>0)  out.push({c:'gain',  i:'nummus', t:'cela rapporte'});
  if(pec<0)  out.push({c:'perte', i:'nummus', t:'cela coûte'});
  if(o.res&&o.res.choix) out.push({c:'pari', i:'libra', t:'sans retour'});
  if(!out.length) out.push({c:'verrou', i:'signum', t:'sans danger'});
  return out;
}

/* L'emblème dit la NATURE de l'acte, la teinte dit son PRIX.
   Ni l'un ni l'autre ne révèle ce que l'action rapporte. */
const ACTES=[
  /* argent et marchandise */
  [/pay|achet|rachet|vend|bours|deniers|solde|prix|commission|spécul|butin|part|investi|redistribu|lot/i,'nummus'],
  /* écrit, calcul, savoir */
  [/écri|lettre|registre|compt|rédig|consign|list|grec|vérifi|apprend|étudi|instrui|nager|lire|testament|croquis|carte/i,'volumen'],
  /* parole */
  [/dis|dire|parl|répond|expliq|discours|plaid|object|propos|demand|négoci|trait|sond|serment|signal|crier|cri|rameut|interpell|convainc|prêt|écout|répliqu|suppli/i,'signum'],
  /* justice, décision, commandement formel */
  [/juge|arbitr|tranch|partag|règl|sanction|interdi|ordonn|appliqu|exécut|désign|refus|accept|décid|congé|rendre|assum|couvrir dans/i,'libra'],
  /* tenir, protéger, encadrer */
  [/tenir|tiens|rang|serr|gard|couvr|form|carré|cercle|rempart|poste|attend|investir|rester|maintien|reformer|rassembl|relev|protég|épargn|sauv/i,'scutum'],
  /* agir au fer */
  [/charg|sort|aller|cherch|mont|saut|franch|pouss|frapp|attaqu|assaut|porter l|lanc|jeter|forcer|décal|face|flanc|enfonc|poursuiv|corrig|abord|abattre|prendre la tête|first/i,'gladius'],
  /* génie et travail */
  [/creus|bâti|pont|terrass|fortif|galerie|ouvrag|répar|équip|barqu|dériv|mine|sappe|travail|doubl|exercice|palissad|camp/i,'templum'],
  /* soin et repos */
  [/soign|repos|panse|blessé|médec|dormir|fournir|eau|malade|hiver/i,'caduceus'],
  /* mouvement et reconnaissance */
  [/march|colonn|convoi|escort|reconna|éclaireur|itinérair|embarqu|passer|travers|rentr|suivre|partir|fuir|décroch/i,'vexillum'],
  /* faveur et présence */
  [/voir des officiers|faire voir|dîner|présent|se fondre|ne rien|se taire|fermer les yeux|laisser|mêler/i,'laurea']
];
function emblemeActe(t){
  for(const [re,ic] of ACTES) if(re.test(t)) return ic;
  return 'laurea';
}
function styleChoix(o){
  const a=(o.res&&o.res.e)||{}, b=(o.ok&&o.ok.e)||{}, c=(o.ko&&o.ko.e)||{};
  const val=Math.min(a.valetudo||0, b.valetudo||0, c.valetudo||0);
  const blessure=a.vulnus||b.vulnus||c.vulnus;
  let cls='vert';
  if(blessure||val<=-12) cls='rouge';
  else if(val<=-3||o.check) cls='bleu';
  return { cls, ic: (o.res&&o.res.choix) ? 'libra' : emblemeActe(o.t) };
}

/* ---------- résolution ---------- */
function choisir(i){
  const ev=evenement(), o=ev.o[i], et=etatOption(o);
  if(et.cache||et.verrou) return;
  let res=o.res, ok=true, parie=false;
  if(o.check){ parie=true; ok=(S.s[o.check.s]+rnd(26))>=o.check.dc; res=ok?o.ok:o.ko; }
  const e=res.e||{}, notes=[], avant={...S.s};
  STATS.forEach(st=>{ if(!e[st.k]) return;
    let d=e[st.k]; if(d>0&&st.k!=='valetudo') d=attenuer(S.s[st.k],d);
    S.s[st.k]=clamp(S.s[st.k]+d); });
  if(e.peculium) S.peculium=Math.max(0,S.peculium+e.peculium);
  if(e.vulnus){ const v=blesser(); if(v) notes.push({c:'perte', i:'gladius', t:v.n}); }
  if(res.soin&&S.vulnera.length){ const v=S.vulnera.shift();
    for(const k in v.e) S.s[k]=clamp(S.s[k]-v.e[k]); notes.push({c:'gain', i:'caduceus', t:'Cicatrisé : '+v.n}); }
  if(e.dona&&!S.dona.includes(e.dona)){ S.dona.push(e.dona); notes.push({c:'gain', i:'laurea', t:e.dona}); }
  if(res.lien) for(const k in res.lien) S.liens[k]=(S.liens[k]||0)+res.lien[k];

  const eff=[];
  STATS.forEach(st=>{ const d=S.s[st.k]-avant[st.k];
    if(d) eff.push({c:d>0?'gain':'perte', i:st.i, t:`${d>0?'+':''}${d} ${st.n}`}); });
  if(e.peculium) eff.push({c:e.peculium>0?'gain':'perte', i:'nummus', t:`${e.peculium>0?'+':''}${e.peculium} deniers`});
  eff.push(...notes);

  S.log.push({ y:annee(), t:`${ev.t} — ${o.t}` });
  if(!S.vus.includes(ev.t)) S.vus.push(ev.t);
  if(ev.nota && !S.notas.some(n=>n.t===ev.t)) S.notas.push({ t:ev.t, x:ev.nota, y:annee() });

  V.res={ x:res.r, eff, parie, ok, nota:ev.nota, mort:S.s.valetudo<=0, choix:res.choix||null };
  V.nota=false; sauver(); rendre();
}
function blesser(){
  const libres=VULNERA.filter(v=>!S.vulnera.some(x=>x.n===v.n));
  if(!libres.length){ S.s.valetudo=clamp(S.s.valetudo-10); return null; }
  const v=pick(libres); S.vulnera.push(v);
  for(const k in v.e) S.s[k]=clamp(S.s[k]+v.e[k]);
  return v;
}

/* ---------- suite ---------- */
function suite(){
  const r=V.res;
  if(r.mort){ finir('mort'); return; }
  if(r.choix){
    if(r.choix==='missio'||r.choix==='missio_riche'){ finir(r.choix); return; }
    if(r.choix==='afrique'){ finir('victis'); return; }
    if(r.choix==='pompee'){ S.pompee=true; S.seq=construireSeq(POMPEE); S.t=0; V.res=null; sauver(); rendre(); return; }
    if(r.choix==='venia'){
      S.pompee=false; S.rank=Math.max(1,S.rank-1);
      S.ch=PHASES.length-1; S.seq=construireSeq(PHASES[S.ch]); S.t=0;
      S.log.push({ y:-48, t:'Rendu et pardonné — grade réduit' });
      V.res=null; sauver(); rendre(); return; }
  }
  V.res=null;
  if(S.t+1<S.seq.length){
    S.t++;
    S.peculium=Math.max(0, S.peculium + Math.round(RANKS[S.rank].pay/3) - (S.rank<4?55:25));
    sauver(); rendre(); return;
  }
  let r2=S.rank;
  while(r2<RANKS.length-1){ const g=PROMO.find(p=>p.to===r2+1); if(g&&g.req(S.s)) r2++; else break; }

  /* Dernier chapitre : la carrière s'arrête ici. Un grade dont les conditions
     sont réunies après la dernière décision ne s'exerce jamais — on le
     mentionne à la démobilisation, on ne l'attribue pas. */
  if(S.pompee || S.ch+1>=PHASES.length){
    S.finPromo = r2>S.rank ? r2 : null;
    finir(S.pompee?'victis':'carriere'); return;
  }

  const promu=r2>S.rank, de=S.rank;
  if(promu) S.log.push({ y:annee(), t:`Promotion : ${RANKS[r2].n}` });
  S.rank=r2;
  V.promo={ promu, de, a:r2, suivant:PHASES[S.ch+1] };
  sauver(); rendre();
}
function chapitreSuivant(){
  S.ch++; S.seq=construireSeq(PHASES[S.ch]); S.t=0;
  S.s.valetudo=clamp(S.s.valetudo + 8 + Math.round((S.s.disciplina||0)/14));
  V.promo=null; V.onglet='castra'; sauver(); rendre();
}
function finir(type){ S.fin={ type, an:annee() }; sauver(); rendre(); }
function onglet(o){ V.onglet=o; rendre(); window.scrollTo(0,0); }

function sauver(){ try{ localStorage.setItem(CLE,JSON.stringify(S)); }catch(e){} }
function charger(){ try{ const r=localStorage.getItem(CLE); return r?JSON.parse(r):null; }catch(e){ return null; } }
function effacer(){ try{ localStorage.removeItem(CLE); }catch(e){} }
function recommencer(){ effacer(); S=null; V={nota:false,res:null,promo:null,onglet:'castra'}; rendre(); }

/* ============================================================
   RENDU
   ============================================================ */
function rendre(){
  if(!S) return coque(ecranIntro(), false);
  if(S.fin) return coque(ecranFin(), false);
  if(V.promo) return coque(ecranPromo(), false);
  const ec = { castra:ecranCastra, campagne:ecranCampagne, acta:ecranActa,
               nota:ecranNota, cursus:ecranCursus }[V.onglet] || ecranCastra;
  coque(ec(), true);
}

function coque(html, nav){
  const ph = S && !S.fin ? chapitre() : null;
  $('app').innerHTML=`
  <div class="app">
    <div class="banniere">
      <div class="aigle">${icone('aquila')}</div>
      <div class="titre">LEGIO X EQVESTRIS</div>
      <div class="sous-titre">Gaule &amp; guerre civile · 58–45</div>
      ${ph?`<div class="banniere-legende">${esc(ph.n)} · ${esc(ph.sub)}</div>`:
           `<div class="banniere-legende">De la recrue au primipile</div>`}
    </div>
    ${html}
    ${nav?barreNav():''}
  </div>`;
}

const ONGLETS=[
  {id:'castra',   n:'Castra',   i:'templum'},
  {id:'campagne', n:'Campagne', i:'volumen'},
  {id:'acta',     n:'Acta',     i:'libra'},
  {id:'nota',     n:'Nota',     i:'signum'},
  {id:'cursus',   n:'Cursus',   i:'capita'}
];
function barreNav(){
  return `<div class="nav">${ONGLETS.map(o=>`
    <button class="nav-b ${V.onglet===o.id?'on':''}" onclick="onglet('${o.id}')">
      ${icone(o.i)}<span>${o.n}</span>
    </button>`).join('')}</div>`;
}

/* ---------- bandeaux communs ---------- */
function barrePerso(){
  const R=RANKS[S.rank], pct=Math.round(faitEv()/totalEv()*100);
  return `<div class="cadre"><div class="perso">
    <div class="portrait">${icone('capita')}<div class="grade-ecu">${romain(S.rank)}</div></div>
    <div class="perso-c">
      <div class="perso-n">${esc(S.nom||S.orig)}</div>
      <div class="perso-g">${icone('laurea')}${esc(R.n)}</div>
      <div class="xp">
        <div class="xp-b"><i style="width:${pct}%"></i></div>
        <div class="xp-n">${faitEv()} / ${totalEv()}</div>
      </div>
    </div>
    <div class="vexille">
      <div class="vexille-t">LEG·X</div>${icone('aquila')}
      <div class="vexille-n">EQVEST</div>
    </div>
  </div></div>`;
}
function bandeauAttrs(){
  return `<div class="attrs">${STATS.map(st=>{
    const v=S.s[st.k], bas=(st.k==='valetudo'&&v<35), haut=v>=75;
    return `<div class="at ${bas?'bas':''} ${haut?'haut':''}">
      ${icone(st.i)}
      <div class="at-n">${st.n}</div>
      <div class="at-v">${v}</div>
    </div>`;
  }).join('')}</div>
  <div class="cadre"><div class="perso" style="padding:9px 14px;gap:10px;">
    <div style="display:flex;align-items:center;gap:7px;flex:1;">
      ${icone('nummus')}<span style="font-family:var(--data);font-size:13px;color:var(--or-vif);">${S.peculium.toLocaleString('fr-FR')}</span>
      <span style="font-family:var(--caps);font-size:9px;letter-spacing:.16em;color:var(--gris-2);">DENIERS</span>
    </div>
    <div style="display:flex;align-items:center;gap:7px;">
      ${icone('scutum')}<span style="font-family:var(--caps);font-size:10px;letter-spacing:.13em;color:var(--or);">${PORTEE_N[portee()].n}</span>
    </div>
  </div></div>`;
}

/* ---------- CASTRA : l'événement ---------- */
function ecranCastra(){
  const ev=evenement(), r=V.res, ph=chapitre();
  return `
  ${barrePerso()}
  ${bandeauAttrs()}
  <div class="cadre ${ev.guerre?'guerre':''}">
    <div class="cadre-t">${ev.guerre?'Acies':'Castra'} · ${romain(S.t+1)} / ${romain(S.seq.length)}</div>
    <div class="cadre-b">
      <div class="grav">
        ${scene(ev.guerre?'acies':'castra')}
        <div class="grav-l">${esc(ev.lieu||ph.sub)}</div>
      </div>
      <div class="ev-t">${ev.t}</div>
      <div class="ev-l">${Math.abs(annee())} av. J.-C.</div>
      <div class="ev-x">${ev.x}</div>
      ${ev.vue&&ev.vue[portee()]?`<div class="vue">
        <b>${icone('scutum')}Ce que tu vois — ${PORTEE_N[portee()].n}</b>
        <span>${esc(ev.vue[portee()])}</span></div>`:''}
      ${r?blocResultat(r):blocChoix(ev)}
    </div>
  </div>`;
}
function blocChoix(ev){
  return `<div class="choix">${ev.o.map((o,i)=>{
    const et=etatOption(o); if(et.cache) return '';
    const st=styleChoix(o), ap=apercu(o);
    return `<button class="ch ${et.verrou?'':st.cls}" ${et.verrou?'disabled':''} onclick="choisir(${i})">
      <div class="medaille">${icone(et.verrou?'sera':st.ic)}</div>
      <div class="ch-c">
        <div class="ch-t">${esc(o.t)}</div>
        ${o.note?`<div class="ch-note">${esc(o.note)}</div>`:''}
        <div class="puces">${et.verrou
          ? `<span class="puce verrou">${icone('sera')}${esc(et.verrou)}</span>`
          : ap.map(a=>`<span class="puce ${a.c}">${icone(a.i)}${esc(a.t)}</span>`).join('')}</div>
      </div>
      <div class="ch-fl">›</div>
    </button>`;
  }).join('')}</div>`;
}
function blocResultat(r){
  return `<div class="res">
    ${r.parie?`<div class="verdict ${r.ok?'ok':'ko'}">${icone(r.ok?'check':'gladius')}${r.ok?'Réussi':'Manqué'}</div>`:''}
    <div class="res-x">${r.x}</div>
    ${r.eff.length?`<div class="res-e">${r.eff.map(e=>`<span class="puce ${e.c}">${icone(e.i)}${esc(e.t)}</span>`).join('')}</div>`:''}
    ${r.nota?`<div class="nota">
      <button class="nota-b" onclick="V.nota=!V.nota;rendre()">${icone('nota_i')}${V.nota?'Masquer la nota':'Nota historica'}</button>
      ${V.nota?`<div class="nota-x">${r.nota}</div>`:''}
    </div>`:''}
    <div class="cta-w">${icone('laurea')}
      <button class="cta" onclick="suite()">${r.mort?'Voir la pierre':'Poursuivre'}</button>
      ${icone('laurea')}</div>
  </div>`;
}

/* ---------- CAMPAGNE ---------- */
function ecranCampagne(){
  return `${barrePerso()}
  <div class="cadre"><div class="cadre-t">Carte de campagne</div><div class="cadre-b">
    ${PHASES.map((p,i)=>{
      const etat = i<S.ch?'fait' : i===S.ch?'ici' : 'suiv';
      const ic = i<S.ch?'check' : i===S.ch?'vexillum' : 'sera';
      return `<div class="rail-l ${etat}">
        <div class="rail-p">${icone(ic)}</div>
        <div class="rail-c">
          <div class="rail-t">${esc(p.n)}</div>
          <div class="rail-d">${i===S.ch?`En cours · ${romain(S.t+1)}/${romain(p.len)}`:esc(p.sub)}</div>
          ${i===S.ch?`<div style="margin-top:6px;"><div class="exig-b"><i style="width:${Math.round((S.t+1)/p.len*100)}%"></i></div></div>`:''}
        </div>
        <div class="ligne-v">${Math.abs(p.y0)}${p.y1!==p.y0?'–'+Math.abs(p.y1):''}</div>
      </div>`;
    }).join('')}
  </div></div>`;
}

/* ---------- ACTA ---------- */
function ecranActa(){
  return `${barrePerso()}
  <div class="cadre"><div class="cadre-t">Acta diurna · ${S.log.length} entrées</div><div class="cadre-b">
    <div class="log">${[...S.log].reverse().map(l=>
      `<div><span class="y">${Math.abs(l.y)} av. J.-C.</span> — ${esc(l.t)}</div>`).join('')}</div>
  </div></div>`;
}

/* ---------- NOTA ---------- */
function ecranNota(){
  return `${barrePerso()}
  <div class="cadre"><div class="cadre-t">Nota historica · ${S.notas.length}</div><div class="cadre-b">
    ${S.notas.length? [...S.notas].reverse().map(n=>`
      <div style="padding:11px 0;border-bottom:1px solid rgba(122,96,49,.2);">
        <div class="ligne-t" style="display:flex;align-items:center;gap:8px;">${icone('signum')}${esc(n.t)}</div>
        <div class="nota-x" style="margin-top:7px;">${n.x}</div>
      </div>`).join('')
      : `<div class="vide">Les notes s’accumulent au fil des décisions.</div>`}
  </div></div>`;
}

/* ---------- CURSUS ---------- */
function ecranCursus(){
  const suiv=S.rank+1<RANKS.length?PROMO.find(p=>p.to===S.rank+1):null;
  let jeu=null, manque=[];
  if(suiv){
    jeu = suiv.seuils.map(j=>({j, n:Object.keys(j).filter(k=>(S.s[k]||0)<j[k]).length}))
           .sort((a,b)=>a.n-b.n)[0].j;
    manque=Object.entries(jeu);
  }
  return `${barrePerso()}
  <div class="cadre"><div class="cadre-t">Cursus honorum</div><div class="cadre-b">
    ${RANKS.map((R,i)=>{
      const etat=i<S.rank?'fait':i===S.rank?'ici':i===S.rank+1?'suiv':'';
      if(i>S.rank+2) return '';
      return `<div class="rail-l ${etat}">
        <div class="rail-p">${icone(i<S.rank?'check':i===S.rank?'laurea':i===S.rank+1?'chevron':'sera')}</div>
        <div class="rail-c">
          <div class="rail-t">${esc(R.n)}</div>
          <div class="rail-d">${i===S.rank?'Grade actuel':(i===S.rank+1?'Grade suivant':esc(R.fr))}</div>
        </div>
        <div class="ligne-v">${R.pay?R.pay.toLocaleString('fr-FR')+' d.':''}</div>
      </div>`;
    }).join('')}
  </div></div>

  ${suiv?`<div class="cadre"><div class="cadre-t">Pour devenir ${esc(RANKS[S.rank+1].n)}</div><div class="cadre-b">
    <p class="ev-x" style="font-size:16px;margin-bottom:12px;font-style:italic;color:var(--gris);">${esc(suiv.why)}</p>
    ${manque.map(([k,seuil])=>{
      const st=STATS.find(x=>x.k===k), v=S.s[k]||0, ok=v>=seuil;
      return `<div class="exig">
        <div class="exig-t">${icone(st.i)}<span class="exig-n">Atteindre ${st.n} ${seuil}</span>
          <span class="exig-v ${ok?'ok':''}"><b>${v}</b> / ${seuil}</span></div>
        <div class="exig-b ${ok?'ok':''}"><i style="width:${Math.min(100,Math.round(v/seuil*100))}%"></i></div>
      </div>`;
    }).join('')}
    ${suiv.seuils.length>1?`<p class="hint" style="margin-top:12px;text-align:left;">Une autre voie existe : ${suiv.seuils.filter(j=>j!==jeu).map(j=>Object.entries(j).map(([k,v])=>STATS.find(x=>x.k===k).n+' '+v).join(' + ')).join(' · ')}</p>`:''}
  </div></div>`:''}

  <div class="cadre"><div class="cadre-t">Attributs</div><div class="cadre-b">
    ${STATS.map(st=>`<div class="exig">
      <div class="exig-t">${icone(st.i)}<span class="exig-n">${st.n}<span style="color:var(--gris-2);font-style:italic;font-size:13.5px;"> — ${st.d}</span></span>
        <span class="exig-v"><b>${S.s[st.k]}</b></span></div>
      <div class="exig-b"><i style="width:${clamp(S.s[st.k])}%"></i></div>
    </div>`).join('')}
  </div></div>

  ${(S.dona.length||S.vulnera.length)?`<div class="cadre"><div class="cadre-t">Corps et honneurs</div><div class="cadre-b">
    ${S.dona.map(d=>`<div class="ligne">${icone('laurea')}<div class="ligne-c"><div class="ligne-t">${esc(d)}</div>
      <div class="ligne-d">Dona militaria</div></div></div>`).join('')}
    ${S.vulnera.map(v=>`<div class="ligne">${icone('gladius')}<div class="ligne-c"><div class="ligne-t" style="color:var(--rouge);">${esc(v.n)}</div>
      <div class="ligne-d">${esc(v.d)}</div></div></div>`).join('')}
  </div></div>`:''}`;
}

/* ---------- PROMOTION ---------- */
function ecranPromo(){
  const p=V.promo, g=PROMO.find(x=>x.to===p.a);
  return `
  ${barrePerso()}
  <div class="cadre"><div class="promo">
    ${p.promu?`
      ${icone('chevron','gros')}
      <div class="promo-de">${esc(RANKS[p.de].n)} devient</div>
      <div class="promo-a">${lapid(RANKS[p.a].n)}</div>
      <div class="promo-w">${esc(g?g.why:'')}</div>
      <div class="promo-w" style="margin-top:14px;color:var(--or);font-style:normal;font-size:15px;">
        Ta vue passe à <b>${PORTEE_N[RANKS[p.a].p].n}</b> — tu vois désormais ${esc(PORTEE_N[RANKS[p.a].p].vue)}.
      </div>`
    :`
      ${icone('laurea','gros')}
      <div class="promo-de">Tu restes</div>
      <div class="promo-a" style="background:linear-gradient(180deg,#9C8C6E,#6E6249);-webkit-background-clip:text;background-clip:text;">${lapid(RANKS[S.rank].n)}</div>
      <div class="promo-w">Le camp n’a pas encore vu ce qu’il attend. Consulte le <b style="color:var(--or);">Cursus</b> pour savoir ce qui manque.</div>`}
  </div></div>
  <div class="cadre"><div class="cadre-t">Quartiers d’hiver</div><div class="cadre-b">
    <p class="ev-x" style="font-size:16px;font-style:italic;color:var(--gris);">On recoud ce qui avait été recousu vite. Le chapitre suivant s’ouvre : <b style="color:var(--or-vif);font-style:normal;">${esc(p.suivant.n)}</b> — ${esc(p.suivant.sub)}.</p>
    <div class="cta-w" style="margin-left:0;margin-right:0;">${icone('laurea')}
      <button class="cta" onclick="chapitreSuivant()">Reprendre la marche</button>${icone('laurea')}</div>
  </div></div>`;
}

/* ---------- ACCUEIL ---------- */
function ecranIntro(){
  const sv=charger();
  return `
  <div class="cadre"><div class="cadre-b" style="padding-top:15px;">
    <p class="ev-x">Tu t’engages pour seize ans dans la dixième légion, sous un proconsul de quarante-deux ans qui vient d’obtenir la Gaule et qui a des dettes considérables. Il s’appelle Caius Iulius Caesar.</p>
    <p class="ev-x">Une décision par écran, cinquante-quatre en tout — et <strong>ce que tu vois du champ dépend de ton grade</strong>. Un légionnaire voit vingt pas de poussière ; un primipile voit la ligne entière.</p>
    <p class="ev-x" style="color:var(--gris-2);font-style:italic;">Le prix d’une décision t’est annoncé ; jamais ce qu’elle te rapporte. Il faut lire pour le savoir. On peut mourir.</p>
  </div></div>
  <div class="cadre"><div class="cadre-t">Ton origine</div><div class="cadre-b">
    ${ORIGINES.map((o,i)=>`
      <button class="orig-l" onclick="nouvelle(ORIGINES[${i}])">
        <div class="medaille">${icone(['galea','volumen','manus','signum','laurea'][i]||'signum')}</div>
        <div style="flex:1;">
          <div class="orig-n">${esc(o.n)}</div>
          <div class="orig-d">${esc(o.d)}</div>
          <div class="orig-e">${STATS.filter(s=>s.k!=='valetudo').map(s=>s.n.slice(0,4).toUpperCase()+' '+o.s[s.k]).join(' · ')}</div>
        </div>
        <div class="ch-fl">›</div>
      </button>`).join('')}
    ${sv&&!sv.fin?`<div class="cta-w" style="margin-left:0;margin-right:0;">
      <button class="cta sombre" onclick="S=charger();V.onglet='castra';rendre()">Reprendre la partie en cours</button></div>`:''}
    <p class="hint" style="margin-top:14px;">La partie se sauvegarde dans ce navigateur.</p>
  </div></div>`;
}

/* ---------- FIN ---------- */
function ecranFin(){
  const t=S.fin.type, R=RANKS[S.rank];
  let titre, texte;
  if(t==='mort'){ titre='D&nbsp;&nbsp;&nbsp;&nbsp;M';
    texte=`Mort en service, l’an ${Math.abs(S.fin.an)} avant l’ère, sous les enseignes de la Dixième.`; }
  else if(t==='missio'){ titre='MISSIO';
    texte=`Tu as quitté l’armée au Rubicon, avec ta solde et sans ta part des guerres civiles. Douze ans plus tard, quand on parlera de César dans ta ville, tu diras que tu as servi en Gaule et l’on ne te croira qu’à moitié.`; }
  else if(t==='missio_riche'){ titre='MISSIO&nbsp;·&nbsp;HONESTA';
    texte=`Congé régulier obtenu en Campanie, avec les terres et la prime. Tu as vu la Sambre, Alésia et Pharsale, et tu es sorti debout avec des biens — ce que quatre-vingt-dix hommes sur cent n’ont pas fait.`; }
  else if(t==='victis'){ titre='VICTIS';
    texte=`Tu es resté du côté du Sénat. Il n’y a plus de Sénat qui commande des armées, plus de Caton, plus de Labienus. On ne t’a pas proscrit : on t’a oublié, ce qui prend plus longtemps.`; }
  else { titre='MISSIO&nbsp;·&nbsp;HONESTA';
    const o=S.rank;
    const h = o>=7?'Le primipilat achevé, tu passes dans l’ordre équestre. Ton fils portera l’anneau d’or sans avoir marché.'
      : o>=5?'Le centurionat te vaut une terre, une clientèle et le droit qu’on te salue dans ta ville.'
      : o>=4?'Le grade de principal double ta prime et te vaut un lot correct.'
      : 'Le lot ordinaire du légionnaire : de la terre, et de la terre qu’il faut défricher.';
    texte=`Mars 45 : Munda est la dernière bataille. Devant la table des questeurs, on lit ton dossier à voix haute.<br><br>${h}<br><br>Dans onze mois, aux ides de mars, l’homme que tu as suivi treize ans sera tué au pied de la statue de Pompée par soixante sénateurs, dont quatorze qu’il avait épargnés à Pharsale. Tu l’apprendras par un colporteur, en labourant.`; }
  const ans=Math.max(1,58-Math.abs(S.fin.an)+1);
  return `
  <div class="stone">
    <div class="st-l dm">${titre}</div>
    <div class="st-l big">${lapid(S.nom||R.n)}</div>
    <div class="st-l">${lapid(R.n)}</div>
    <div class="st-l">LEG&nbsp;·&nbsp;X&nbsp;·&nbsp;EQVESTRIS</div>
    <div class="st-l">STIPENDIORVM&nbsp;·&nbsp;${romain(ans)}</div>
    ${S.dona.length?`<div class="st-l">${S.dona.map(d=>lapid(d)).join('&nbsp;&nbsp;')}</div>`:''}
    <div class="st-l">${t==='mort'?'H&nbsp;·&nbsp;S&nbsp;·&nbsp;E':'V&nbsp;·&nbsp;S&nbsp;·&nbsp;L&nbsp;·&nbsp;M'}</div>
    <div class="st-f">${texte}</div>
  </div>
  ${bandeauAttrs()}
  <div class="cadre"><div class="cadre-t">États de service</div><div class="cadre-b">
    ${S.finPromo?`<div class="ligne">${icone('chevron')}<div class="ligne-c">
      <div class="ligne-t" style="color:var(--or-vif);">${esc(RANKS[S.finPromo].n)}</div>
      <div class="ligne-d">Tu en remplissais les conditions à ta démobilisation. Le grade a été porté sur ton dossier ; tu ne l’auras jamais exercé.</div>
    </div></div>`:''}
    <div class="ligne">${icone('capita')}<div class="ligne-c"><div class="ligne-t">${esc(S.orig)}</div>
      <div class="ligne-d">Origine</div></div></div>
    <div class="ligne">${icone('nummus')}<div class="ligne-c"><div class="ligne-t">${S.peculium.toLocaleString('fr-FR')} deniers</div>
      <div class="ligne-d">Peculium à la démobilisation</div></div></div>
    ${S.vulnera.map(v=>`<div class="ligne">${icone('gladius')}<div class="ligne-c">
      <div class="ligne-t" style="color:var(--rouge);">${esc(v.n)}</div><div class="ligne-d">${esc(v.d)}</div></div></div>`).join('')}
  </div></div>
  <div class="cadre"><div class="cadre-t">Nota recueillies · ${S.notas.length}</div><div class="cadre-b">
    <div class="log">${S.notas.map(n=>`<div><span class="y">${Math.abs(n.y)}</span> — ${esc(n.t)}</div>`).join('')||'—'}</div>
  </div></div>
  <div class="cta-w">${icone('laurea')}<button class="cta" onclick="recommencer()">Une autre carrière</button>${icone('laurea')}</div>`;
}

window.addEventListener('DOMContentLoaded',()=>{
  const s=charger(); if(s&&!s.fin) S=s;
  rendre();
});

</script>
